[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaica"
version = "0.1.0"
description = "Python/Pyomo rewrite of the MOSAICA crop-allocation optimization model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyomo>=6.7",
    "highspy>=1.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["core*", "case_studies*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
