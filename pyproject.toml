[project]
name = "mosaica"
version = "0.1.0"
description = "Python/Pyomo rewrite of the MOSAICA crop-allocation optimization model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
