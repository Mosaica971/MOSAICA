# Deux mesures du budget de main-d'oeuvre de reference (GAMS MO_Expl_init, ENTREES.txt:466-469),
# toutes deux sur la configuration de parite `calib_gams_parite_prix`.
#
# POURQUOI. Le budget que `Eq_MO_MAX_Expl` accorde a chaque exploitation est calcule chez nous
# en valorisant chaque groupe RPG observe par une culture fine representante, faute d'assolement
# fin. Le GAMS, lui, lit `Matrice_Parc_Cult` qui porte l'ITK FIN par parcelle. On dispose
# desormais de cet assolement fin (context/SORTIES/ASSOL_PARC_INIT.TXT), d'ou ces deux runs.
#
# CONTROLE PREALABLE : nos temps de travaux appliques a l'allocation CALIB du GAMS donnent
# 5 292 156 h contre les 5 292 000 h de son INDICATEURS.TXT -- 0,003 %, l'arrondi de GAMS.
# La table de main-d'oeuvre est donc exacte, et les totaux ci-dessous sont comparables.
#
#   representant (defaut actuel) : 6 252 740 h
#   assolement fin observe       : 5 592 326 h
#   chiffre propose par Clement  : 6 712 553 h
#
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/scenarios_mo.yaml

runs:
  - name: mo_fin_observe
    description: >-
      Budget de main-d'oeuvre par exploitation recalcule sur l'assolement FIN observe de 2017,
      a la lettre de ENTREES.txt:466-469. Total 5 592 326 h, soit 10,6 % SOUS le defaut : la
      contrainte se resserre. 795 exploitations voient leur budget baisser, 456 l'inverse,
      50 tombent a zero (leur assolement observe est entierement en NC ou en jachere) --
      comportement fidele, le GAMS les fige de la meme facon.
    disable: [bc_quota_max, pn_prod_min]
    overrides:
      data.fine_baseline_allocation: context/SORTIES/ASSOL_PARC_INIT.TXT

  - name: mo_6712553
    description: >-
      Le chiffre propose par Clement, 6 712 553 h, applique comme un facteur uniforme sur les
      budgets par defaut : slack = 6 712 553 / 6 252 740 = 1,073538. Total 7,3 % AU-DESSUS du
      defaut, donc la contrainte se RELACHE. A lire comme un test de sensibilite : le facteur
      est uniforme, il ne redistribue rien entre exploitations.
    disable: [bc_quota_max, pn_prod_min]
    set_args:
      - {label: mo_max_expl, args: {slack: 1.073538}}
