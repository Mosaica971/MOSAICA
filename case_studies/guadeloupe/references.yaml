# The dashboard's reference runs: which `outputs/` folder plays which role.
#
# WHY THIS FILE EXISTS. The Comparison page can show any series (run × side), but three of
# them are not scenarios among others: they are the fixed points everything else is read
# against. Naming them here rather than re-picking them every time the dashboard opens makes
# the choice explicit, versioned and justifiable -- and each entry's `note:` carries the
# justification.
#
# HOW TO REGENERATE THEM. The two calibration runs are described in
# `scenarios_calibration.yaml` and rerun in one command:
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/scenarios_calibration.yaml
# Their folders carry their name (`outputs/calib_selected/`), not a number.
#
# WHY `run:` IS A LIST. The first name is the current one; the second is the folder the run
# was solved under before the English renaming of 2026-09-22 (`calib_retenu/`). The first
# folder that exists wins, so regenerating a run under its new name takes over silently and
# the old folder can be deleted whenever convenient.
#
# HOW TO UPDATE IT. After a run that changes the selected reference, replace `run:`, rewrite
# `note:` AND the `expect:` values. A `run:` matching no folder is not a fatal error: the page
# flags the missing reference and carries on.
#
# WHAT "side" MEANS. Every run has two sides. `input` is the observed 2017 land use
# (identical from one run to the next at constant data config); `output` is the optimised
# allocation. The observation is therefore the `input` side of any run, not a separate
# folder. (`outputs/reference_2017/` is a separate, richer artefact -- it carries the low/high
# bracket of the indicators -- but it has no facts table, so it cannot feed the comparison
# charts.)
#
# WHAT `expect:` IS FOR. `scripts/check_references.py` compares these values with what the
# folder actually holds and exits with an error beyond `tolerance_pct`. It is the repo's only
# guard on the SOLVE: the unit tests are data-free by choice, and `golden_snapshot.py` covers
# the pipeline and the indicators, not the resolution.
# The tolerance is 5 % because the measured branch-and-bound noise is 0.15 point of PAD
# (three HiGHS seeds: 48.44 / 48.29 / 48.31), i.e. 2.3 % relative on the smallest value
# guarded here. An exact-equality guard would fail on a mere re-run.

references:
  - id: observed
    run: [calib_selected, calib_retenu]
    side: input
    label: "Observed 2017 (RPG)"
    note: >-
      The land use actually declared in 2017, as the pipeline rebuilds it. The `input` side
      of any run gives the same thing at constant data config.
      WARNING: the FINE 2017 allocation was never observed -- only the 12 RPG groups are --
      so the economic indicators of this series rest on the `baseline_representative_crops`
      assumption, and that assumption is fragile: the representative crop is eligible on only
      31 % of the observed cane hectares and 61 % of market gardening. Areas per group, on the
      other hand, are observed.

  - id: gams_parity
    run: [calib_gams_parity, calib_gams_parite]
    side: output
    label: "Calib GAMS parity"
    note: >-
      The CALIB block ported as is, with no accepted deviation. It is the PARITY reference:
      what the original GAMS model produces on our data, hence the honest point of comparison
      to judge what the two deviations bring. Its gap to the article's figures (PAD <15 %,
      types 81 %) comes from the provenance of the data -- 4 638 farms against 5 336, 2010
      base year out of reach -- and not from a porting defect: the source-to-source
      investigation of 2026-07-27 ruled out the modelling causes one by one. Regenerated on
      2026-08-01, identical to the digit to the original run (`output_1`, deleted on
      2026-08-02 as an exact duplicate).
    tolerance_pct: 5.0
    expect:
      objective.value: 84978687
      calibration.regional_pad_pct: 48.44
      calibration.farm_type_match_pct: 64.04
      calibration.plot_match_pct: 55.99
      calibration.area_match_pct: 64.28

  - id: retained
    run: [calib_selected, calib_retenu]
    side: output
    label: "Calib selected"
    note: >-
      The working calibration, with the only two deviations accepted in the CALIB block, both
      backed by a source EXOGENOUS to the observed land use: the plantain market ceiling
      `bc_quota_max` at 6 440 t (the GAMS author's figure, corroborated by the article's
      Eq. 6 at 4 650 t) and the fodder-area floor `pn_prod_min` at 6 096 ha (GAMS parameter
      QUOTA_PN_PIQ_MIN, 27 % BELOW the 8 341 ha given by the 2017 annual agricultural
      statistics). Types 86.9 %, plots 67.6 %, area 77.1 %, and cane back at 12 782 ha
      against 12 813 observed without any constraint naming it.
      DO NOT quote its 6.6 % territorial PAD: the floor pins grassland, whose PAD is zero by
      construction. Regenerated on 2026-08-01, identical to the digit to the original run
      (`output_3`, deleted on 2026-08-02 as an exact duplicate).
      The intermediate step between this entry and `gams_parity` -- `bc_quota_max` alone --
      lives in `outputs/calib_bc_seul/` (to be regenerated as `calib_bc_only`) from the same
      spec; it is not declared here because it serves for attribution, not as a point of
      comparison.
    tolerance_pct: 5.0
    expect:
      objective.value: 81222224
      calibration.regional_pad_pct: 6.60
      calibration.farm_type_match_pct: 86.89
      calibration.plot_match_pct: 67.58
      calibration.area_match_pct: 77.10
