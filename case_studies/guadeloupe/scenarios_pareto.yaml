# PARETO SWEEP CATALOGUE -- epsilon-constraint fronts.
#
# WHAT IT CHANGES. A scenario answers "with this nitrogen ceiling, the margin is X". It does
# not say what the next kilogram costs. A Pareto front does: the objective (risk-adjusted
# margin) is fixed, one indicator is tightened step by step, and the resulting curve IS the
# trade-off -- the very object of a public decision-support model. The dual price from
# `shadow_prices.py` gives the local slope; the front gives the whole curve, including the
# kinks the dual cannot see (it is local by construction).
#
# HOW IT WORKS. A sweep is an ordinary run carrying a `matrix:` block, which
# `core/config.expand_runs` unfolds as a Cartesian product: one value = one run = one real
# MILP solve. The key `args:<label>.<argument>` targets the ARGUMENT of the constraint
# carrying that label, not a dotted config path -- because a constraint threshold lives at no
# dotted path. That is also why `nitrogen_max` and `employment_min` exist as `enable: false`
# in `config.yaml`: `set_args` can only patch an entry ALREADY declared, so those two empty
# shells exist only to give the sweep something to hold.
#
# TWO WAYS TO USE IT.
#   * alone, against the reference config -- the front of the current model:
#       python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/scenarios_pareto.yaml
#   * attached to a policy, from `plan.yaml` -- the front UNDER that policy, which is the
#     interesting object: the marginal cost of nitrogen is not the same at 70 % inertia and
#     at 30 %. The run then carries the three coordinates (policy / forcing / sweep) in its
#     recap.
#
# THRESHOLDS ARE SHARES OF THE MEASURED VALUE, NOT CHOSEN NUMBERS. Each value below is a
# percentage of the total achieved by `calib_selected` -- 1 930 903 kg N. The first point of
# the sweep is therefore 100 %: the constraint is inactive there and the margin must equal
# that of the selected calibration. THAT IS THE FIRST CHECK TO MAKE -- if it differs, the
# front is not wrong; the solver did not converge to the same place.
# WARNING: under a policy this check no longer holds as such -- the 100 % point must then
# equal the UNSWEPT policy, not `calib_selected`.
#
# COST, AND WHY THE POINTS DO NOT RUN IN THE ORDER WRITTEN. One point = one real MILP solve,
# so 7 for the sweep below; do NOT launch it without meaning to.
# `core/config.order_sweep_points` reorders the sweep BEFORE launching it, from the TIGHTEST
# threshold to the loosest -- the reverse of the reading order below. The reason is a one-way
# implication: an allocation feasible at 55 % of nitrogen is still feasible at 100 %, not the
# converse. In the written order every seed would be infeasible and the front would fall back
# to 7 cold solves WITHOUT SAYING SO (HiGHS discards an infeasible MIP start silently). In the
# right order each point seeds the next: 1 cold solve (the tightest, hence also the slowest)
# and 6 warm ones.
# The rule holds for `sense: le`; for `sense: ge` (a floor) it inverts, the tightest being the
# highest. The reordering infers it from the constraint's `sense`, and abstains whenever it is
# not sure (two-dimensional sweep, an argument that is not the bound's level such as `scale`,
# a constraint with no `sense`). `--no-warm-start-chain` disables it.
#
#   python scripts/run_scenarios.py --scenarios <this file> --dry-run
#   python scripts/check_scenario_feasibility.py --scenarios <this file>
#
# The dashboard's **Pareto** page reads these runs and draws the front (dominated points
# greyed out).

sweeps:
  # ---------------------------------------------------------------- margin x nitrogen
  - name: pareto_nitrogen
    description: >-
      Front of risk-adjusted gross margin × total mineral nitrogen. Seven points, from 100 %
      down to 55 % of the nitrogen used by the selected calibration. The most direct
      environmental axis: nitrogen is read off the crop management sequences, with no
      conversion assumption between the ceiling and the reported indicator (unlike water,
      which needs the `irrigable` weight, or carbon, whose balance also depends on the plot's
      soil type). Read it with the `intensity` block: a nitrogen ceiling can also be met by
      farming FEWER hectares, which is not the same policy as producing more cleanly.
      Nitrogen PER TONNE tells the two apart.
    enable: [nitrogen_max]
    matrix:
      args:nitrogen_max.threshold:
        - 1930903   # 100 % -- constraint inactive, must reproduce `calib_selected`
        - 1834358   #  95 %
        - 1737813   #  90 %
        - 1544722   #  80 %
        - 1351632   #  70 %
        - 1158542   #  60 %
        - 1061997   #  55 %

  # ---------------------------------------------------------------- margin x subsidy
  # THIS SWEEP IS NOT SELF-CONTAINED, unlike `pareto_nitrogen`. `nitrogen_max` has an
  # `enable: false` shell in `config.yaml`; `subsidy_budget` does not, because each policy
  # sets its own through `enable_add`. Since `set_args` only patches an entry ALREADY
  # declared, this front can only be traced UNDER a policy carrying that label -- P2, P3, P4,
  # P5, P6, P8, P9. Run alone it raises `KeyError: set_args label 'subsidy_budget' matched no
  # entry`, and that is the right error: an envelope front against a config with no envelope
  # means nothing.
  #
  # AND THE HOST IS CHOSEN BY MEASUREMENT, NOT BY GUESS. A front is only worth tracing where
  # the ceiling BINDS. Read on existing runs:
  #   P4 nominal   ceiling 72 M -- achieved 71.20 M, dual 0.056, is_binding: true
  #   P8 nominal   ceiling 80 M -- achieved 39.05 M, i.e. 41 M of slack
  # Under P8 the first five points would return the same allocation: five solves for a flat
  # line. P8 cuts cane to 0.80 and redeploys to organic market gardening, which needs few
  # hectares, so it spends only half its envelope on its own. That is why this front hangs off
  # P4 in `plan.yaml` and not off P8, although P8 already carries the other two.
  #
  # THE COMPOSITE-SCORE TRAP DOES NOT APPLY HERE, AND THIS IS THE ONLY CASE. The dashboard
  # flags `subsidy` as an indicator FIXED by a constraint (`comparison.bound_indicators`),
  # hence not attributable to the policy. On a front it is the other way round: the bound IS
  # the x-axis, set on purpose and swept. The warning remains right for an ordinary cell.
  - name: pareto_subsidies
    description: >-
      Front of risk-adjusted gross margin × public subsidy envelope, under P4. Seven points,
      from 125 % down to 50 % of the 71.8 M EUR paid in 2017. Answers "what the territory
      loses per public euro withdrawn, if the model is left to choose where to cut" -- to be
      distinguished from P5_budget_austerity, which cuts the SAME envelope to 43 M but decides
      in advance where (aid x 0.60, cane x 0.48). CAREFUL WHAT YOU READ INTO THAT GAP: P5
      differs not ONLY in how it cuts -- it also sets labour to 0.90 and inertia to 0.60. The
      difference therefore mixes targeting, labour contraction and a freer reconfiguration; it
      does NOT measure the cost of targeting alone. That figure would need a P5 aligned on P4
      everywhere else -- one more solve, added AFTERWARDS without retracing the front.
      TWO CHECKS. (1) The 90 M point must be inactive: if the achieved subsidy reaches 90 M
      there, it is not the first point of the front and the threshold must go up. (2) The
      72 M point must reproduce `p4_statu_quo_f0_nominal` -- only up to branch-and-bound noise,
      since that run ended at `maxTimeLimit`. Both already pass in LP: from 72 to 90 M, 18 M of
      extra public money buys only 32 k EUR of margin (0.002 EUR/EUR, against 0.118 between
      64.6 and 72 M), and the 72 M point returns exactly the bound of bare P4 (82 547 378).
      EXPECTED RISK, MEASURED AND RULED OUT IN LP (2026-08-05): P4's 70 % inertia pins 70 % of
      hectares to their 2017 group, which carry their subsidies with them -- hence the fear of a
      structural FLOOR under the envelope that would make the low points infeasible. All seven
      points pass the relaxation, the lowest included. Caveat: inertia is precisely where the
      LP is most permissive (it meets it with fractions of plots), so a MILP infeasibility at
      35.9 M is not excluded.
    overrides:
      # Nominal P4 already hit the 1 h limit cold; a tight budget ceiling on top is harder, not
      # easier. Worst case 7 x 2 h -- lower to 3600 if the batch must fit in one night, at the
      # price of points not proven optimal.
      solver.args.time_limit: 7200
    # ASCENDING ORDER -- THE REVERSE OF `pareto_nitrogen`, ON PURPOSE. The automatic reordering
    # DOES NOT APPLY here: `order_sweep_points` reads the constraint's `sense` in `config.yaml`
    # (`_bound_senses` in core/config.py), and `subsidy_budget` is not there -- the policy sets
    # it through `enable_add`. Without a `sense` the function abstains and keeps the WRITTEN
    # order. It must therefore be written already sorted from tightest to loosest, otherwise
    # every seed would be infeasible and the front would fall back to seven cold solves
    # SILENTLY (HiGHS discards an infeasible MIP start without a word). Ceiling => the tightest
    # is the LOWEST.
    # Do not re-sort this block to make it look like the previous one.
    matrix:
      args:subsidy_budget.threshold:
        - 35900000   #  50 %
        - 43000000   #  60 % -- exactly the ceiling of P5_budget_austerity
        - 50300000   #  70 %
        - 57400000   #  80 %
        - 64600000   #  90 %
        - 72000000   # 100 % -- P4's freeze, must reproduce p4_statu_quo_f0_nominal
        - 90000000   # 125 % -- inactive ceiling: P4's optimum with no envelope

  # ---------------------------------------------------------------- margin x employment
  # DISABLED BY DEFAULT -- read before uncommenting. An employment floor above what the labour
  # ceiling allows is infeasible, and loosening the `slack` IS NOT ENOUGH: P10 proved
  # infeasible at 6 000 FTE while its slack allowed 8 561, because what was missing was not
  # hours but crops able to absorb them under the environmental ceilings. The maximum
  # reachable, measured in LP relaxation, is ~4 875-4 975 FTE against 3 503 achieved. A sweep
  # beyond that ceiling produces infeasible runs, not a front.
  # Check with `check_scenario_feasibility.py` BEFORE launching.
  #
  # - name: pareto_employment
  #   description: Margin × employment front, from the achieved 3 503 FTE up to 4 500 FTE.
  #   enable: [employment_min]
  #   matrix:
  #     args:employment_min.threshold:
  #       - 5629321   # 3 503 FTE -- constraint inactive
  #       - 6027000   # 3 750 FTE
  #       - 6428000   # 4 000 FTE
  #       - 6830000   # 4 250 FTE  (above the labour ceiling at slack 1.0: loosen it too)
