# Scenario batch spec -- consumed by scripts/run_scenarios.py.
#
# Each entry under `runs:` is one solve. A run only lists what it CHANGES relative to
# the reference config.yaml (in this folder); everything else is inherited. Runs never
# affect one another -- overrides are applied on a fresh deep-copy of config.yaml each
# time. Each run writes its own outputs/output_N/ folder, tagged with `name` in recap.json
# (visible in the dashboard).
#
# Three edit channels per run:
#   overrides: {dotted.path: value}
#       Set a scalar / dict / whole key by dotted path. Replaces the value entirely.
#       e.g.  data.year: "2020"        solver.args.mip_rel_gap: 0.01
#             zone_filter: {include: {islands: [1]}}
#   enable / disable: [token, ...]
#       Flip `enable:` on any constraint/objective/rule matched by its `label` (preferred,
#       unique) or its `name` (matches ALL entries with that name). Use to swap objectives
#       or toggle a constraint on/off.
#   set_args: [{label: <label>, args: {...}}, ...]
#       Shallow-merge `args` into the entry carrying that `label` -- e.g. change a
#       threshold, max_share, or ratio without retyping the whole entry.
#   enable_add: [{name: <builder>, args: {...}, section: <config list>}, ...]
#       Append a BRAND-NEW entry that does not exist in config.yaml (enable/disable and
#       set_args can only touch entries already declared there). `section` defaults to
#       `constraints`; pass `section: categorical_rules` to add an eligibility cut.
#       e.g. a minimum organic share, or a crop banned for a plant-health scenario.
#
# One extra field fans a single entry into many runs:
#   matrix: {dotted.path: [v1, v2, ...], other.path: [...]}
#       Cartesian product of the listed values -> one run per combination, each folded
#       into `overrides`. Names get a `__key=value` suffix per dimension.
#
# The batch always writes outputs/batch_summary_<timestamp>.csv/.md comparing every run,
# and by default keeps going if a run fails/infeasible (pass --stop-on-error to abort).
#
# Run with:  .venv/Scripts/python scripts/run_scenarios.py
# Each run launches a real HiGHS solve (30-60 min on the full dataset). Add a zone_filter
# override to shrink runs while iterating.
#
# Run names were translated to English on 2026-09-22. Runs solved earlier keep their French
# folder names in outputs/ (e.g. `marge_pure`); nothing links a folder to this file but its
# name, so an old folder is simply not regenerated by this spec under its old name.

# NOTE: the model is STATIC and the economic-table columns after 2017 are a full copy of
# 2017 -- varying data.year is meaningless, so no scenario here touches it (all stay 2017).
# Targeted price/subsidy shocks use data.scenario (RESTIT/SMART) or economic_overrides
# (per-crop price/subsidy multipliers; see config.yaml).

# Crop groups reused by the economic-shock runs below (YAML anchors; the leading `_` key
# is ignored by run_scenarios.py, which only reads `runs:`).
# NOTE: YAML anchors do not cross files, so these groups intentionally mirror
# `config.yaml crop_families` -- tests/test_crop_group_sync.py holds them together.
_crop_groups:
  export_banana: &G_BANANA [BA, BA_INT, BA_IRR, BA_PER, BA_SINT]
  sugarcane: &G_CANE
    [CS, CS_BT_NISM, CS_BT_NIM, CS_BT_IM, CS_SBT_NISM, CS_SBT_NIM, CS_SBT_IM,
     CS_NGT_NISM, CS_NGT_NIM, CS_NGT_IM, CS_CGT_NISM, CS_CGT_NIM, CS_CGT_IM,
     CS_EGT_NISM, CS_EGT_NIM, CS_EGT_IM, CS_MG_NISM, CS_MG_NIM, CS_MG_IM]
  market_gardening: &G_MARKET_GARDENING
    [MA, MA_PLBIO, MA_MOBIO, MA_ROTA, MA_TO_CHOU_JA, MA_TO_CO_JA,
     MA_BAG_BIO_I, MA_BAG_BIO_NI, MA_BAG_VEG_I, MA_BAG_VEG_NI, MA_BAG_FER_I, MA_BAG_FER_NI,
     MA_BAG_NON_I, MA_BAG_NON_NI, MA_BRF_BIO_I, MA_BRF_BIO_NI, MA_BRF_VEG_I, MA_BRF_VEG_NI,
     MA_BRF_FER_I, MA_BRF_FER_NI, MA_BRF_NON_I, MA_BRF_NON_NI, MA_PAI_BIO_I, MA_PAI_BIO_NI,
     MA_PAI_VEG_I, MA_PAI_VEG_NI, MA_PAI_FER_I, MA_PAI_FER_NI, MA_PAI_NON_I, MA_PAI_NON_NI]
  # WARNING: unlike crop_groups.yaml, this group still counts the six Karusmart *_BIO_*
  # copies, which carry no organic data (see crop_groups.yaml). The organic runs below
  # predate that measurement; their organic share can be met by relabelling.
  organic_market_gardening: &G_ORGANIC_MA
    [MA_PLBIO, MA_MOBIO, MA_BAG_BIO_I, MA_BAG_BIO_NI, MA_BRF_BIO_I, MA_BRF_BIO_NI,
     MA_PAI_BIO_I, MA_PAI_BIO_NI]
  # Sugarcane intensification = the MECHANISED systems that still exist. The irrigated
  # CS_*_IM variants are banned everywhere by Eq_CS_IRR (see config.yaml), so a group built
  # on them would be empty and make any share constraint infeasible.
  intensive_sugarcane: &G_INTENSIVE_CS
    [CS_BT_NIM, CS_SBT_NIM, CS_NGT_NIM, CS_CGT_NIM, CS_EGT_NIM, CS_MG_NIM]

runs:
  # --- Control ---------------------------------------------------------------------
  - name: baseline
    description: "Reference config unchanged -- control run for comparison."

  # --- Headlong intensification ------------------------------------------------------
  - name: max_intensification
    description: "Cane + banana subsidies +30%, cane/banana production ceilings lifted."
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: *G_CANE, factor: 1.3}
        - {crops: *G_BANANA, factor: 1.3}
    set_args:
      - {label: cs_quota_max, args: {threshold: 100000000}}
      - {label: ba_quota_max, args: {threshold: 100000000}}
  - name: pure_margin
    description: "Removes every production floor/target -- pure-margin optimum."
    disable: [bc_prod_min, ig_prod_min, ma_prod_min, an_prod_min, plu_prod_min, me_prod_min,
              pn_prod_min, leg_prod_obj, fru_prod_obj, pat_surf_obj]
  - name: export_first
    description: "Banana +20% & cane +20% prices, mechanised cane forced >= 50% of the cane chain."
    overrides:
      economic_overrides.price_multipliers:
        - {crops: *G_BANANA, factor: 1.2}
        - {crops: *G_CANE, factor: 1.2}
    enable_add:
      - name: crop_share_bound
        args: {label: intensive_min, numerator_crops: *G_INTENSIVE_CS,
               denominator_crops: *G_CANE, sense: ge, share: 0.5}
  - name: ceilings_lifted
    description: "Lifts the cane and banana production ceilings, subsidies untouched."
    set_args:
      - {label: cs_quota_max, args: {threshold: 100000000}}
      - {label: ba_quota_max, args: {threshold: 100000000}}

  # --- Agroecology --------------------------------------------------------------------
  - name: agroeco_smart
    description: "SMART scenario (OTK matrix + SMART version of the compost AECM subsidy)."
    overrides: {data.scenario: SMART}
  - name: intensification_cap
    description: "Intensification ceiling: mechanised cane <= 20% of the cane chain."
    enable_add:
      - name: crop_share_bound
        args: {label: intensive_cap, numerator_crops: *G_INTENSIVE_CS,
               denominator_crops: *G_CANE, sense: le, share: 0.2}
  - name: stronger_rotations
    description: "Stronger rotations: fallow >= 40% of export banana (default 0.25)."
    set_args:
      - {label: ba_ja, args: {ratio: 0.4}}
  - name: aecm_compost_boost
    description: "SMART + market-gardening subsidy +25% (proxy for an agroecological incentive)."
    overrides:
      data.scenario: SMART
      economic_overrides.subsidy_multipliers:
        - {crops: *G_MARKET_GARDENING, factor: 1.25}

  # --- Organic -------------------------------------------------------------------------
  - name: organic_incentive
    description: "Subsidy +50% on the organic market-gardening variants (incentive, no constraint)."
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: *G_ORGANIC_MA, factor: 1.5}
  - name: organic_mandate
    description: "Hard organic share: >= 30% of market gardening in organic variants, no incentive."
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.3}
  - name: organic_strong
    description: "Organic share 50% + organic subsidy +50% (constraint and incentive combined)."
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: *G_ORGANIC_MA, factor: 1.5}
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.5}

  # --- Pooling -------------------------------------------------------------------------
  - name: pooling
    description: "Pooled allocation: disables the per-farm rotation ceilings."
    disable: [an_agro_max_farm, ig_agro_max_farm]
  - name: pooled_organic
    description: "Pooling + 30% organic share (agroecological cooperative)."
    disable: [an_agro_max_farm, ig_agro_max_farm]
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.3}

  # --- Economic shocks ------------------------------------------------------------------
  - name: banana_price_shock
    description: "Export banana price -30%."
    overrides:
      economic_overrides.price_multipliers:
        - {crops: *G_BANANA, factor: 0.7}
  - name: cane_subsidy_shock
    description: "Cane subsidy -50%."
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: *G_CANE, factor: 0.5}
  - name: market_gardening_price_shock
    description: "Market-gardening price -30% (tests the vegetable floor)."
    overrides:
      economic_overrides.price_multipliers:
        - {crops: *G_MARKET_GARDENING, factor: 0.7}
  - name: oil_shock
    description: "Input/fuel shock: variable costs +40% on cane, banana, market gardening."
    overrides:
      economic_overrides.cost_multipliers:
        - {crops: *G_CANE, factor: 1.4}
        - {crops: *G_BANANA, factor: 1.4}
        - {crops: *G_MARKET_GARDENING, factor: 1.4}

  # --- Climate and plant-health shocks ----------------------------------------------------
  - name: cyclone
    description: "Cyclone: banana & cane yield -40%."
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: *G_BANANA, factor: 0.6}
        - {crops: *G_CANE, factor: 0.6}
  - name: drought
    description: "Drought: yield -30% (cane/banana/market gardening) + irrigated crops banned."
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: *G_CANE, factor: 0.7}
        - {crops: *G_BANANA, factor: 0.7}
        - {crops: *G_MARKET_GARDENING, factor: 0.7}
    enable_add:
      # Eligibility cut, not a MILP constraint -- hence the explicit section.
      - name: forbid_crops
        section: categorical_rules
        args: {crops: [BA_IRR, ME, MA_ROTA]}
  - name: black_sigatoka
    description: "Black Sigatoka (cercosporiose noire): banana yield -50%."
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: *G_BANANA, factor: 0.5}

  # --- Policy mixes ---------------------------------------------------------------------
  - name: transition_under_cyclone
    description: "Agroecology (SMART + 30% organic) hit by a cyclone (banana/cane yield -40%)."
    overrides:
      data.scenario: SMART
      economic_overrides.yield_multipliers:
        - {crops: *G_BANANA, factor: 0.6}
        - {crops: *G_CANE, factor: 0.6}
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.3}
  - name: intensification_under_drought
    description: "Intensive (cane/banana subsidies +30%, ceilings lifted) hit by drought."
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: *G_CANE, factor: 1.3}
        - {crops: *G_BANANA, factor: 1.3}
      economic_overrides.yield_multipliers:
        - {crops: *G_CANE, factor: 0.7}
        - {crops: *G_BANANA, factor: 0.7}
    set_args:
      - {label: cs_quota_max, args: {threshold: 100000000}}
      - {label: ba_quota_max, args: {threshold: 100000000}}
  - name: pooled_organic_shock
    description: "Organic 40% + pooling + market-gardening price -20%."
    disable: [an_agro_max_farm, ig_agro_max_farm]
    overrides:
      economic_overrides.price_multipliers:
        - {crops: *G_MARKET_GARDENING, factor: 0.8}
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.4}
  - name: agroeco_resilience
    description: "Organic 30% + stronger rotations (fallow 40%) under a banana/cane cyclone -40%."
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: *G_BANANA, factor: 0.6}
        - {crops: *G_CANE, factor: 0.6}
    set_args:
      - {label: ba_ja, args: {ratio: 0.4}}
    enable_add:
      - name: crop_share_bound
        args: {label: organic_min, numerator_crops: *G_ORGANIC_MA,
               denominator_crops: *G_MARKET_GARDENING, sense: ge, share: 0.3}
