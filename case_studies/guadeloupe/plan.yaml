# THE PLAN -- which crossings are actually solved.
#
# The three included files are CATALOGUES: they declare what exists and run nothing. This
# file says what runs. It is the only one to edit to change a batch, and the only one to read
# to know what a batch did.
#
#   scenarios_policies.yaml   what a public authority DECIDES          (P1..P10)
#   scenarios_forcings.yaml   what climate and markets IMPOSE          (F0..F11)
#   scenarios_pareto.yaml     the epsilon-constraint sweeps            (pareto_nitrogen, ...)
#
# GRAMMAR OF A CELL. Four equivalent spellings, from the shortest to the most explicit:
#
#   P1_full_deregulation:                                  # the policy alone, unforced
#   P4_status_quo: [F0_nominal, F9_systemic_crisis]        # shorthand for `forcings:`
#   P5_budget_austerity: {forcings: "*"}                   # every forcing in the catalogue
#   P8_agroecological_transition:
#     forcings: [F0_nominal, F9_systemic_crisis]
#     sweeps:
#       - pareto_nitrogen                                           # front on the policy alone
#       - {name: pareto_nitrogen, forcings: [F9_systemic_crisis]}   # ... and under the shock
#
# A SWEEP IS NOT CROSSED WITH ITS CELL'S FORCINGS. On purpose: a front costs one solve per
# point, and multiplying it by a forcing list is how an afternoon becomes a week. For a front
# under a forcing, name it explicitly.
#
# COUNT BEFORE LAUNCHING. A cell costs (number of forcings, or 1 if none) + (number of points
# of each sweep). The plan below is 37 runs -- 16 cells and 3 fronts of 7 points -- i.e. two
# nights. `--no-sweeps` brings it down to 16. `--dry-run` lists them in a few seconds, and it
# is THE reflex after editing this file.
#
# THIS PLAN IS THE FULL CAMPAIGN, NOT THE NEXT BATCH. Re-running it as is replays cells
# already solved and creates DUPLICATES at the same coordinates (create_output_folder
# suffixes rather than overwriting), which confuses the dashboard's Prospective grid. To run
# only new work, write a one-off stage spec that includes the same three catalogues and lists
# only the missing cells. The August 2026 stage specs (`plan_budget.yaml`,
# `plan_etape_*.yaml`) did exactly that; they were executed and removed on 2026-09-22 --
# `git show 5bf32d9:case_studies/guadeloupe/plan_budget.yaml` shows the pattern. Note that
# `--forcings` does NOT help there: it drops the unforced sweeps.
#
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan.yaml --dry-run
#   python scripts/check_scenario_feasibility.py --scenarios case_studies/guadeloupe/plan.yaml
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan.yaml --no-sweeps
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan.yaml
#
# `--policies P8_agroecological_transition` restricts the plan to one policy,
# `--forcings F9_systemic_crisis` to one column, `--no-sweeps` drops the fronts -- that is how
# a batch too large for one night is staged.
#
# The campaign was solved in August 2026 under the former French names (P4_statu_quo,
# F9_crise_systemique, pareto_azote); those runs keep them on disk and the dashboard maps them
# onto the names below.

include:
  crop_groups: crop_groups.yaml
  policies:    scenarios_policies.yaml
  forcings:    scenarios_forcings.yaml
  sweeps:      scenarios_pareto.yaml

scenarios:

  # --- The bounds, unforced -----------------------------------------------------------------
  # P1 and P10 bracket the axis. They are wanted alone first: their role is to bound what the
  # territory can give, not to hold under a shock. And P1 changes objective, so its
  # `objective` column is comparable with nothing (see scenarios_policies.yaml).
  P1_full_deregulation:
  P10_agroecological_bifurcation:

  # --- The point of comparison ----------------------------------------------------------------
  # The status quo goes through the four forcings that best separate the policies: the neutral
  # control, the physical shock, the cost shock (the one that should most separate the two
  # poles), and the plausible worst case.
  # It also carries the budget front, a MEASURED choice: under P4 the subsidy ceiling binds
  # (71.20 M achieved against 72 M, dual 0.056), under P8 it does not (39.05 M against 80 M).
  # A front under P8 would return the same allocation five times.
  P4_status_quo:
    forcings: [F0_nominal, F1_major_cyclone, F6_input_price_shock, F9_systemic_crisis]
    sweeps: [pareto_subsidies]

  # --- Pay or forbid? --------------------------------------------------------------------------
  # P6 and P7 pursue the same goal with two opposite instruments; they are only read together
  # and under the SAME forcings, otherwise the gap between them mixes instrument and shock.
  P6_incentive_greening:
    forcings: [F0_nominal, F6_input_price_shock]
  P7_regulatory_ecophyto:
    forcings: [F0_nominal, F6_input_price_shock]

  # --- The serious agroecological scenario, and its marginal cost ------------------------------
  # The ENVIRONMENTAL fronts are here: it is under P8 that "what does the next kilogram of
  # nitrogen cost" really arises, since it is the policy one would consider implementing. The
  # second says whether that marginal cost holds under crisis -- 14 solves between them. The
  # BUDGET front is under P4, not here, for lack of a binding envelope (see P4).
  P8_agroecological_transition:
    forcings: [F0_nominal, F9_systemic_crisis]
    sweeps:
      - pareto_nitrogen
      - {name: pareto_nitrogen, forcings: [F9_systemic_crisis]}

  # --- The counterfactual of the budget front ---------------------------------------------------
  # P5 caps the envelope at 43 M, EXACTLY one point of the front traced under P4. But it decides
  # in advance WHERE to cut (aid x 0.60, cane x 0.48 in total), whereas the front lets the model
  # spread the shrinking envelope. The gap between the two therefore does not measure the cost
  # of austerity -- the front already gives that -- but the cost of TARGETING. Without it the
  # front is a curve with no counterfactual, which is its only reason to be here: unforced, one
  # solve. (It also lowers the labour slack to 0.90 and inertia to 60 %, so the gap is not due
  # to aid targeting alone -- say so when reading it.)
  P5_budget_austerity:

  # --- Off the axis ------------------------------------------------------------------------------
  # P9 is judged on the forcing favourable to it (the market turns back to local produce) as
  # much as on the nominal one: a sovereignty policy evaluated only under 2017 conditions is
  # judged on the very world it seeks to leave.
  P9_food_sovereignty:
    forcings: [F0_nominal, F7_food_inflation, F9_systemic_crisis]

  # --- Not played in this plan -------------------------------------------------------------------
  # P2 and P3 stay in the catalogue and are not played here: they are two points of an axis
  # already bounded by P1. Reopening them = two lines.
  # (P5 used to be excluded on the grounds that F8_posei_withdrawal produces the same budget
  # shock on any policy. It is back above for another reason: to serve as the counterfactual of
  # the `pareto_subsidies` front, which a forcing cannot do -- F8 cuts aid, it does not
  # REDEPLOY it.)
