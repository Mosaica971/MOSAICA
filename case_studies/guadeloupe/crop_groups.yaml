# Named crop groups, shared by every scenario file.
#
# WHY THIS FILE EXISTS. YAML anchors (&G_CANE / *G_CANE) do not cross files. While policies
# and forcings lived in one document they could share an `_crop_groups` block; splitting them
# would have meant copying every list into both, and a copy drifts. A named catalogue does
# the same job without the copy: a scenario writes `crops: {group: sugarcane}` and the loader
# substitutes the list (`core/config.load_batch_spec` -> `resolve_crop_groups`).
#
# THIS FILE DOES NOT RESTATE WHAT THE MODEL ALREADY KNOWS. The effective catalogue is
# `crop_families` from `config.yaml` PLUS this file, this file winning on a collision. So
# `{group: cs}`, `{group: ma}`, `{group: ban_ex}` work without being declared here: they are
# the model's families. Below are only (a) readable aliases for those families and (b) the
# groupings that only make sense in prospective scenarios.
#
# A member prefixed with `@` references another group, resolved recursively (duplicates
# removed, cycles detected). That is what lets `food_crops` be composed without restating
# eleven crop codes.
#
# `tests/test_crop_group_sync.py` checks that every code named here exists in CULT_2017.set
# and that each alias points at the right family. Otherwise a typo is SILENT: the code
# matches nothing, the group is narrower than written, and the run looks normal.

# --- Readable aliases for the config.yaml families ---------------------------------------
# Readability only: `{group: sugarcane}` rather than `{group: cs}` in a file read by someone
# who does not know the GAMS abbreviations.
sugarcane: ["@cs"]
export_banana: ["@ban_ex"]
plantain: ["@bc"]
yam: ["@ig"]
pineapple: ["@an"]
market_gardening: ["@ma"]
orchards: ["@plu"]             # citrus + rain-fed orchards

# --- Groupings specific to prospective scenarios -----------------------------------------

# THE ONLY TWO GENUINELY ORGANIC SYSTEMS IN THE DATA. Read this before extending the list.
#
# The 25 "Karusmart" variants MA_{BAG,BRF,PAI}_{BIO,VEG,FER,NON}_{I,NI} LOOK like organic /
# mulching systems and are not: measured on the real data (2026-07-31), all 25 are identical
# to MA_TO_CO_JA on every parameter the model reads -- margin 20 825 EUR/ha, yield 36 t/ha,
# 1 128 h/ha, 75.6 kg N/ha, TFI 10, same eligibility footprint. The BIO / VEG / FER / NON
# distinction carries NO data. They are 25 copies of one conventional activity, hence GAMS
# suppressing the block (Eq_MA_EXP_SUPP) and `ma_exp_supp` staying enabled in config.yaml.
#
# Two consequences, both of which bit before the measurement:
#   * reopening them adds 548 000 binaries of PURE SYMMETRY (879 162 against 331 044) --
#     interchangeable copies are branch-and-bound's worst case, since it then explores the
#     equivalent permutations of one solution;
#   * an organic share built on them is a NO-OP: the solver meets "25 % organic" by picking
#     the copy named _BIO_ of an identical activity, at exactly zero cost. A constraint that
#     looks agroecological and constrains nothing.
# MA_PLBIO and MA_MOBIO, by contrast, are genuinely distinct and genuinely organic:
# 0 kg N/ha and TFI 0, for 3 882 / 3 498 EUR/ha against 27 929 for MA_ROTA at 277 kg N and
# TFI 15. That is a real trade-off, and it is what an organic share buys.
organic_market_gardening: [MA_PLBIO, MA_MOBIO]

# Market gardening that is actually distinct, i.e. `ma` without the 25 copies above.
distinct_market_gardening: [MA, MA_PLBIO, MA_MOBIO, MA_ROTA, MA_TO_CHOU_JA, MA_TO_CO_JA]

# Everything the local market eats, as opposed to the two export chains.
food_crops:
  - "@plantain"
  - "@yam"
  - "@pineapple"
  - ME
  - "@orchards"
  - "@distinct_market_gardening"

# Mechanised sugarcane: the intensification actually available. The irrigated CS_*_IM
# variants are forbidden by `cs_irrig_ban`, so a share constraint built on them alone would
# be empty and infeasible -- unless the scenario lifts the ban, which P1 and P2 do.
intensive_sugarcane: [CS_BT_NIM, CS_SBT_NIM, CS_NGT_NIM, CS_CGT_NIM, CS_EGT_NIM, CS_MG_NIM]
