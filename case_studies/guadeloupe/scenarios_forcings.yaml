# FORCING CATALOGUE -- what climate and markets IMPOSE, whatever the policy decided.
#
# THIS FILE RUNS NOTHING, and a forcing is never played alone: it only makes sense composed
# with a policy from `scenarios_policies.yaml`. `plan.yaml` says which policy goes through
# which forcing. The crossing IS the result: the policy that looks best unforced is not
# necessarily the one that holds under a cyclone or a price collapse, and that gap is what
# is being measured.
#
# F0_nominal is the neutral control. Keeping it first is not cosmetic: run_scenarios.py keeps
# the FIRST solved allocation of each policy as the warm-start seed for its other cells, and
# the unforced allocation is the most widely feasible seed.
#
# A FORCING CHANGES COEFFICIENTS, NOT THE FEASIBLE SET -- which is what makes chaining warm
# starts legitimate. The exceptions are real but rare: F2 forbids crops, F11 removes land.
# The audit in `core/solve/warm_start.py` catches them and the run restarts cold.
#
# Forcing names were translated on 2026-09-22 (F9_crise_systemique -> F9_systemic_crisis,
# ...); see case_studies/guadeloupe/legacy_names.py for how older runs are read.
#
# The crop groups named here come from `crop_groups.yaml` and from `crop_families` in
# `config.yaml`.

include:
  crop_groups: crop_groups.yaml

forcings:

  - name: F0_nominal
    description: "No forcing -- the policy alone, 2017 conditions."

  # --- Climate ----------------------------------------------------------------------------

  - name: F1_major_cyclone
    description: >-
      Category 4-5 cyclone. Tall perennial crops pay the most (banana, plantain, orchards);
      cane recovers better. Yield variance rises: under the Markowitz objective that alone
      moves risk-averse farms.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: {group: export_banana}, factor: 0.55}
        - {crops: {group: plantain}, factor: 0.60}
        - {crops: {group: orchards}, factor: 0.50}
        - {crops: {group: sugarcane}, factor: 0.65}
        - {crops: {group: market_gardening}, factor: 0.75}
      economic_overrides.variance_multipliers:
        - {crops: "*", factor: 1.30}

  - name: F2_severe_drought
    description: >-
      Multi-year drought: lower yields, irrigation-dependent crops made impracticable, and a
      withdrawal ceiling imposed on the resource (-30 %). The forcing that tests dependence
      on water rather than on income.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: {group: sugarcane}, factor: 0.70}
        - {crops: {group: market_gardening}, factor: 0.65}
        - {crops: {group: export_banana}, factor: 0.75}
        - {crops: {group: plantain}, factor: 0.70}
      economic_overrides.variance_multipliers:
        - {crops: "*", factor: 1.40}
    enable_add:
      - name: forbid_crops
        section: categorical_rules
        args: {label: drought_irrigated_ban, crops: [BA_IRR, ME, MA_ROTA]}
      - name: territory_indicator_bound
        args: {label: water_restriction, indicator: water, sense: le, threshold: 24262000,
               scale: 10.0, plot_weight: irrigable}

  - name: F3_climate_drift
    description: >-
      Not an event but a drift: -12 % yield everywhere, and above all a variance up 60 %.
      Specifically tests the RISK channel, distinct from the mean-loss channel -- a crop can
      keep its mean yield and become untenable.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: "*", factor: 0.88}
      economic_overrides.variance_multipliers:
        - {crops: "*", factor: 1.60}

  - name: F4_plant_health_shock
    description: >-
      Black Sigatoka established: export banana loses half its yield and its protection cost
      rises by a quarter; plantain is hit more lightly. A shock to one chain, not to the
      territory.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: {group: export_banana}, factor: 0.50}
        - {crops: {group: plantain}, factor: 0.70}
      economic_overrides.cost_multipliers:
        - {crops: {group: export_banana}, factor: 1.25}

  # --- Economy ----------------------------------------------------------------------------

  - name: F5_export_price_collapse
    description: >-
      End of trade preferences and depressed world sugar: -35 % on banana, -25 % on cane.
      Both export pillars give way at once.
    overrides:
      economic_overrides.price_multipliers:
        - {crops: {group: export_banana}, factor: 0.65}
        - {crops: {group: sugarcane}, factor: 0.75}

  - name: F6_input_price_shock
    description: >-
      Energy and fertiliser: +45 % on the variable costs of every crop. Hits harder the more
      intensive the system -- the forcing that should most separate the accelerationist pole
      from the agroecological one.
    overrides:
      economic_overrides.cost_multipliers:
        - {crops: "*", factor: 1.45}

  - name: F7_food_inflation
    description: >-
      Import chains break: local food-crop prices jump by 40 % while export prices do not
      move. A forcing FAVOURABLE to relocalisation -- it tests whether an export policy holds
      when the market itself turns back to local produce.
    overrides:
      economic_overrides.price_multipliers:
        - {crops: {group: food_crops}, factor: 1.40}

  - name: F8_posei_withdrawal
    description: >-
      The EU aid specific to the outermost regions is cut to 40 % of its level. A purely
      budgetary shock, changing neither agronomy nor markets.
    overrides:
      economic_overrides.subsidy_multipliers:
        - {crops: "*", factor: 0.40}

  # --- Combinations -----------------------------------------------------------------------

  - name: F9_systemic_crisis
    description: >-
      Everything at once: yields -20 %, export prices -25 %, costs +30 %, subsidies -40 %,
      variance +50 %. The plausible worst case, to rank policies on robustness rather than
      on nominal performance.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: "*", factor: 0.80}
      economic_overrides.price_multipliers:
        - {crops: {group: export_banana}, factor: 0.75}
        - {crops: {group: sugarcane}, factor: 0.75}
      economic_overrides.cost_multipliers:
        - {crops: "*", factor: 1.30}
      economic_overrides.subsidy_multipliers:
        - {crops: "*", factor: 0.60}
      economic_overrides.variance_multipliers:
        - {crops: "*", factor: 1.50}

  - name: F10_favourable_conditions
    description: >-
      The upper bound mirroring F9: +10 % yield, +15 % prices, -10 % costs, variance -20 %.
      Without it, one cannot tell whether a gap between policies comes from the forcing or
      from the policy -- it is the control from above.
    overrides:
      economic_overrides.yield_multipliers:
        - {crops: "*", factor: 1.10}
      economic_overrides.price_multipliers:
        - {crops: "*", factor: 1.15}
      economic_overrides.cost_multipliers:
        - {crops: "*", factor: 0.90}
      economic_overrides.variance_multipliers:
        - {crops: "*", factor: 0.80}

  - name: F11_land_take
    description: >-
      Loss of farmland: 8 % of the UAA leaves production, taken first from low-altitude land
      -- the land bordering towns, which urbanises first. The only forcing that removes LAND
      rather than changing a coefficient, and the only one that leaves production targets
      unchanged on a smaller area.
    enable_add:
      - name: land_take
        section: categorical_rules
        args: {label: land_take, crops: "*", share: 0.08, order_by: ALTITUDE}
