# The three reference calibration runs -- consumed by scripts/run_scenarios.py.
#
# WHY A SEPARATE SPEC. `scenarios.yaml` explores policies, `plan.yaml` crosses policies and
# forcings. These three runs are neither: they are the project's **fixed points**, the ones
# `references.yaml` declares and against which everything else is read. Keeping them in their
# own file lets them be regenerated in one command when the reporting gains a block, without
# rerunning a whole batch.
#
# THEY READ AS A SERIES, not as three independent runs: zero deviation (`calib_gams_parity`),
# one (`calib_bc_only`), both (`calib_selected`). That order attributes the calibration gain
# to each deviation; `references.yaml` only declares the two ends, the middle step exists for
# attribution only.
#
# They carry an explicit `name:`, so their output folder is `outputs/calib_gams_parity/` and
# `outputs/calib_selected/` -- not `output_7`. Runs solved before 2026-09-22 sit under their
# former French names (`calib_gams_parite/`, `calib_bc_seul/`, `calib_retenu/`);
# `references.yaml` looks for both.
#
# Regenerate them:
#   python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/scenarios_calibration.yaml
# Check before launching (seconds):
#   python scripts/run_scenarios.py --scenarios ... --dry-run
#   python scripts/check_scenario_feasibility.py --scenarios ...

runs:
  # --------------------------------------------------------------------------------------
  - name: calib_gams_parity
    description: >-
      The CALIB block ported as is, WITHOUT either of the two accepted deviations. It is the
      PARITY reference: what the original GAMS model produces on our data, hence the honest
      point of comparison to judge what the two deviations bring.
      Expected (measured on output_1 on 2026-07-27): territorial PAD 48.4 %, farm types
      64.0 %, plots 56.0 %, area 64.3 %, objective 84.98 M EUR.
      Its gap to the article's figures (PAD <15 %, types 81 %) comes from the provenance of
      the data -- 4 638 farms against 5 336, 2010 base year out of reach -- and not from a
      porting defect: the source-to-source investigation of 2026-07-27 ruled out the
      modelling causes one by one.
    disable:
      # Eq_BC_QUOTA_MAX: plantain market ceiling. Commented out of both GAMS model blocks, so
      # outside CALIB -- even though the article describes it (Eq. 6).
      - bc_quota_max
      # Eq_PN_PROD_MIN: fodder-area floor. Lives in the SCENARIO block, not CALIB.
      - pn_prod_min

  # --------------------------------------------------------------------------------------
  - name: calib_bc_only
    description: >-
      The INTERMEDIATE step: `bc_quota_max` alone, without the fodder floor. It only matters
      as the middle of three, between `calib_gams_parity` and `calib_selected`, because it
      splits the calibration gain between the two deviations -- territorial PAD
      48.4 % -> 31.7 % -> 6.6 %, farm types 64.0 % -> 67.0 % -> 86.9 %. In other words the
      plantain market ceiling covers a third of the way, the grassland floor the rest.
      Without this point the result can be attributed to neither.
      Expected (measured on 2026-07-28, folder then named `output_2`): objective
      81.79 M EUR, territorial PAD 31.69 %, farm types 66.97 %.
      SAME CAVEAT as `calib_selected` on the PAD: once `pn_prod_min` is active the grassland
      PAD is zero by construction -- here it is NOT, so the 31.7 % is an honest PAD.
    disable:
      # Only Eq_PN_PROD_MIN is removed: the plantain ceiling is kept to measure what it
      # brings on its own.
      - pn_prod_min

  # --------------------------------------------------------------------------------------
  - name: calib_selected
    description: >-
      The working calibration: CALIB plus the only two accepted deviations, both backed by
      a source EXOGENOUS to the observed land use (which is what sets them apart from the
      market ceilings discarded on 2026-07-23, which were fitted ON the observation and
      whose PAD was therefore zero by construction).
        * bc_quota_max = 6 440 t of plantain -- the GAMS author's figure, corroborated by
          the article's Eq. 6 (4 650 t). The 4 650 -> 40 000 t sweep shows a flat plateau
          whose optimum (9 240 t) is FAR from the observation: the constraint corrects a
          mechanism, it does not copy an answer.
        * pn_prod_min = 6 096 ha of grassland -- GAMS parameter QUOTA_PN_PIQ_MIN, i.e. 27 %
          BELOW the 8 341 ha implied by the 2017 annual agricultural statistics. Without it
          the model implied 9.99 LU/ha, three to four times the real stocking rate: the defect
          is proven outside the model.
      Expected (measured on output_3 on 2026-07-28): farm types 86.9 %, plots 67.6 %, area
      77.1 %, cane at 12 782 ha against 12 813 observed without any constraint naming it.
      DO NOT quote its 6.6 % territorial PAD: the floor pins grassland, whose PAD is zero by
      construction.
    # No override: this is config.yaml as is. The entry exists so that the run carries a
    # name, a justification, and a readable output folder.
    overrides: {}
