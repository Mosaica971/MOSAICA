# Which economic year and policy scenario to load. `year` picks a column in the indice_H
# economic tables (prices, yields, subsidies): one of 2017..2022, or the baseline columns
# init/calib. It drives ECONOMICS ONLY -- the plot/farm structure stays pinned to 2017,
# the only year whose structural data exists. `scenario` (RESTIT | SMART) selects the OTK
# cost matrix (Matrice_OTK_Cult_<scenario>) and the MAE-compost subsidy table
# (MAE_Compost_Cult_<scenario>). Note: it does NOT yet drive the CF crop files
# (Prix_Cult_CF_*, Rdt_Cult_CF_*), which the pipeline does not load -- see VIGILANCE.md.
data:
  year: "2017"        # economic-table column: 2017..2022, or init/calib
  scenario: "RESTIT"  # RESTIT | SMART

# Optional targeted economic shocks, applied on top of the year/scenario economics.
# Each list holds {crops: [...], factor: <float>} entries; the factor multiplies every
# listed crop (entries stack when crop lists overlap), crops not listed keep factor 1.0.
# price_multipliers scale prix_cult (sale price/ha, flows into sales + gross product);
# subsidy_multipliers scale the total subsidy/ha per crop. Absent (as here) = no shock,
# i.e. baseline economics. Meant primarily for scenario batches (scenarios.yaml), e.g. a
# +20% export-banana price or a -50% sugarcane subsidy, without new data tables.
# economic_overrides:
#   price_multipliers:
#     - {crops: [BA, BA_INT, BA_IRR, BA_PER, BA_SINT], factor: 1.2}
#   subsidy_multipliers:
#     - {crops: [CS, CS_BT_NISM, CS_BT_NIM], factor: 0.5}

# MILP solver. `name` is the Pyomo solver interface (appsi_highs = HiGHS via Pyomo's
# persistent APPSI wrapper); `args` passes extra HiGHS options (e.g. mip_rel_gap, threads).
# See core/model/solver.py.
solver:
  name: appsi_highs
  args:
    # mip_rel_gap: accept a solution proven within 1% of the optimum. ESSENTIAL with the
    # Markowitz objective: its mix of positive and negative coefficients (margin x
    # (1 - AVERS*Var_Rdt) goes negative for risk-averse farms on high-variance crops) makes
    # the LP relaxation deeply fractional, and at HiGHS's default 1e-4 gap the full-territory
    # solve did not finish in 37 h. At 1% it solves in minutes and the acreages -- all we
    # compare for calibration -- are unaffected. Measured 2026-07-23: Grande-Terre 51s,
    # Marie-Galante 11s (both non-terminating at the default gap). See VIGILANCE.md.
    mip_rel_gap: 0.01
    # Safety net: fail loudly after 1 h rather than grind for a day and a half. With the gap
    # above the real solve is far under this, so it should never trigger.
    time_limit: 3600

# Labor: annual working hours per full-time-equivalent (ETP/UTA), used to convert the
# estimated labor hours (surface x crop x technical itinerary x time per operation) into
# a number of full-time jobs. 1607 h/year is the French legal full-time base (35h/week).
# Adjust per scenario if you use a different labor convention.
# cost_per_hour (EUR/h) values that labor: total_labor_cost = total_hours x cost_per_hour,
# and net revenue = gross margin - labor cost (reported for input and output). Labor is NOT
# in the GAMS variable cost, so this is purely a reporting indicator (does not affect the
# optimum). 0 = leave labor unpriced (net revenue then equals gross margin).
labor:
  hours_per_etp: 1607
  cost_per_hour: 15.5

# Exposure indicators (reporting only -- no effect on the allocation). The price shock is
# applied *after* the solve to a fixed allocation, which is NOT what the scenario levers
# economics.price_multipliers / yield_multipliers do: those shock the inputs before the
# solve, so the optimizer adapts to them. Both are useful; they answer different questions.
resilience:
  # Relative shock on prix_cult, e.g. 0.20 = a 20% market price drop. Subsidies, variable
  # costs and the bagasse by-product are deliberately left untouched.
  price_shock_delta: 0.20

# Reporting-only knobs (no effect on the optimization itself).
reporting:
  environment:
    # Carbon -> CO2 conversion for the GES indicator (GAMS COEFF_C_CO2). Default 0.272.
    coeff_c_co2: 0.272

  # Calibration thresholds, from Chopin et al. (2015) section 2.6: percentage of absolute
  # deviation (PAD) between the observed 2017 acreage and the simulated one. The article
  # takes these values from Kanellopoulos et al. (2010), Hazell and Norton (1986) and
  # Janssen and van Ittersum (2007) -- they are review conventions, not model constraints,
  # and changing them changes only the verdicts printed in the recap.
  calibration:
    regional_pad_max: 15       # PAD (%) tolerated per crop over the whole territory
    subregional_pad_max: 20    # PAD (%) tolerated per crop within a sub-region
    farm_pad_max: 20           # PAD (%) tolerated per farm
    farm_type_match_min: 80    # minimum share (%) of farms simulated in their observed type

# Representative fine crop per aggregate baseline family (see VIGILANCE.md "point 4").
# The observed 2017 baseline is only known at aggregate/RPG resolution (e.g. "sugarcane",
# not which technical system), and the aggregate codes carry no economics of their own.
# To compute input-side production/subsidy/revenue/ETP (and input-vs-output deltas) we
# substitute a representative fine variant per family. THESE ARE ASSUMPTIONS -- review and
# adjust to your knowledge of the 2017 land use. Families AG/ME/JA are real single crops
# and need no substitution; NC (non cultivated) is excluded from the baseline.
baseline_representative_crops:
  AN: AN_NU        # ananas sans paillage plastique
  BA: BA_INT       # banane export intensive en plaine
  BC: BC_BT        # banane plantain Basse-Terre
  CS: CS_NGT_NISM  # canne a sucre Nord Grande-Terre, non irriguee, semi-mecanisee
  IG: IG_PLA       # igname a plat
  MA: MA_ROTA      # maraichage en rotation
  PN: PN_PIQ       # prairie avec elevage au piquet -- PN_TOUR est supprimee par Eq_PN_TOUR_SUPP
  VE: VE_BTGT      # vergers Basse-Terre & Grande-Terre

# Optional: restrict the optimization to a subset of plots (island/region/farm/plot),
# for faster small-scale test runs or local policy-transition scenarios. See
# docs/superpowers/specs/2026-07-10-zone-exclusion-filter-design.md. Absent (as here)
# means no restriction -- every plot is in play.
# zone_filter:
#   include:
#     islands: [1]
#   exclude:
#     farms: [E1471]

# Named crop groups reused by the constraints below via YAML anchors (&SC_*), referenced
# with *SC_* aliases. Each groups a base aggregate code with its fine technical variants.
crop_families:
  an: &SC_AN [AN, AN_NU, AN_PA]           # pineapple (ananas): base + variants
  ig: &SC_IG [IG, IG_PLA, IG_TUT]         # yam (igname): base + variants
  cs: &SC_CS                              # sugarcane (canne a sucre): base + all technical systems
    [CS, CS_BT_NISM, CS_BT_NIM, CS_BT_IM, CS_SBT_NISM, CS_SBT_NIM, CS_SBT_IM,
     CS_NGT_NISM, CS_NGT_NIM, CS_NGT_IM, CS_CGT_NISM, CS_CGT_NIM, CS_CGT_IM,
     CS_EGT_NISM, CS_EGT_NIM, CS_EGT_IM, CS_MG_NISM, CS_MG_NIM, CS_MG_IM]
  # Sugarcane sub-groups used by the GAMS ITK bans (MODELE.txt:254-319). The regional ones
  # (bt/sbt/ngt/cgt/egt/mg) mirror the GAMS SC_CS_* sets (SETS.txt:122-180); irrig/meca are
  # the technical-system cuts (IM = irrigated+mechanised, NIM = non-irrigated+mechanised).
  cs_irrig: &SC_CS_IRRIG [CS_BT_IM, CS_SBT_IM, CS_NGT_IM, CS_CGT_IM, CS_EGT_IM, CS_MG_IM]
  cs_meca: &SC_CS_MECA
    [CS_BT_NIM, CS_BT_IM, CS_SBT_NIM, CS_SBT_IM, CS_NGT_NIM, CS_NGT_IM,
     CS_CGT_NIM, CS_CGT_IM, CS_EGT_NIM, CS_EGT_IM, CS_MG_NIM, CS_MG_IM]
  cs_bt: &SC_CS_BT [CS_BT_NISM, CS_BT_NIM, CS_BT_IM]
  cs_sbt: &SC_CS_SBT [CS_SBT_NISM, CS_SBT_NIM, CS_SBT_IM]
  cs_ngt: &SC_CS_NGT [CS_NGT_NISM, CS_NGT_NIM, CS_NGT_IM]
  cs_cgt: &SC_CS_CGT [CS_CGT_NISM, CS_CGT_NIM, CS_CGT_IM]
  cs_egt: &SC_CS_EGT [CS_EGT_NISM, CS_EGT_NIM, CS_EGT_IM]
  cs_mg: &SC_CS_MG [CS_MG_NISM, CS_MG_NIM, CS_MG_IM]
  ban_ex: &SC_BAN_EX [BA, BA_INT, BA_IRR, BA_PER, BA_SINT]  # export banana (banane export)
  bc: &SC_BC [BC, BC_BT, BC_GTMG]         # plantain/creole banana (banane plantain)
  ma: &SC_MA                              # market gardening (maraichage): all mulch/fertiliser/irrigation combos
    [MA, MA_PLBIO, MA_MOBIO, MA_ROTA, MA_TO_CHOU_JA, MA_TO_CO_JA,
     MA_BAG_BIO_I, MA_BAG_BIO_NI, MA_BAG_VEG_I, MA_BAG_VEG_NI, MA_BAG_FER_I, MA_BAG_FER_NI,
     MA_BAG_NON_I, MA_BAG_NON_NI, MA_BRF_BIO_I, MA_BRF_BIO_NI, MA_BRF_VEG_I, MA_BRF_VEG_NI,
     MA_BRF_FER_I, MA_BRF_FER_NI, MA_BRF_NON_I, MA_BRF_NON_NI, MA_PAI_BIO_I, MA_PAI_BIO_NI,
     MA_PAI_VEG_I, MA_PAI_VEG_NI, MA_PAI_FER_I, MA_PAI_FER_NI, MA_PAI_NON_I, MA_PAI_NON_NI]
  plu: &SC_PLU [AG, VE, VE_BTGT, VE_PLUIE]  # rainfed fruit/orchards (agrumes + vergers)
  ba_ja: &SC_BA_JA [BA_INT, BA_IRR, BA_SINT]  # export-banana subset used in fallow-rotation ratios

# Objective functions. Exactly one must be enabled; the builder is selected by `name`.
objectives:
  # Disabled since 2026-07-21: maximising plain gross margin ignores risk, and risk is the
  # only thing separating the crops -- MA_ROTA yields 27929 EUR/ha at Var_Rdt 0.65 against
  # CS_NGT_NISM's 1521 at 0.20 and PN_PIQ's 1602 at 0.00. Without the risk term the model
  # puts market gardening on every plot in the territory (PAD 193%, see VIGILANCE.md).
  - name: maximize_gross_margin          # maximise sum(margin/ha x plot surface)
    enable: false
    args: {}

  # GAMS's own real solves (CALIB and SCENARIO) both maximize this risk-adjusted objective
  # (MODELE.txt:426-428, Eq_REV_MARKOVITZ), and it is what the article's calibration rests
  # on. Enabled 2026-07-21 -- see docs/superpowers/specs/
  # 2026-07-21-calibration-levers-design.md. Beyond AVERS ~1.48 sugarcane overtakes market
  # gardening, which covers 54% of farms; for breeders (AVERS 2.40) market gardening turns
  # outright negative and pasture (Var_Rdt 0) wins, exactly the article's mechanism.
  # AVERS is computed in-memory from the TYPE_EXPL/TYPE_EXPL_Bis cascade
  # (domain/farm_typology.py) rather than read from data/tables/Avers.txt (a uniform,
  # unvalidated stub); its eight coefficients match OPTIMISATION.txt:1745-1754 exactly.
  - name: maximize_risk_adjusted_gross_margin  # Markowitz: margin minus AVERS-weighted yield variance
    enable: true
    args: {}

# Model constraints, each built by the registered function in `name`. The same builder may
# recur with different `args`/`label`. Disabled entries (enable: false) are kept on purpose
# -- read the comment above each before re-enabling.
constraints:
  - name: at_most_one_crop_per_plot      # each plot gets at most one crop (core assignment rule)
    enable: true
    args: {}

  # farm_area_share_max: a crop group may cover at most `max_share` of each farm's area
  # (agronomic rotation ceiling).
  - name: farm_area_share_max
    enable: true
    args: {label: an_agro_max_expl, crops: *SC_AN, max_share: 0.75}  # pineapple <= 75% of farm area
  - name: farm_area_share_max
    enable: true
    args: {label: ig_agro_max_expl, crops: *SC_IG, max_share: 0.66}  # yam <= 66% of farm area

  # farm_area_ratio_min: numerator-crop area must be >= `ratio` x denominator-crop area per
  # farm (enforces fallow/rotation alongside banana).
  - name: farm_area_ratio_min
    enable: true
    args: {label: ba_ja, numerator_crops: [JA], denominator_crops: *SC_BA_JA, ratio: 0.2}  # fallow >= 20% of banana area
  - name: farm_area_ratio_min
    enable: true
    args:
      label: ba_rota  # fallow + sugarcane/CF area >= 20% of export-banana area (rotation)
      numerator_crops:
        [JA,
         CS, CS_BT_NISM, CS_BT_NIM, CS_BT_IM, CS_SBT_NISM, CS_SBT_NIM, CS_SBT_IM,
         CS_NGT_NISM, CS_NGT_NIM, CS_NGT_IM, CS_CGT_NISM, CS_CGT_NIM, CS_CGT_IM,
         CS_EGT_NISM, CS_EGT_NIM, CS_EGT_IM, CS_MG_NISM, CS_MG_NIM, CS_MG_IM,
         CF_NBT_NISM, CF_NBT_NIM, CF_SBT_NISM, CF_SBT_NIM, CF_NGT_NISM, CF_NGT_NIM,
         CF_CGT_NISM, CF_CGT_NIM, CF_EGT_NISM, CF_EGT_NIM]
      denominator_crops: *SC_BA_JA
      ratio: 0.2

  # Disabled by default: correctly implemented and unit-tested (Task 8), and this
  # entry is a byte-for-byte transcription of GAMS's Eq_CS_GFA, which does appear in
  # the SCENARIO equation list (MODELE.txt line 651) alongside Eq_FRICHE. But solving
  # the real 2017 Guadeloupe dataset with both active reveals a genuine algebraic
  # infeasibility: 3 real GFA farms (E1471, E273, E3955) have every plot fallow-locked
  # by friche_lock (Task 7) for 2015-2017, which forbids CS on those plots, while this
  # constraint demands >=60% of the farm's GFA area be planted in CS -- unsatisfiable
  # for a farm with zero CS-eligible area. Both equations are individually correct and
  # match GAMS; this is a genuine interaction in the real dataset, not a porting bug.
  # Re-enable once someone with the original GAMS/production results confirms whether
  # the real SCENARIO run tolerated this (e.g. per-farm exception, relaxed threshold,
  # or the real 2017 GFA/fallow data differed) -- see docs/superpowers/plans/
  # 2026-07-07-gams-parity-phase1-territory-farm-constraints.md Task 9 notes.
  # Re-enabled 2026-07-21 with skip_when_no_eligible_area, a DELIBERATE DEVIATION from
  # GAMS: the three farms above are skipped rather than sinking the whole solve. GAMS would
  # be infeasible there too; we choose to lose 3 farms out of 4588 (0.07%) instead of the
  # constraint entirely, because it is one of the few mechanisms that keeps sugarcane on the
  # map -- it pins 5286 ha of GFA land against 12813 ha of observed cane.
  # See docs/superpowers/specs/2026-07-21-calibration-levers-design.md.
  # RE-DISABLED the same day, 2026-07-21, on a second and independent infeasibility found
  # by an analytic pre-check: 7 GFA farms (E1551, E2026, E2551, E4043, E4570, E4595, E660)
  # need MORE labour to satisfy the 60% cane requirement than farm_labor_hours_max grants
  # them. E2026 is the starkest: 0.8 ha of cane = 10 h against a 3 h budget. Both
  # constraints are individually faithful to GAMS; their combination is not satisfiable on
  # this data, which says the observed 2017 plan of those farms already held less than 60%
  # of their GFA area in cane. Kept off because it is the weakest of the five calibration
  # levers (5286 ha of GFA against 12813 ha of observed cane, 41% coverage) and the only
  # one in conflict with the strongest. Re-open by settling the tension, not by relaxing
  # the labour cap: a slack big enough to clear E2026 would be 3.3x and would gut the cap.
  - name: cs_gfa_minimum_share
    enable: false
    args:  # sugarcane >= 60% of each GFA farm's area
      label: cs_gfa
      crops: *SC_CS
      min_share: 0.6
      skip_when_no_eligible_area: true

  # Eq_MO_MAX_Expl (MODELE.txt:368, Eq. 5 of the article): a farm may not demand more labour
  # than its observed 2017 cropping plan did. THE dominant anchor to reality -- the
  # pre-2026-07-21 solution required 21 593 ETP where Guadeloupe had 3 598, a factor of 6.
  # A cane farm has 12.7 h/ha to spend; market gardening asks 1653.
  # The cap is computed in data_pipeline.compute_farm_labor_capacity_hours through the
  # representative fine crops -- read its docstring before touching this, the literal GAMS
  # formula yields a near-zero cap on this data.
  # `slack` scales every cap (1.0 = faithful). GAMS keeps its own scenario multipliers
  # commented right under the formula: "x 1.7 pour S1, x 1.3 pour S2, x 10 pour S3".
  - name: farm_labor_hours_max
    enable: true
    args: {label: mo_max_expl, slack: 1.0}

  # territory_production_bound: territory-wide production floor/ceiling. `sense` le = cap,
  # ge = floor. A group contributes sum(plot surface x crop yield x rate_multiplier) when
  # use_yield: true (tonnes), or x rate_multiplier only when false (hectares). rate_multiplier
  # also carries edible/extraction fractions. Thresholds transcribe the GAMS territorial targets.
  - name: territory_production_bound
    enable: true
    args:
      label: ba_quota_max  # export banana: cap <= 77,877 t
      groups: [{crops: *SC_BAN_EX, use_yield: true, rate_multiplier: 1.0}]
      sense: le
      threshold: 77877
  - name: territory_production_bound
    enable: false
    args:
      label: me_quota_max  # melon: cap <= 80,000 t (disabled)
      groups: [{crops: [ME], use_yield: true, rate_multiplier: 1.0}]
      sense: le
      threshold: 80000
  - name: territory_production_bound
    enable: false
    args:
      label: an_quota_max  # pineapple: cap <= 70,000 t (x0.667 edible fraction) (disabled)
      groups: [{crops: *SC_AN, use_yield: true, rate_multiplier: 0.6666666666666666}]
      sense: le
      threshold: 70000
  - name: territory_production_bound
    enable: false
    args:
      label: ig_quota_max  # yam: cap <= 50,000 t (disabled)
      groups: [{crops: *SC_IG, use_yield: true, rate_multiplier: 1.0}]
      sense: le
      threshold: 50000
  - name: territory_production_bound
    enable: false
    args:
      label: bc_quota_max  # plantain: cap <= 40,000 t (disabled)
      groups: [{crops: *SC_BC, use_yield: true, rate_multiplier: 1.0}]
      sense: le
      threshold: 40000
  - name: territory_production_bound
    enable: true
    args:
      label: cs_quota_max  # sugarcane: sugar cap <= 107,000 t (x0.072 extraction rate)
      groups: [{crops: *SC_CS, use_yield: true, rate_multiplier: 0.072}]
      sense: le
      threshold: 107000

  # ---------------------------------------------------------------------------------
  # PRODUCTION FLOORS (sense: ge) -- ALL DISABLED 2026-07-21.
  #
  # Two reasons, and the first alone settles it.
  #
  # 1. FIDELITY. These are SCENARIO-model equations in GAMS (Eq_*_PROD_MIN and the food
  #    objectives Eq_LEG/FRU/PAT_PROD_OBJ, MODELE.txt:682-693). The CALIB model -- the one
  #    Chopin et al. (2015) evaluate in section 3.1, and the one we are trying to reproduce
  #    -- does NOT contain them (see the CALIB list at MODELE.txt:450-565). Keeping them on
  #    while calibrating was already a divergence.
  #
  # 2. FEASIBILITY. Combined with farm_labor_hours_max they make the model INFEASIBLE, and
  #    main.py did fail on 2026-07-21 with exactly that. Satisfying every floor through its
  #    cheapest eligible crop already costs 6 222 537 h against a 6 252 740 h cap -- a 0.5%
  #    margin on a LOWER bound that ignores plots competing for the same land. And the two
  #    are structurally mismatched: the cap is PER FARM while the floors are TERRITORIAL, so
  #    the farms that would have to grow the market gardening are precisely the ones whose
  #    observed cane plan leaves them no hours.
  #
  # Re-enable them for scenario work that needs food-security targets, but then either
  # relax farm_labor_hours_max (its `slack` argument) or turn it off -- the two cannot both
  # hold as written. See docs/superpowers/specs/2026-07-21-calibration-levers-design.md.
  # ---------------------------------------------------------------------------------
  - name: territory_production_bound
    enable: false
    args:
      label: bc_prod_min  # plantain: floor >= 4,056 t
      groups: [{crops: *SC_BC, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 4056
  - name: territory_production_bound
    enable: false
    args:
      label: ig_prod_min  # yam: floor >= 5,125 t
      groups: [{crops: *SC_IG, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 5125
  - name: territory_production_bound
    enable: false
    args:
      label: ma_prod_min  # market gardening: floor >= 26,404 t
      groups: [{crops: *SC_MA, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 26404
  - name: territory_production_bound
    enable: false
    args:
      label: an_prod_min  # pineapple: floor >= 2,322 t (x0.667 edible fraction)
      groups: [{crops: *SC_AN, use_yield: true, rate_multiplier: 0.6666666666666666}]
      sense: ge
      threshold: 2322
  - name: territory_production_bound
    enable: false
    args:
      label: plu_prod_min  # rainfed fruit/orchards: floor >= 5,879 t
      groups: [{crops: *SC_PLU, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 5879
  - name: territory_production_bound
    enable: false
    args:
      label: me_prod_min  # melon: floor >= 4,135 t
      groups: [{crops: [ME], use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 4135
  - name: territory_production_bound
    enable: false
    args:
      label: pn_prod_min  # pasture (PN_PIQ): floor >= 6,096 ha (surface, use_yield false)
      groups: [{crops: [PN_PIQ], use_yield: false, rate_multiplier: 1.0}]
      sense: ge
      threshold: 6096

  - name: territory_production_bound
    enable: false
    args:
      label: leg_prod_obj  # vegetables/market gardening: production target >= 63,059 t
      groups: [{crops: *SC_MA, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 63059
  - name: territory_production_bound
    enable: false
    args:
      # tub_prod_obj: documented PLACEHOLDER kept for GAMS traceability (Eq_TUB_PROD_OBJ).
      # Intentionally enable: false with threshold 0, which would be a no-op even if
      # enabled (`sum >= 0` always holds). Do NOT enable it without setting a real target
      # first -- flipping the flag alone changes nothing and only adds a dead constraint.
      label: tub_prod_obj
      groups: [{crops: *SC_IG, use_yield: true, rate_multiplier: 1.0}]
      sense: ge
      threshold: 0
  - name: territory_production_bound
    enable: false
    args:
      label: fru_prod_obj  # all fruit combined (plantain + pineapple + rainfed + melon): >= 30,789 t
      groups:
        - {crops: *SC_BC, use_yield: true, rate_multiplier: 1.0}
        - {crops: *SC_AN, use_yield: true, rate_multiplier: 0.6666666666666666}
        - {crops: *SC_PLU, use_yield: true, rate_multiplier: 1.0}
        - {crops: [ME], use_yield: true, rate_multiplier: 1.0}
      sense: ge
      threshold: 30789
  - name: territory_production_bound
    enable: false
    args:
      label: pat_surf_obj  # pasture surface target >= 12,193 ha
      groups: [{crops: [PN_PIQ], use_yield: false, rate_multiplier: 1.0}]
      sense: ge
      threshold: 12193

# Numeric eligibility bounds: a (plot, crop) pair is eligible only if the plot's `attribute`
# lies within the crop's [min_col, max_col] range (columns read from Data_Cult). All four
# criteria are intersected. See core/data/eligibility.py.
eligibility_criteria:
  - name: altitude                       # plot ALTITUDE within crop's [ALTI_MIN, ALTI_MAX] (m)
    enable: true
    args:
      attribute: ALTITUDE
      min_col: ALTI_MIN
      max_col: ALTI_MAX
  - name: slope                          # plot PENTE within crop's [PENTE_MIN, PENTE_MAX] (%)
    enable: true
    args:
      attribute: PENTE
      min_col: PENTE_MIN
      max_col: PENTE_MAX
  - name: rainfall                       # plot PLUVIO_PARC within crop's [PLUVIO_MIN, PLUVIO_MAX] (mm)
    enable: true
    args:
      attribute: PLUVIO_PARC
      min_col: PLUVIO_MIN
      max_col: PLUVIO_MAX
  - name: plot_size                      # plot SURF_HA within crop's [SURF_PARC_MIN, SURF_PARC_MAX] (ha)
    enable: true
    args:
      attribute: SURF_HA
      min_col: SURF_PARC_MIN
      max_col: SURF_PARC_MAX

# Categorical eligibility rules: each forbids a set of crops on plots matching a categorical
# condition (irrigation, soil, region, risk, fallow history). Intersected with the numeric
# bounds above. See core/data/eligibility.py + case_studies/guadeloupe/constraints.py.
categorical_rules:
  # ---------------------------------------------------------------------------------
  # Eq_*_SUPP (MODELE.txt:324-340) -- activities GAMS suppresses outright, present in
  # both the CALIB and SCENARIO equation lists. Ported 2026-07-21; before that every one
  # of these was selectable here, and the solver did pick TH on 528 plots. Removing them
  # also drops ~350 000 decision variables out of 1.68 M, so solves get faster.
  # See docs/superpowers/specs/2026-07-21-calibration-levers-design.md.
  #
  # The eight aggregate codes exist only to ENCODE THE OBSERVED 2017 BASELINE
  # (Matrice_Parc_Cult, ENTREES.txt:58-102). They carry no ITK and no economics, so they
  # were never going to be chosen -- but they must not be decision variables either.
  - name: forbid_crops                   # Eq_AN/BA/BC/CS/IG/MA/PN/VE_SUPP
    enable: true
    args: {crops: [AN, BA, BC, CS, IG, MA, PN, VE]}
  # Eq_TH_SUPP: tomato is described in the activity database but not offered to farmers.
  - name: forbid_crops
    enable: true
    args: {crops: [TH]}
  # Eq_PN_TOUR_SUPP: rotational grazing suppressed -- PN_PIQ is the only pasture activity,
  # and it is the one Eq_PN_PROD_MIN targets.
  - name: forbid_crops
    enable: true
    args: {crops: [PN_TOUR]}
  # Eq_CF_SUPP: the whole fibre-cane block is suppressed in both models. The Eq_CF_* wiring
  # left in TODO.md concerns the SCENARIO variants, not this baseline suppression.
  - name: forbid_crops
    enable: true
    args: {crops: [CF_NBT_NISM, CF_NBT_NIM, CF_SBT_NISM, CF_SBT_NIM, CF_NGT_NISM,
                   CF_NGT_NIM, CF_CGT_NISM, CF_CGT_NIM, CF_EGT_NISM, CF_EGT_NIM]}
  # Eq_CS_SBT_NISM_supp / Eq_CS_MG_NIM_supp: two cane technical systems suppressed
  # individually, unlike the rest of the CS family.
  - name: forbid_crops
    enable: true
    args: {crops: [CS_SBT_NISM, CS_MG_NIM]}
  # ---------------------------------------------------------------------------------

  - name: irrigation_required            # ME, MA_ROTA only on irrigated plots (IRRIG_PARC true)
    enable: true
    args:
      crops: [ME, MA_ROTA]
      irrigation_column: IRRIG_PARC
  # Eq_AN_SOL_Parc (MODELE.txt:221): pineapple forbidden where TYPE_SOL <> 2, i.e. allowed
  # ONLY on soil type 2. Until 2026-07-23 this was mis-ported as soil_type_forbidden on
  # type 2 -- the exact INVERSE, making pineapple eligible on 18045 wrong-soil plots and
  # none of the 5286 right ones. That was the cause of the 20x pineapple over-planting in
  # output_13 (133 ha observed -> 2765 simulated). op: ne restores the GAMS semantics.
  - name: attribute_forbidden           # AN forbidden off soil type 2
    enable: true
    args:
      crops: [AN, AN_NU, AN_PA]
      conditions:
        - {column: TYPE_SOL, op: ne, value: 2}
  # ME forbidden on soil types 2/3/4 OR on island 1. Two entries rather than one rule:
  # each forbids its own subset and the mask keeps the union forbidden, which is how an OR
  # is expressed here (a single attribute_forbidden entry ANDs its conditions).
  - name: attribute_forbidden           # ME forbidden on soil types 2/3/4
    enable: true
    args:
      crops: [ME]
      conditions:
        - {column: TYPE_SOL, op: in, value: [2, 3, 4]}
  - name: attribute_forbidden           # ME forbidden on island 1
    enable: true
    args:
      crops: [ME]
      conditions:
        - {column: ILE, op: eq, value: 1}
  - name: max_risk_threshold            # IG_TUT only where black-leaf-streak risk RISQUE_CLD <= 3
    enable: true
    args:
      crops: [IG_TUT]
      risk_column: RISQUE_CLD
      max_allowed: 3
  - name: exact_risk_value              # PN_PIQ only where RISQUE_CLD == 1
    enable: true
    args:
      crops: [PN_PIQ]
      risk_column: RISQUE_CLD
      allowed_value: 1
  - name: region_crop_forbidden         # ME forbidden in the listed REGION_CODE regions
    enable: true
    args:
      crops: [ME]
      region_column: REGION_CODE
      forbidden_regions: [R0, R1, R3, R4, R5, R6, R7, R9, R10, R12, R13, R14, R17, R19, R21, R25, R26, R27]
  # --- GAMS geographic/soil/irrigation ITK bans (MODELE.txt:243-319), ported 2026-07-20.
  # Uses data_parc["REGION"] (1-7 macro agro-region), COMMUNE (INSEE), ILE (1=BT,2=GT,3=MG).
  # NOT REGION_CODE (R0-R27 petites-regions), which only drives the melon rule above.
  # Eq_CS_IRR: irrigated sugarcane disabled everywhere (condition IRRIG in {0,1} = all plots).
  - name: forbid_crops
    enable: true
    args: {crops: *SC_CS_IRRIG}
  # Eq_CS_SOL_SQUE: mechanized sugarcane forbidden on skeletal soil (SOL_COURT = 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_MECA, conditions: [{column: SOL_COURT, op: eq, value: 1}]}
  # Eq_CS_CONFORM: mechanized sugarcane forbidden on ill-shaped plots (CONFORM > 1500).
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_MECA, conditions: [{column: CONFORM, op: gt, value: 1500}]}
  # Eq_CS_BT: Basse-Terre sugarcane forbidden where ILE != 1 AND REGION != 5.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_BT, conditions: [{column: ILE, op: ne, value: 1}, {column: REGION, op: ne, value: 5}]}
  # Eq_CS_SBT: South Basse-Terre sugarcane forbidden where REGION != 5.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_SBT, conditions: [{column: REGION, op: ne, value: 5}]}
  # Eq_CS_NGT: North Grande-Terre sugarcane forbidden outside its communes.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_NGT, conditions: [{column: COMMUNE, op: not_in, value: [97102, 97119, 97122]}]}
  # Eq_CS_CGT: Centre Grande-Terre sugarcane forbidden outside its communes.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_CGT, conditions: [{column: COMMUNE, op: not_in, value: [97116, 97113, 97101]}]}
  # Eq_CS_EGT: East Grande-Terre sugarcane forbidden outside its communes.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_EGT, conditions: [{column: COMMUNE, op: not_in, value: [97117, 97128, 97125]}]}
  # Eq_CS_MG: Marie-Galante sugarcane forbidden where ILE != 3.
  - name: attribute_forbidden
    enable: true
    args: {crops: *SC_CS_MG, conditions: [{column: ILE, op: ne, value: 3}]}
  # Eq_MA_TO_CHOU_JA_LOC: forbidden where ILE != 1 AND not irrigated.
  - name: attribute_forbidden
    enable: true
    args: {crops: [MA_TO_CHOU_JA], conditions: [{column: ILE, op: ne, value: 1}, {column: IRRIG_PARC, op: eq, value: 0}]}
  # Eq_ME_MG: melon forbidden in REGION 7. Distinct from the REGION_CODE melon rule above
  # (different referential); both are restrictive, so the intersection is safe. See
  # docs/gams_port_inventory.md for the open question on whether they overlap by design.
  - name: attribute_forbidden
    enable: true
    args: {crops: [ME], conditions: [{column: REGION, op: eq, value: 7}]}
  # Eq_IG_PLA_ILE: flat-yam forbidden in Basse-Terre (ILE = 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [IG_PLA], conditions: [{column: ILE, op: eq, value: 1}]}
  # Eq_IG_TUT_ILE: staked-yam forbidden outside Basse-Terre (ILE != 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [IG_TUT], conditions: [{column: ILE, op: ne, value: 1}]}
  # Eq_BA_IRR: irrigated banana forbidden on non-irrigated plots (IRRIG_PARC = 0).
  - name: attribute_forbidden
    enable: true
    args: {crops: [BA_IRR], conditions: [{column: IRRIG_PARC, op: eq, value: 0}]}
  # Eq_BA_IRR_BT: irrigated banana forbidden in Basse-Terre (ILE = 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [BA_IRR], conditions: [{column: ILE, op: eq, value: 1}]}
  # Eq_BC_BT: Basse-Terre plantain forbidden outside Basse-Terre (ILE != 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [BC_BT], conditions: [{column: ILE, op: ne, value: 1}]}
  # Eq_BC_GTMG: GT/MG plantain forbidden in Basse-Terre (ILE = 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [BC_GTMG], conditions: [{column: ILE, op: eq, value: 1}]}
  # Eq_BC_IRR_BT: Basse-Terre plantain forbidden where PLUVIO < 2300 AND not irrigated.
  - name: attribute_forbidden
    enable: true
    args: {crops: [BC_BT], conditions: [{column: PLUVIO_PARC, op: lt, value: 2300}, {column: IRRIG_PARC, op: eq, value: 0}]}
  # Eq_BC_IRR_GTMG: GT/MG plantain forbidden where ILE != 1 AND not irrigated.
  - name: attribute_forbidden
    enable: true
    args: {crops: [BC_GTMG], conditions: [{column: ILE, op: ne, value: 1}, {column: IRRIG_PARC, op: eq, value: 0}]}
  # Eq_AG_IRR: citrus (AG) forbidden where not irrigated AND altitude < 400.
  - name: attribute_forbidden
    enable: true
    args: {crops: [AG], conditions: [{column: IRRIG_PARC, op: eq, value: 0}, {column: ALTITUDE, op: lt, value: 400}]}
  # Eq_AG_BT: citrus (AG) forbidden outside Basse-Terre (ILE > 1).
  - name: attribute_forbidden
    enable: true
    args: {crops: [AG], conditions: [{column: ILE, op: gt, value: 1}]}
  # Eq_VE_IRR: VE_BTGT forbidden where PLUVIO < 2700 AND not irrigated.
  - name: attribute_forbidden
    enable: true
    args: {crops: [VE_BTGT], conditions: [{column: PLUVIO_PARC, op: lt, value: 2700}, {column: IRRIG_PARC, op: eq, value: 0}]}
  #
  # /!\ GAMS BUG PORTED FAITHFULLY -- Eq_VE_BTGT and Eq_VE_PLUIE (MODELE.txt:305-307) query
  # Data_RPG_Gwad on columns REGION / ILE that DO NOT EXIST in that table (it only holds
  # ident + cult_2012..cult_2017). GAMS silently returns 0 for such lookups, so:
  #   Eq_VE_BTGT: "Data_Parc.REGION=4 OR Data_RPG.REGION=5" -> 2nd term always false
  #               -> effective ban is REGION = 4 only (NOT {4,5}).
  #   Eq_VE_PLUIE: "Data_RPG.REGION=6 OR Data_RPG.ILE<>1" -> 1st false, 2nd is 0<>1 = ALWAYS
  #               TRUE -> VE_PLUIE is effectively banned on every plot.
  # Decision 2026-07-20: port the real GAMS behaviour (parity mandate). The intended-reading
  # variants are written below as enable: false -- flip the pairs to switch. See VIGILANCE.md.
  # Eq_VE_BTGT (faithful): VE_BTGT forbidden where REGION = 4.
  - name: attribute_forbidden
    enable: true
    args: {crops: [VE_BTGT], conditions: [{column: REGION, op: eq, value: 4}]}
  # Eq_VE_BTGT (intended reading): REGION in {4, 5}.
  - name: attribute_forbidden
    enable: false
    args: {crops: [VE_BTGT], conditions: [{column: REGION, op: in, value: [4, 5]}]}
  # Eq_VE_PLUIE (faithful): banned everywhere.
  - name: forbid_crops
    enable: true
    args: {crops: [VE_PLUIE]}
  # Eq_VE_PLUIE (intended reading): REGION = 6 (part 1 of the OR).
  - name: attribute_forbidden
    enable: false
    args: {crops: [VE_PLUIE], conditions: [{column: REGION, op: eq, value: 6}]}
  # Eq_VE_PLUIE (intended reading): ILE != 1 (part 2 of the OR).
  - name: attribute_forbidden
    enable: false
    args: {crops: [VE_PLUIE], conditions: [{column: ILE, op: ne, value: 1}]}
  #
  # friche_lock: plots left fallow (fallow_codes) across every year of history_columns are
  # locked out of the listed crops -- the GAMS Eq_FRICHE rule. crops list = CULT_NON_NC set.
  - name: friche_lock
    enable: true
    args:
      history_columns: [cult_2015, cult_2016, cult_2017]
      fallow_codes: [0, 10, 14]
      crops:
        [AG, AN, AN_NU, AN_PA, BA, BA_INT, BA_IRR, BA_PER, BA_SINT, BC, BC_BT, BC_GTMG,
         CF_NBT_NISM, CF_NBT_NIM, CF_SBT_NISM, CF_SBT_NIM, CF_NGT_NISM, CF_NGT_NIM,
         CF_CGT_NISM, CF_CGT_NIM, CF_EGT_NISM, CF_EGT_NIM,
         CS, CS_BT_NISM, CS_BT_NIM, CS_BT_IM, CS_SBT_NISM, CS_SBT_NIM, CS_SBT_IM,
         CS_NGT_NISM, CS_NGT_NIM, CS_NGT_IM, CS_CGT_NISM, CS_CGT_NIM, CS_CGT_IM,
         CS_EGT_NISM, CS_EGT_NIM, CS_EGT_IM, CS_MG_NISM, CS_MG_NIM, CS_MG_IM,
         IG, IG_PLA, IG_TUT, JA, MA, MA_TO_CHOU_JA, MA_PLBIO, MA_MOBIO, MA_ROTA, ME,
         PN, PN_PIQ, PN_TOUR, TH, VE, VE_BTGT, VE_PLUIE, MA_TO_CO_JA,
         MA_BAG_BIO_I, MA_BAG_BIO_NI, MA_BAG_VEG_I, MA_BAG_VEG_NI, MA_BAG_FER_I, MA_BAG_FER_NI,
         MA_BAG_NON_I, MA_BAG_NON_NI, MA_BRF_BIO_I, MA_BRF_BIO_NI, MA_BRF_VEG_I, MA_BRF_VEG_NI,
         MA_BRF_FER_I, MA_BRF_FER_NI, MA_BRF_NON_I, MA_BRF_NON_NI, MA_PAI_BIO_I, MA_PAI_BIO_NI,
         MA_PAI_VEG_I, MA_PAI_VEG_NI, MA_PAI_FER_I, MA_PAI_FER_NI, MA_PAI_NON_I, MA_PAI_NON_NI]
