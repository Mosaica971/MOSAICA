# SPEC D'ETAPE D-SOCLES -- les deux politiques NUES qui n'ont pas converge.
#
# A LANCER AVANT `plan_etape_D.yaml`. Ce n'est pas une preference d'ordonnancement, c'est une
# dependance : les deux cellules P8 du lot D s'amorcent sur l'allocation non forcee de P8
# (`seed_candidates` propose la politique nue avant toute autre graine). Tant que P8 nue est
# elle-meme bloquee sur un incumbent sous-optimal, reprendre P8 x F0 revient a relancer le meme
# solve avec la meme graine -- deux heures machine pour reecrire le meme nombre.
#
# LA MESURE QUI L'ETABLIT (etat des `outputs/` au 2026-08-10, 38 runs, 10 non convergés) :
#
#   p8_transition_agroecologique             68 445 374   maxTimeLimit  3 617 s
#   p8_transition_agroecologique_f0_nominal  68 445 374   maxTimeLimit  3 643 s
#
# Rigoureusement le meme objectif. F0 etant le forcage NUL, l'egalite serait le resultat
# attendu si les deux avaient converge -- mais ici elle ne demontre rien : la cellule forcee a
# recu l'incumbent de la nue et ne l'a jamais ameliore. Les deux runs ne sont pas deux
# resultats concordants, c'est un seul resultat compte deux fois. (Le contraste avec P4 est
# instructif : P4 nue est OPTIMAL a 81 036 580 quand P4 x F0 plafonne a 80 468 932. La ou le
# solve aboutit, l'ecart F0 mesure exactement ce que le branch-and-bound a laisse.)
#
# CE QU'IL LANCE -- 2 solves, un par politique, amorces chacun sur son propre incumbent.
#
#   P8_transition_agroecologique   pivot du chapitre 4 : temoin du front azote, source de
#                                  graine des deux cellules du lot D, et valeur contre
#                                  laquelle se verifie le point de controle du front.
#   P5_austerite_budgetaire        cellule de la grille politiques x forcages, citee telle
#                                  quelle. 50 622 686 en maxTimeLimit apres 3 625 s.
#
# LE LEVIER EST LE TEMPS, ET C'EST UN PARI -- a annoncer comme tel. Les dix runs non convergés
# sortent tous entre 3 617 et 3 701 s : ils butent sur `solver.args.time_limit: 3600`, pas sur
# une difficulte qui se contournerait par une graine. Mais rien ne garantit que tripler le
# temps ferme le gap : `config.yaml` (lignes 51-62) documente le precedent inverse, un solve a
# `mip_rel_gap: 0.001` qui a consomme l'heure entiere pour rendre un incumbent IDENTIQUE a
# celui du 1 %. Le branch-and-bound cale, il ne progresse pas lentement.
#   -> D'ou le choix de tester le pari sur DEUX runs avant d'y engager le lot D complet.
#      Le gap de depart de P8 nue est mesurable : borne LP 71 065 297 (plan_etape_BC.yaml:37),
#      incumbent 68 445 374, soit 3,69 % contre les 1 % vises. Il y a 2,7 points a fermer.
#   -> Un plan-cellule n'accepte que `forcings:` et `sweeps:` (core/config.py:565), donc le
#      temps NE PEUT PAS se regler ici. Il se regle dans `config.yaml` avant le batch, et
#      chaque run en garde la trace dans son `config_used.yaml`.
#
# ECARTER LES DOSSIERS D'ABORD -- meme raison que pour le lot D, avec une consequence de plus.
# `create_output_folder` suffixe au lieu d'ecraser : sans quarantaine, le nouveau P8 nue
# s'appellerait `p8_transition_agroecologique_2` et `seed_candidates` continuerait de proposer
# l'ANCIEN aux cellules du lot D. La quarantaine n'est pas de l'hygiene, c'est ce qui rend le
# chainage correct.
#
#   mkdir outputs\_non_converges
#   move outputs\p8_transition_agroecologique     outputs\_non_converges\
#   move outputs\p5_austerite_budgetaire          outputs\_non_converges\
#
# Ne pas les supprimer : le memoire cite leur statut, et ils portent les graines ci-dessous.
#
# LANCEMENT -- un run a la fois, chacun amorce sur SON propre incumbent. Reamorcer un solve sur
# sa propre solution n'est pas circulaire : cela lui evite de redepenser du temps a retrouver un
# incumbent qu'on a deja, et laisse les trois heures a ce qui bloque vraiment, la fermeture de
# la borne. Un `--warm-start-from` global vaudrait pour les DEUX runs et l'audit rejetterait
# la graine croisee -- sans dommage, mais sans interet.
#
#   .venv/Scripts/python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan_etape_D_socles.yaml --dry-run
#
#   .venv/Scripts/python scripts/run_scenarios.py \
#       --scenarios case_studies/guadeloupe/plan_etape_D_socles.yaml \
#       --policies P8_transition_agroecologique \
#       --warm-start-from outputs/_non_converges/p8_transition_agroecologique
#
#   .venv/Scripts/python scripts/run_scenarios.py \
#       --scenarios case_studies/guadeloupe/plan_etape_D_socles.yaml \
#       --policies P5_austerite_budgetaire \
#       --warm-start-from outputs/_non_converges/p5_austerite_budgetaire
#
# ===========================================================================================
# RESULTAT, 2026-08-10 : LE PARI EST PERDU. MESURE, PAS SUPPOSE.
#
#   P8 nue   1 h  ->  68 445 374   gap 3,69 %   azote 1 351 623   3 617 s
#   P8 nue   3 h  ->  68 644 754   gap 3,41 %   azote 1 351 522  10 823 s
#
# Trois fois le temps a rapporte +199 380 EUR, soit +0,29 % -- et ferme 0,28 point de gap sur
# les 2,69 qui separaient de la cible a 1 %. Le branch-and-bound n'etant pas lineaire, une
# extrapolation optimiste met le 1 % a une trentaine d'heures de solve pour ce seul run. Sur
# cette instance HiGHS cale, il ne progresse pas lentement -- exactement le comportement que
# `config.yaml` (lignes 51-62) documentait deja a `mip_rel_gap: 0.001`.
#
# CONSEQUENCES, ET ELLES SONT NETTES :
#
#   1. REMETTRE `solver.args.time_limit` A 3600. Rien ne justifie de payer trois heures.
#   2. NE PAS LANCER LE SOCLE P5. Il gagnerait le meme demi-pourcent, resterait en
#      `maxTimeLimit`, et garderait donc sa dague dans le memoire : zero information achetee
#      pour trois heures machine. `p5_austerite_budgetaire` reste en quarantaine -- le RENDRE
#      A `outputs/` avant toute regeneration de la grille, il y est cite.
#   3. LE RUN N'EST PAS PERDU POUR AUTANT. Sa nouvelle allocation consomme 1 351 522 kg N, ce
#      qui la rend faisable au plafond de 1 351 632 et A LUI SEUL parmi les cinq points du
#      front. C'est la graine qui manquait au point de controle -> voir la seconde passe de
#      `plan_etape_B_reliquat.yaml`.
#   4. LE CHAPITRE 4 ECRIT LA LIMITE PLUTOT QUE DE LA CONTOURNER : sur cette instance le
#      solveur cale a 3,4 % de la borne LP. C'est une limite mesuree -- avec son cout et son
#      rendement decroissant -- et non un aveu.
#
# ===========================================================================================
# CORRECTION DU 2026-08-11 -- le verdict ci-dessus tenait sur une reference lache. LIRE ICI
# AVANT DE S'EN SERVIR.
#
# Le point de controle du front (`plan_etape_B_reliquat.yaml`, seconde passe) a converge :
# 69 088 438, OPTIMAL, sur un ensemble faisable identique a celui de P8 nue (son unique
# contrainte de plus est un doublon exact de `plafond_azote`). C'est donc l'optimum du
# probleme P8, et il rectifie deux affirmations du bloc precedent.
#
#   1. LE GAP DE 3,41 % ETAIT MESURE CONTRE LA BORNE LP RACINE. L'optimum entier valant
#      69 088 438, le saut d'integralite pese a lui seul 2,78 % : le run de 3 h n'etait
#      sous-optimal que de 0,64 %, pas de 3,41 %. « HiGHS cale a 3,4 % de l'optimum » est
#      faux ; « le solveur cale a 0,6 % de l'optimum, et la relaxation LP est lache de 2,8 % »
#      est ce que la mesure dit. Le chapitre 4 ne doit pas confondre les deux.
#
#   2. NE PAS REMETTRE `time_limit` A 3600. La consequence n. 1 du bloc precedent est annulee.
#      Le rendement du temps est mauvais A GRAINE FIXE (1 h -> 3 h : +0,29 %) mais bon EN
#      CHAINE, chaque etape repartant de l'incumbent de la precedente : 68 445 374, puis
#      68 644 754, puis 69 088 438 prouve. Et l'etape qui a converge a mis 7 774 s -- une
#      limite d'une heure l'aurait tranchee juste avant. `time_limit: 10800` reste en place.
#
# La consequence n. 2 (ne pas lancer le socle P5) TIENT : P5 nue n'est la graine de personne,
# aucune cellule ne l'attend, et son statut dague est un resultat presentable tel quel.
# `p5_austerite_budgetaire` est de retour dans `outputs/`.
#
# Ce fichier est jetable. Il est conserve pour la mesure ci-dessus -- le seul chiffrage qu'on
# ait du rendement du temps de solve, a condition de la lire avec la correction.

include:
  crop_groups: crop_groups.yaml
  policies:    scenarios_politiques.yaml
  forcings:    scenarios_forcages.yaml

scenarios:

  # Aucune liste de forcages : une cellule sans `forcings:` emet exactement le run nominal de
  # la politique (core/config.py:526-530), ce qui est precisement ce qu'on veut reprendre ici.
  P8_transition_agroecologique:
  P5_austerite_budgetaire:
