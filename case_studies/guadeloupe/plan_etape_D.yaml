# SPEC D'ETAPE D -- reprendre les cellules qui n'ont pas converge.
#
# POURQUOI CE LOT EXISTE. Cinq runs du batch des 2026-08-02/03 sont sortis en `maxTimeLimit`.
# Ce n'est pas un defaut de precision : un incumbent rendu a la limite de temps est
# PROUVABLEMENT sous-optimal (docs/04-vigilance.md B.2 -- une solution construite a la main en
# quelques secondes bat de 5,5 % ce que HiGHS trouve en une heure). Les citer comme resultats
# reviendrait a comparer des politiques sur la qualite du hasard de branchement.
#
# Deux d'entre eux comptent particulierement :
#   * `p4_statu_quo_f0_nominal` est l'ANCRAGE de toute la grille prospective -- c'est la
#     cellule contre laquelle les autres politiques se lisent ;
#   * `p8_..._f0_nominal` et `p8_..._f9_crise_systemique` rendent aujourd'hui une allocation
#     physique IDENTIQUE (memes surfaces, meme azote, meme IFT, meme eau, meme PAD 73,55) :
#     seule l'economie differe. Ce n'est donc pas un couple de resultats independants, et
#     toute lecture de la robustesse de P8 sous crise est aujourd'hui sans objet.
#
# CE QU'IL LANCE -- 4 solves, tous amorces.
#   P4 x F0    P6 x F0    P8 x F0    P8 x F9
# (`p4_statu_quo` non force n'est pas repris : il a converge, en 2 644 s.)
#
# LES DOUBLONS SONT LE VRAI SUJET DE CE FICHIER. `create_output_folder` SUFFIXE au lieu
# d'ecraser : ces quatre runs produiront `p4_statu_quo_f0_nominal_2` etc., aux MEMES
# coordonnees (politique, forcage) que les originaux. La grille Prospective du dashboard
# groupe sur ces coordonnees et affichera donc deux valeurs par case, sans savoir laquelle
# est la bonne.
#   -> AVANT de lancer, ecarter les quatre dossiers non convergs (les deplacer dans
#      `outputs/_non_converges/`, ne pas les supprimer : ils portent la preuve que la reprise
#      etait necessaire, et le memoire s'en sert). Apres quoi les nouveaux dossiers
#      reprendront les noms canoniques.
#   -> C'est une manipulation destructrice sur des resultats : a faire en connaissance de
#      cause, jamais dans le meme geste que le lancement.
#
# L'AMORCAGE EST CE QUI REND CE LOT UTILE. Sans graine, on relance exactement le solve qui a
# echoue.
#
#   /!\ CE PARAGRAPHE ETAIT FAUX JUSQU'AU 2026-08-11 ET LE RESTE CI-DESSOUS POUR MEMOIRE. Il
#   affirmait que « chaque cellule reprend l'allocation de sa propre politique » et concluait
#   que `outputs/p4_statu_quo` etait « disponible ». La lecture de `run_scenarios.py:304` dit
#   le contraire : `policy_seeds` est un dictionnaire REMPLI PENDANT LE BATCH, jamais une
#   lecture de `outputs/`. Un lot de reprise ne rejouant que des cellules FORCEES, aucune
#   politique n'y a de run nominal, et les quatre cellules seraient parties A FROID -- soit
#   exactement le solve qui a deja echoue. Voir docs/04-vigilance.md B.7.
#
# ORDRE : apres `plan_etape_BC.yaml`, PUIS apres `plan_etape_D_socles.yaml`.
#
# MISE A JOUR DU 2026-08-10, apres le reliquat de l'etape B. L'inventaire des `outputs/` donne
# maintenant 10 runs non convergés sur 38, et non plus cinq. Ce fichier n'en couvre que quatre.
# Les six autres se repartissent en deux paquets, traites ailleurs et pour de bonnes raisons :
#
#   * P8 nue et P5 nue -> `plan_etape_D_socles.yaml`, A LANCER AVANT CELUI-CI. P8 nue est la
#     graine des deux cellules P8 ci-dessous ; tant qu'elle stagne a 68 445 374, les reprendre
#     rend le meme nombre. La mesure est dans l'en-tete du fichier socles.
#   * les quatre points du front azote sous P8 -> a reprendre APRES, et seulement si P8 nue a
#     gagne. Trois d'entre eux (1 081 306, 1 216 469, 1 351 632) rendent aujourd'hui le MEME
#     objectif 66 552 098 pour le meme azote 1 066 127 : la chaine de warm start les a tous
#     epingles sur l'incumbent du plus serre, et aucun n'a su s'en detacher en une heure. Le
#     point a 1 351 632 est cense etre le CONTROLE du front -- son plafond depasse de 9 kg
#     l'azote que P8 nue consomme deja (1 351 623), la contrainte n'y mord donc pas et il
#     devrait redonner P8 nue. Il rend 2,77 % de moins. Le controle est en echec, et c'est
#     exactement le diagnostic que CLAUDE.md annonce : un point domine signale un solve non
#     converge, pas une decouverte.
#
# LE TEMPS EST LE LEVIER COMMUN. Les dix runs sortent entre 3 617 et 3 701 s, tous sur
# `solver.args.time_limit: 3600`. Un plan-cellule n'accepte que `forcings:` et `sweeps:`
# (core/config.py:565), donc ce reglage se fait dans `config.yaml` avant le batch -- et le
# fichier socles est la pour tester le pari sur deux runs avant d'y engager celui-ci.
#
#   .venv/Scripts/python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan_etape_D.yaml --dry-run
#   .venv/Scripts/python scripts/audit_warm_start_seed.py --scenarios case_studies/guadeloupe/plan_etape_D.yaml \
#       --run P6_verdissement --seed outputs/p4_statu_quo
#   .venv/Scripts/python scripts/run_scenarios.py --scenarios case_studies/guadeloupe/plan_etape_D.yaml
#
# =============================================================================================
# MISE A JOUR DU 2026-08-11 -- LE LOT SE LANCE EN TROIS COMMANDES, PAS UNE. LIRE AVANT.
#
# ETAT DES SOCLES. `p8_transition_agroecologique` vaut desormais 69 088 438, OPTIMAL, et
# `p4_statu_quo` 81 036 580, OPTIMAL. `p6_verdissement_incitatif` n'existe toujours pas.
#
# LE CHAINAGE NE VA PAS CHERCHER CES RUNS. Voir l'avertissement plus haut : `policy_seeds` est
# interne au batch. Comme aucune des trois politiques ci-dessous n'a de cellule NON FORCEE dans
# ce fichier, la chaine ne leur proposera rien et il faut nommer la graine a la main. Or
# `--warm-start-from` est GLOBAL au batch : une seule graine pour les quatre cellules, alors
# que P4 et P8 en veulent chacune une differente. D'ou le decoupage par politique.
#
#   1) P8 -- les deux cellules, la graine etant l'optimum prouve de la politique nue. F0 passe
#      EN PREMIER pour que son allocation devienne (via `policy_seeds`, cette fois interne au
#      batch et donc effective) la graine de F9. L'ordre du bloc `scenarios:` le garantit.
#
#      .venv/Scripts/python scripts/run_scenarios.py \
#          --scenarios case_studies/guadeloupe/plan_etape_D.yaml \
#          --policies P8_transition_agroecologique \
#          --warm-start-from outputs/p8_transition_agroecologique
#
#   2) P6 -- aucune version nue n'existe. `outputs/p4_statu_quo` est le candidat le plus proche
#      (inertie 50 % contre 70 %, memes ordres de grandeur) ; l'audit peut la rejeter, il le
#      dira, et le run repartira a froid sans faire semblant.
#
#      .venv/Scripts/python scripts/run_scenarios.py \
#          --scenarios case_studies/guadeloupe/plan_etape_D.yaml \
#          --policies P6_verdissement_incitatif \
#          --warm-start-from outputs/p4_statu_quo
#
#   3) P4 -- l'ancrage. Graine : son propre optimum.
#
#      .venv/Scripts/python scripts/run_scenarios.py \
#          --scenarios case_studies/guadeloupe/plan_etape_D.yaml \
#          --policies P4_statu_quo \
#          --warm-start-from outputs/p4_statu_quo
#
# CET ORDRE EST CELUI DE L'INFORMATION ACQUISE, decroissante -- il vaut si la nuit est trop
# courte. `F0_nominal` ne porte AUCUN override (`scenarios_forcages.yaml:28-29`), donc une
# cellule x F0 est le MEME PROBLEME que sa politique nue et son optimum est deja connu :
#
#   P8 x F9   -1 506 116  inconnu, et seul resultat qui rende la robustesse de P8 lisible
#   P6 x F0   57 191 548  inconnu (aucune P6 nue n'a jamais tourne)
#   P4 x F0   80 468 932  optimum CONNU = 81 036 580, mais c'est l'ancrage de tous les regrets
#   P8 x F0   68 445 374  optimum CONNU = 69 088 438, la cellule la moins informative du lot
#
# Les deux dernieres se relancent pour que la grille porte des cellules resolues plutot que des
# valeurs recopiees a la main -- pas pour apprendre quelque chose.
#
# ET `time_limit` RESTE A 10800 : le socle P8 a converge a 8 981 s en partant deja de son
# optimum (voir 04-vigilance.md B.8 -- prouver coute plus cher que trouver).
#
# MENAGE PREALABLE, independant du reste : `outputs/p4_statu_quo_2` est un doublon exact
# (81 036 580, optimal, 353 s) aux memes coordonnees que `p4_statu_quo`. La grille Prospective
# groupant sur (politique, forcage), elle y verra deux valeurs. A ecarter aussi.
#
# Ce fichier est jetable. Une fois le batch passe, `plan.yaml` seul fait foi.

include:
  crop_groups: crop_groups.yaml
  policies:    scenarios_politiques.yaml
  forcings:    scenarios_forcages.yaml

scenarios:

  # L'ancrage de la grille. Sans lui converge, toutes les comparaisons portent sur un point
  # de reference dont on sait qu'il est faux.
  P4_statu_quo: [F0_nominal]

  # Payer (P6) et interdire (P7) ne se lisent qu'ensemble et sous les memes forcages. P7 a
  # converge sur les deux, P6 seulement sous F6 : la paire est aujourd'hui boiteuse sous F0.
  P6_verdissement_incitatif: [F0_nominal]

  # Les deux cellules de P8, qui rendent la meme allocation physique.
  P8_transition_agroecologique: [F0_nominal, F9_crise_systemique]
