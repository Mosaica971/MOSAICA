# --- Le score composite ------------------------------------------------------

- id: IND-40
  titre: >
    ⚠ UN INDICATEUR QU'UNE CONTRAINTE FIXE N'EST PAS UN RÉSULTAT — noter une
    politique sur le plafond qu'elle s'est donné est circulaire
  type: piege
  statut: retenu
  severite: critique
  source: [docs/04-vigilance.md#A.1, apps/dashboard/comparison.py]
  chiffre: []
  destination: [ch4, ch5, oral, article]
  arcs:
    parce-que: [IND-03]
    justifie: [IND-41]
  critique: >
    P1 gagne l'axe « dépense publique » en la mettant à zéro. `bound_indicators`
    les détecte depuis `recap["constraints"]`, donc RÉTROACTIVEMENT sur les runs
    déjà écrits — propriété précieuse : le garde-fou s'applique au passé.
    Décision assumée : le score les inclut quand même SI ON LE DEMANDE, parce que
    les exclure d'office empêcherait de voir l'effet d'un plafond sur les AUTRES
    indicateurs. Nuance rare et bien vue.

- id: IND-41
  titre: >
    PONDÉRER PAR FAMILLE — sans quoi les onze ratios d'autonomie alimentaire,
    quasi colinéaires, pèsent ONZE FOIS les GES
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-07-31
  source: [docs/04-vigilance.md#A.4, apps/dashboard/comparison.py]
  chiffre: []
  destination: [ch4, ch5, oral, article]
  arcs:
    parce-que: [IND-40]
  verdict-anterieur: >
    « Un score composite normalisé indicateur par indicateur traite tous les
    critères équitablement. » Il traite équitablement les COLONNES, pas les
    enjeux : les onze ratios d'autonomie alimentaire, quasi colinéaires, pèsent
    onze fois les GES. Le score classait les politiques sur la finesse d'une
    nomenclature.
  critique: >
    Défaut de méthode générique à tout tableau de bord multicritère, découvert
    ici parce que le découpage de l'autonomie alimentaire est fin. Un décideur
    lisant le score non corrigé aurait classé les politiques sur un artefact de
    nomenclature. Publiable comme mise en garde.

- id: IND-42
  titre: >
    Exposer un indicateur au score demande DEUX ajouts — le sens et
    l'appartenance ; le premier seul ne branche rien
  type: piege
  statut: retenu
  severite: mineur
  source: [CLAUDE.md, apps/dashboard/comparison.py, "apps/dashboard/pages/2_Comparaison.py"]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [IND-41]
  critique: >
    `INDICATOR_DIRECTION` pour le sens, `_INDICATOR_LABELS` pour le groupe. Dette
    de conception : deux registres à tenir synchrones à la main, exactement le
    genre d'écart qui produit un indicateur silencieusement absent d'un score.
    Un test de synchronisation manque ici, alors qu'il existe ailleurs (VER-61).

- id: IND-43
  titre: >
    L'eau est EXCLUE du score composite parce que sa donnée mensuelle est
    dégénérée
  type: choix
  statut: retenu
  severite: null
  source: [docs/04-vigilance.md#C.4]
  chiffre: []
  destination: [annexeD, note]
  arcs:
    parce-que: [DON-21, IND-41]
  critique: >
    Exclusion motivée par la STRUCTURE de la donnée et non par un jugement de
    pertinence. C'est le bon critère, et il faut le dire — sinon une exclusion
