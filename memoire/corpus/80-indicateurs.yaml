# =============================================================================
# 80 — INDICATEURS D'IMPACT                                        préfixe : IND
#
# Ce que le modèle sait dire au-delà de la marge : azote, IFT, GES, eau,
# carbone, pesticides, emploi, autonomie alimentaire, exposition au risque.
#
# Deux questions traversent le domaine et méritent d'être posées au lecteur :
# (1) un indicateur calculé APRÈS le solve décrit une allocation, il ne
#     l'influence pas — jusqu'au jour où on le borne, et il change de nature ;
# (2) agréger des indicateurs en un score suppose des poids, donc une valeur.
# =============================================================================

# --- Le régime général -------------------------------------------------------

- id: IND-01
  titre: >
    Tous les indicateurs sont des TAUX PAR HECTARE appliqués à l'allocation
    après le solve
  type: choix
  statut: retenu
  severite: null
  source: [case_studies/guadeloupe/reporting/indicators.py, case_studies/guadeloupe/domain/]
  chiffre: []
  destination: [ch2, annexeA]
  arcs:
    parce-que: [SOLV-01]
    justifie: [IND-02, ARCH-20]
  critique: >
    Structure simple qui a une conséquence forte : le même taux sert au
    reporting ET, depuis `territory_indicator_bound`, à contraindre. Un
    indicateur descriptif devient normatif sans changer de code — c'est ce qui
    a rendu la campagne prospective possible sans réécrire le modèle.

- id: IND-02
  titre: >
    EXCEPTION — le carbone organique dépend de la PARCELLE (via `TYPE_SOL`), pas
    seulement de la culture
  type: donnee
  statut: retenu
  severite: mineur
  source: [case_studies/guadeloupe/domain/soil_carbon.py, CLAUDE.md]
  chiffre: []
  destination: [annexeA, note]
  arcs:
    parce-que: [IND-01]
  critique: >
    Il ne passe donc pas par l'helper générique `rate()`. Petite entorse
    structurelle, documentée. Le Rpest est la seconde exception, et plus
    profonde (IND-30) : il dépend du COUPLE parcelle × culture.

- id: IND-03
  titre: >
    Le bloc `intensity` — azote et IFT PAR TONNE, marge et emploi par hectare,
    efficience de la dépense publique
  type: methode
  statut: retenu
  severite: critique
  quand: 2026-07-31
  source: [case_studies/guadeloupe/reporting/indicators.py, docs/04-vigilance.md#A.2]
  chiffre: []
  destination: [ch4, annexeD]
  arcs:
    parce-que: [IND-01, PROS-43]
    justifie: [IND-40]
  critique: >
    Réponse directe au piège « comparer des totaux confond échelle et
    intensité » : une politique qui cultive moins d'hectares affiche moins
    d'azote total sans produire plus proprement. Sans ce bloc, toute la grille
    prospective serait ininterprétable. L'efficience de la dépense publique
    (subvention par tonne / par ETP / par € de marge) est la partie la plus
    directement utile à un décideur.

