  verdict-anterieur: >
    « Documenter un piège suffit à s'en prémunir. » Le piège des deux registres a
    été commis DANS la spec qui le documente, par son auteur, et corrigé en
    post-revue dans le même fichier. Documenter n'est pas garder : seul un test
    de synchronisation l'aurait empêché, et il n'existe toujours pas.
  critique: >
    « Ajouter une clé à `INDICATOR_DIRECTION` sans l'ajouter aussi à
    `_ENV_INDICATORS` la laisse invisible du picker — **c'est ce qui s'est
    produit ici avant correction**. » L'aveu est dans la spec elle-même, en
    correction post-revue. Le piège n'est donc pas théorique : il a été commis
    par celui qui l'a ensuite documenté, dans le même document. Et il n'a
    toujours pas de test de synchronisation, contrairement à d'autres couples de
    fichiers (VER-61) — la dette est identifiée, nommée, et non payée.

- id: IND-72
  titre: >
    Un troisième bug d'eau porté fidèlement — le `max(0, ·)` manquant
  type: erreur
  statut: retenu
  severite: mineur
  quand: 2026-07-20
  source: ["docs/superpowers/specs/2026-07-20-water-soil-carbon-indicators-design.md:154-157"]
  chiffre: []
  destination: [annexeB, note]
  arcs:
    parce-que: [PORT-01, DON-20]
  critique: >
    Le `$` du GAMS ne conditionne que le terme de pluie, pas la soustraction :
    quand le besoin est inférieur à la pluie, l'expression vaut `BESOIN − 0 =
    BESOIN` au lieu de `0`. L'intention était clairement `max(0, ·)`. Porté tel
    quel. ⚠ Sans effet PRATIQUE ici, puisque la pluie n'est jamais déduite
    (DON-20, les colonnes mensuelles sont absentes) : c'est un bug dormant à
    l'intérieur d'un autre bug. Si la série pluviométrique arrivait un jour, il
    se réveillerait — à signaler dans la même entrée que le déblocage.

