- id: IND-74
  titre: >
    `NC` a bien `Prix = 0` et `Rdt = 0` — sa contribution au choc de prix est
    EXACTEMENT nulle, mais pas sa contribution au risque climatique
  type: piege
  statut: ouvert
  severite: mineur
  quand: 2026-07-20
  source: ["docs/superpowers/specs/2026-07-20-resilience-stability-score-design.md:202-210"]
  chiffre: []
  destination: [annexeD, note]
  arcs:
    parce-que: [IND-38]
  critique: >
    Analyse fine et honnête : la vérification a établi que deux des trois canaux
    sont neutres, et isolé le troisième. La marge de `NC` vaut
    `subventions − coûts variables`, donc n'est pas mécaniquement nulle, et elle
    pèse à taux plein (`Var_Rdt = 1,0`) dans la marge à risque. ⚠ La spec dit
    « À MESURER AU CÂBLAGE : si la contribution est significative, il faudra
    décider de l'exclure explicitement » — cette mesure ne semble avoir été faite
    nulle part. Action ouverte, bon marché. Argument supplémentaire : le GAMS
    maintient un set dédié `CULT_NON_NC_2017` (« toutes les cultures sauf NC »),
    signe que `NC` y était DÉJÀ traitée à part.

- id: IND-75
  titre: >
    Le choc de prix ne touche NI la bagasse NI les subventions
  type: choix
  statut: retenu
  severite: majeur
  source: ["docs/superpowers/specs/2026-07-20-resilience-stability-score-design.md:212"]
  chiffre: []
  destination: [ch4, annexeD]
  arcs:
    parce-que: [IND-36]
  critique: >
    Hypothèse de modélisation lourde et facile à manquer : un choc de prix
    n'atteint que le produit de marché. Or la subvention vaut environ les trois
    quarts de la marge brute du territoire (CTX-03). L'indicateur d'exposition
    mesure donc la sensibilité du quart restant, et sous-estime structurellement
    la volatilité perçue par un exploitant si les aides devaient bouger. À dire
    quand on cite un chiffre de perte sous choc.
