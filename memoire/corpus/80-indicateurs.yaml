- id: IND-70
  titre: >
    UN INDICATEUR SUPPRIMÉ PARCE QU'IL SERAIT MAL LU, pas parce qu'il est faux
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-07-20
  source: ["docs/superpowers/specs/2026-07-20-water-soil-carbon-indicators-design.md:120-131"]
  chiffre: []
  destination: [ch2, ch5, oral, article]
  arcs:
    parce-que: [DON-21]
    justifie: [IND-43]
  critique: >
    ⚠ L'UNE DES PLUS BELLES DÉCISIONS DU DÉPÔT, et elle est enfouie dans une spec.
    Le « mois de pointe » devait dimensionner la ressource et l'infrastructure —
    raisonnement juste, et rendu CADUC par la donnée : les douze colonnes
    `BESOIN_EAU_01..12` étant identiques pour les 84 cultures, le mois de pointe
    vaut toujours exactement le total divisé par douze. Trois décisions en
    découlent, graduées : (1) l'indicateur RESTE dans le recap, « utile si un jour
    une vraie saisonnalité arrive » ; (2) il est RETIRÉ du score composite, où il
    doublerait le poids de l'eau par colinéarité ; (3) le CSV mensuel prévu pour
    le tableau de bord est **supprimé**, et la raison est explicite —
    « 12 lignes identiques s'y liraient comme une vraie courbe saisonnière ».
    Supprimer une sortie exacte parce qu'elle serait MAL LUE est le degré le plus
    abouti de MET-40, et il coûte quelque chose : on retire une information
    plutôt que d'y accoler un avertissement.

