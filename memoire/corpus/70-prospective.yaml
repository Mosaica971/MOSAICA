# --- Ce que la grille montre -------------------------------------------------

- id: PROS-20
  titre: >
    Sous crise systémique, la marge brute du territoire devient NÉGATIVE pour
    les trois politiques testées
  type: resultat
  statut: retenu
  severite: null
