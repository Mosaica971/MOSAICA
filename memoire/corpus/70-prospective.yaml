    mesure-par: [VER-42]
  critique: >
    ⚠ ITEM DE MÉTHODE DE PREMIER ORDRE, et il est nommé comme tel dans le journal.
    La corrélation est réelle dans les taux — maraîchage 1 128-1 653 h/ha à IFT
    10-15, canne 12,7 h/ha à IFT 2,5, prairie 126 h/ha à IFT 0 — et l'explication
    « le plafond d'IFT borne l'emploi » est donc SÉDUISANTE, COHÉRENTE et FAUSSE.
    La bissection la démolit : retirer l'IFT laisse l'infaisabilité, retirer
    l'azote aussi, retirer les GES aussi. C'est la combinaison, plus la forme PAR
    FERME du plafond de main d'œuvre. Cas d'école d'une explication plausible
    appuyée sur une corrélation visible dans les données et démentie par une
    expérience — le motif MET-01 appliqué à une intuition qui n'avait rien
    d'absurde.

