# =============================================================================
# 70 — PROSPECTIVE : POLITIQUES, FORÇAGES, FRONTS                 préfixe : PROS
#
# Le dispositif expérimental, ce qu'il mesure, ses conventions assumées, et
# — la partie la plus longue — ce qu'il ne permet pas de conclure.
#
# C'est le domaine où le stage a le plus de latitude et donc le plus de choix à
# justifier : chaque seuil du catalogue est une décision politique prise dans un
# fichier YAML par une personne seule.
# =============================================================================

# --- La séparation en trois objets -------------------------------------------

- id: PROS-01
  titre: >
    Séparer POLITIQUE (ce qu'une puissance publique décide), FORÇAGE (ce que le
    climat et les marchés imposent) et BALAYAGE (un seuil qui varie)
  type: choix
  statut: retenu
  severite: null
  quand: 2026-07-31
  source: ["docs/superpowers/specs/2026-07-31-scenarios-prospectifs-design.md", memoire/chapitres/04-explorer.tex]
  chiffre: [mesPolitiques, mesForcages, mesBalayages]
  destination: [ch4, annexeC, oral]
  arcs:
    parce-que: [CTX-20]
    justifie: [PROS-02, PROS-03, PROS-10]
  critique: >
    Justification donnée : « ils n'ont pas le même auteur ». C'est le bon
    critère — il est ontologique, pas informatique. Un forçage n'est pas une
    politique dont on aurait retiré le décideur.

- id: PROS-02
  titre: >
    La séparation décide de ce que COÛTE une campagne : le produit cartésien
    complet vaudrait 120 cellules, soit cinq jours de calcul continu
  type: resultat
  statut: retenu
  severite: null
  source: [memoire/chapitres/04-explorer.tex]
  chiffre: [mesCellulesTotal]
  destination: [ch4, oral]
  arcs:
    parce-que: [PROS-01, SOLV-10]
    justifie: [PROS-03]

- id: PROS-03
  titre: >
    `plan.yaml` déclare politique par politique quels forçages la traversent —
    au lieu du produit complet moins ce qu'on pense à exclure
  type: choix
  statut: retenu
  severite: null
  quand: 2026-08-01
  source: [case_studies/guadeloupe/plan.yaml, CLAUDE.md]
  chiffre: []
  destination: [ch4, annexeC]
  arcs:
    parce-que: [PROS-02]
    justifie: [PROS-04]
  critique: >
    Inversion de la valeur par défaut : déclarer ce qu'on veut plutôt
    qu'exclure ce qu'on ne veut pas. Un batch devient alors une intention lisible
    et pas un résidu. Le découpage a été vérifié à l'IDENTITÉ EXACTE (les 10
    politiques et 12 forçages résolvent au même dictionnaire qu'avant) — c'est
    ce qui rend le refactor sûr, et c'est la bonne façon de valider une
    réorganisation de configuration.

- id: PROS-04
  titre: >
    Un front n'est JAMAIS croisé avec la liste de forçages de sa cellule — un
    front forcé se demande et se paie explicitement
  type: choix
  statut: retenu
  severite: majeur
  source: [CLAUDE.md, memoire/chapitres/04-explorer.tex]
  chiffre: []
  destination: [ch4, annexeC]
  arcs:
    parce-que: [PROS-03]
  critique: >
    « Un front est déjà un solve par point, et le multiplier par quatre forçages
    transforme une après-midi en semaine. » Décision d'économie de calcul qui
    devient une décision de méthode : ce qui est cher doit être demandé, jamais
    obtenu par inadvertance d'une valeur par défaut.

- id: PROS-05
  titre: >
    Les groupes de cultures sont un CATALOGUE, pas une copie : `{group: canne}`
    est substitué à la lecture, les ancres YAML ne traversant pas les fichiers
  type: choix
  statut: retenu
  severite: null
  source: [core/config.py, case_studies/guadeloupe/crop_groups.yaml]
  chiffre: []
  destination: [annexeC, note]
  arcs:
    parce-que: [PROS-03]
  critique: >
    Deux pièges consignés : la correspondance est le dictionnaire à UNE clé
    exacte (parce que `territory_production_bound` a déjà un argument nommé
    `groups`), et chaque catalogue déclare son propre include pour rester
    lançable seul. Détails, mais ce sont exactement les détails qui font qu'un
    fichier de configuration reste utilisable par quelqu'un d'autre.

# --- Les méthodes numériques -------------------------------------------------

- id: PROS-10
  titre: >
    L'ε-contrainte plutôt qu'une somme pondérée : on garde l'objectif inchangé
    et on plafonne le second critère
  type: notion
  statut: retenu
  severite: null
  source: [memoire/chapitres/04-explorer.tex, case_studies/guadeloupe/scenarios_pareto.yaml]
  chiffre: []
  destination: [ch4, annexeA, oral]
  arcs:
    parce-que: [PROS-01]
    justifie: [PROS-11, SOLV-33]
    ferme-la-branche: [PROS-B1]
  critique: >
    Deux justifications, et la seconde est politique : les poids n'ont pas à être
    choisis — « et ils encoderaient une valeur politique déguisée en paramètre
    technique ». C'est un des meilleurs arguments du mémoire, parce qu'il montre
    qu'un choix de méthode numérique EST un choix de posture.

- id: PROS-B1
  titre: "BRANCHE COUPÉE — agréger marge et azote dans une somme pondérée"
  type: choix
  statut: ecarte
  severite: null
  source: [memoire/chapitres/04-explorer.tex]
  chiffre: []
  destination: [ch4, oral]
  arcs:
    mesure-par: []
  sans-mesure: >
    Coupée sur un THÉORÈME, et aucun banc d'essai ne l'établirait mieux : une somme
    pondérée ne peut atteindre que les points du front situés sur son enveloppe
    convexe, quels que soient les poids. Toute partie non convexe du compromis
    marge / azote lui est structurellement invisible. S'y ajoute un argument de
    posture, lui non démontrable : les poids encodent une valeur politique
    déguisée en paramètre technique, et personne dans ce stage n'a mandat pour
    fixer combien vaut un kilo d'azote en euros de marge.
  critique: >
    Un des meilleurs arguments du mémoire, parce qu'il montre qu'un choix de
    méthode numérique EST un choix de posture — et parce que les deux
    justifications sont de natures différentes, l'une opposable, l'autre assumée.

- id: PROS-B3
  titre: >
    BRANCHE COUPÉE — écrire la politique agroécologique comme une PART MINIMALE
    de cultures bio, ce qui était la formulation naturelle
  type: choix
  statut: ecarte
  severite: majeur
  quand: 2026-07-31
  source: ["docs/04-vigilance.md#B.3", case_studies/guadeloupe/scenarios_politiques.yaml]
  chiffre: []
  destination: [ch4, ch5, oral, article]
  arcs:
    parce-que: [SOLV-40, SOLV-42]
    mesure-par: [VER-30]
    justifie: [PROS-26]
  critique: >
    C'EST LA BRANCHE LA PLUS INSTRUCTIVE DU CORPUS, parce qu'elle a été coupée par
    une propriété des DONNÉES et non par un arbitrage de modélisation. Une part
    minimale de bio bâtie sur les 25 variantes maraîchères est satisfaite à coût
    EXACTEMENT nul : le modèle ne distingue pas ces variantes, il lui suffit de
    renommer. La contrainte serait passée, le rapport aurait affiché la part
    demandée, et rien n'aurait changé sur le terrain. Une politique publique
    simulée avec succès, et sans aucun effet — l'artefact parfait.
    Le détecteur de groupes symétriques de `check_scenario_feasibility.py`
    (VER-30) est ce qui a rendu le défaut visible AVANT qu'un batch ne tourne ;
    sans lui la branche aurait été prise, et le résultat publié.
    P8 a donc été reformulé sur des leviers que les données distinguent
    réellement (azote, IFT, inertie), ce qui est plus faible politiquement et
    seul défendable.

- id: PROS-11
  titre: >
    Le front donne le coût marginal sur TOUT l'intervalle, là où le prix dual
    n'en donne que la pente locale
  type: notion
  statut: retenu
  severite: majeur
  source: [core/solve/shadow_prices.py, memoire/chapitres/04-explorer.tex]
  chiffre: []
  destination: [ch4, oral, article]
  arcs:
    parce-que: [PROS-10]
    justifie: [PROS-22]
  critique: >
    Et l'écart entre les deux est mesuré, pas supposé : au point le plus serré du
    front budgétaire, le dual vaut presque le DOUBLE de la pente moyenne.
    Extrapoler le dual surestimerait l'effet d'environ trois quarts. C'est un
    résultat de méthode citable hors du contexte guadeloupéen.

- id: PROS-12
  titre: >
    Le contrôle avant vol en relaxation LP : ~2 min contre 30-55 min, filtre et
