- id: PROS-64
  titre: >
    ⚠ PIÈGE JUMEAU DE L'EAU, SUR LE CARBONE — le taux exposé au modèle n'est pas
    ce que le rapport mesure
  type: piege
  statut: ouvert
  severite: majeur
  quand: 2026-07-31
  source: ["docs/archives/journal-vigilance.md:161-167"]
  chiffre: []
  destination: [ch4, note, annexeA]
  arcs:
    parce-que: [ARCH-21, IND-02]
  critique: >
    ⚠ PIÈGE NON REPRIS DANS `04-vigilance.md` ET SANS CORRECTIF. Le taux de
    carbone exposé aux contraintes est l'ENTRÉE de carbone de la culture ; le
    bilan rapporté dans le recap dépend AUSSI du type de sol de la parcelle
    (`Data_Sol`), qu'un taux par culture ne peut pas porter. Un plafond ou un
    plancher de carbone ne contraint donc PAS la grandeur que le rapport affiche.
    L'eau a reçu son correctif (`plot_weight: irrigable`, facteur 1,6) ; le
    carbone n'en a pas d'équivalent, la dépendance au sol n'étant pas un simple
    poids par parcelle mais une fonction du COUPLE. Un scénario carbone écrit
    aujourd'hui serait faux d'une façon qui ne se voit nulle part. À vérifier et
    à signaler avant tout usage.

