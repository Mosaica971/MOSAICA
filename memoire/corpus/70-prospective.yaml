    D'où `plan_etape_A.yaml`, `_A_budget`, `_BC`, `_D`. Et une limite d'outil
    consignée au passage : `--forcings` ne sait pas exclure seulement les
    cellules forcées, il écarterait aussi le balayage non forcé. Détail
    d'ergonomie qui a un coût réel — il oblige à écrire un fichier plutôt qu'à
    passer un drapeau.

