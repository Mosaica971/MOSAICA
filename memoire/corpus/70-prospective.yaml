    C'est le pire cas au sens de Wald, et il est atteint par TOUTES. Résultat
    fort, mais à qualifier : F9 cumule quatre dégradations simultanées, et rien
    ne dit qu'elles soient conjointement plausibles. Le mémoire ne pose pas cette
    question ; il devrait, ne serait-ce qu'en une phrase.

- id: PROS-21
  titre: >
    LE CLASSEMENT DES POLITIQUES DÉPEND DU FORÇAGE — P9 est la meilleure sous F0
    et la pire sous F9 hors aide
  type: resultat
  statut: retenu
  severite: null
  source: [memoire/chapitres/04-explorer.tex#sec:grille]
  chiffre: []
  destination: [ch4, ch6, oral, article]
  arcs:
    parce-que: [PROS-01]
  critique: >
    C'est le résultat qui JUSTIFIE la grille : une politique n'est pas « bonne »
    dans l'absolu, et un scénario unique masque exactement cela. L'argument
    méthodologique et le résultat empirique coïncident, ce qui est rare et
    précieux.

- id: PROS-22
  titre: >
    LECTURE QUI NE TIENT PAS — classer sur la marge brute des politiques qui
    déplacent les aides, c'est constater qu'elles subventionnent davantage
  type: piege
  statut: retenu
  severite: critique
  source: [memoire/chapitres/04-explorer.tex#sec:grille]
  chiffre: []
  destination: [ch4, oral, article]
  arcs:
    parce-que: [CTX-03]
    justifie: [PROS-23]
  critique: >
    La réponse retenue — exposer les DEUX colonnes (brute et hors aide) plutôt
    que d'en choisir une en silence — est la bonne posture et mérite d'être
    nommée comme telle : le dispositif ne tranche pas à la place du lecteur, il
    rend le désaccord visible. Sous F9 l'ordre s'inverse entre les deux lectures,
    donc le choix n'est pas cosmétique.

- id: PROS-23
  titre: >
    Le regret de Savage se mesure contre la meilleure politique DU MÊME FORÇAGE,
    jamais contre un optimum global
  type: choix
  statut: retenu
  severite: majeur
  source: [core/reporting/robustness.py, memoire/chapitres/04-explorer.tex]
  chiffre: []
  destination: [ch4, annexeD]
  arcs:
    parce-que: [PROS-21]
    justifie: [PROS-24, PROS-25]
  critique: >
    « Qu'aurais-je perdu à avoir choisi celle-ci, sachant que ce contexte-là est
    survenu » — la question n'a de sens qu'à contexte fixé. Convention correcte
    et explicitement assumée.

- id: PROS-24
  titre: >
    Convention — l'INFAISABILITÉ compte comme le PIRE résultat, pas comme une
    donnée manquante
  type: choix
  statut: retenu
  severite: majeur
  source: [core/reporting/robustness.py, docs/04-vigilance.md#A.3]
  chiffre: []
  destination: [ch4, annexeD]
  arcs:
    parce-que: [PROS-23]
  critique: >
    « Une politique qui ne laisse aucune solution est un échec, pas une absence
    de mesure. » Sans cette convention, le pire cas des survivants ferait passer
    une politique fragile pour robuste. Choix qui change les classements.

- id: PROS-25
  titre: >
    Convention — les forçages ne sont PAS moyennés : une moyenne affirmerait une
    distribution de probabilité que personne n'a choisie
  type: choix
  statut: retenu
  severite: critique
  source: [core/reporting/robustness.py]
  chiffre: []
  destination: [ch4, ch5, annexeD, oral, article]
  arcs:
    parce-que: [PROS-23]
  critique: >
    Le meilleur item d'épistémologie appliquée du dépôt. Refuser une moyenne
    parce qu'elle porterait une affirmation probabiliste non assumée est une
    décision qu'un mémoire d'ingénieur prend rarement, et elle se défend en une
    phrase. À faire remonter au Ch. 5 (« l'honnêteté épistémique comme livrable »).

- id: PROS-26
  titre: >
    Cinq mesures de robustesse fournies — pire cas (Wald), rétention, CV, regret
    maximal (Savage), domaine de viabilité (Starr)
  type: methode
  statut: retenu
  severite: null
  source: [core/reporting/robustness.py]
