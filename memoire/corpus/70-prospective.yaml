- id: PROS-80
  titre: >
    LES PLANCHERS D'EMPLOI SONT DES POURCENTAGES D'UN MAXIMUM MESURÉ, pas des
    chiffres choisis
  type: methode
  statut: retenu
  severite: critique
  quand: 2026-07-31
  source: ["docs/superpowers/specs/2026-07-31-scenarios-prospectifs-design.md:194-199"]
  chiffre: []
  destination: [ch4, ch5, annexeC, oral]
  arcs:
    parce-que: [PROS-62, VER-40]
    contredit: [PROS-50]
  critique: >
    ⚠ CORRIGE ET NUANCE PROS-50. Tous les seuils du catalogue ne sont pas des
    fractions arbitraires d'`output_3` : les planchers d'emploi sont des
    pourcentages du maximum ATTEIGNABLE mesuré en relaxation LP sous les autres
    contraintes de chaque politique — P8 : 4 875 ETP max, plancher à 4 200
    (86 %) ; P9 : 5 734, plancher 4 200 (73 %) ; P10 : 4 975, plancher 4 400
    (88 %) ; contre 3 503 ETP réalisés. Le catalogue mélange donc DEUX régimes de
    seuils, l'un mesuré et l'autre choisi, et le mémoire doit dire lequel est
    lequel plutôt que de les présenter uniformément.

- id: PROS-81
  titre: >
    RÉSULTAT POLITIQUE — dans ce modèle, une politique environnementale ambitieuse
    PLAFONNE l'emploi agricole qu'elle peut soutenir
  type: resultat
  statut: retenu
  severite: critique
  quand: 2026-07-31
  source: ["docs/superpowers/specs/2026-07-31-scenarios-prospectifs-design.md:205-207"]
  chiffre: []
  destination: [ch4, ch5, ch6, oral, article]
  arcs:
    parce-que: [PROS-61, PROS-62]
  critique: >
    ⚠ ÉNONCÉ POLITIQUE MAJEUR, ET IL EST ABSENT DU BROUILLON. Il contredit
    frontalement l'attendu ordinaire — l'agroécologie est censée être intensive
    en travail, donc créatrice d'emploi — et la spec ajoute la clause qui le rend
    solide : « et le plafond SE MESURE au lieu de se postuler » (P8 → 4 875 ETP,
    P10 → 4 975, contre 3 503 réalisés). Deux réserves indispensables : ce sont
    des bornes LP donc des majorants, et l'énoncé vaut « dans ce modèle », dont
    on sait qu'il ne monétise pas le travail (ARCH-66) et qu'il ne peut pas
    évaluer les itinéraires agroécologiques réels (DON-61). Avec ces réserves,
    c'est le résultat le plus intéressant du chapitre 4 après le front budgétaire.

- id: PROS-82
  titre: >
    Le seul garde-fou entre deux blocs YAML distants de trente lignes est un test
    sans données
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-07-31
  source: ["docs/superpowers/specs/2026-07-31-scenarios-prospectifs-design.md:183-186"]
  chiffre: []
  destination: [ch2, note]
  arcs:
    parce-que: [PROS-60]
    justifie: [VER-61]
  critique: >
    `test_prospective_labour_slack_covers_every_employment_floor` relit chaque
    politique, calcule le plafond effectif d'après son `slack` et refuse tout
    plancher d'emploi au-dessus. Formulation à retenir telle quelle : « c'est le
    SEUL garde-fou entre deux blocs YAML distants de trente lignes ». Une
    contrainte de cohérence interne à un fichier de configuration n'est portée
    par rien d'autre que par un test — ni le langage, ni le schéma, ni la
    relecture ne la voient.

- id: PROS-83
  titre: >
    La comparaison entre politiques se fait sur les colonnes PHYSIQUES, pas sur
    l'objectif
  type: choix
  statut: retenu
  severite: critique
  quand: 2026-07-31
  source: ["docs/superpowers/specs/2026-07-31-scenarios-prospectifs-design.md:165-169"]
  chiffre: []
  destination: [ch4, annexeC]
  arcs:
    parce-que: [PROS-53]
  critique: >
    Règle explicite : marge brute, ETP, azote, IFT, eau — « calculées à
    l'identique quel que soit l'objectif ». Parce que P1 maximise la marge brute
    PURE quand les neuf autres maximisent la marge ajustée du risque : ce sont
    deux fonctions différentes, et aligner leurs valeurs d'objectif dans une même
    colonne serait une erreur de catégorie. La règle est posée dans la spec avant
    d'avoir été violée — c'est de la conception, pas de la réparation.
