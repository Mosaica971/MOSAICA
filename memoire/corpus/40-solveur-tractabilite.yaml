  arcs:
    parce-que: [SOLV-10]
    justifie: [SOLV-30, SOLV-21, PROS-40]
    mesure-par: [VER-20]
  critique: >
    La démonstration est la partie qui compte : une solution faisable
    construite À LA MAIN en quelques secondes vaut 80,91 M€ contre 76,46 M€
    trouvés par HiGHS en une heure. Ce n'est pas une présomption. C'est le
    résultat le plus publiable du stage parce qu'il ne dépend d'aucune donnée
    guadeloupéenne.

