- id: SOLV-B5
  titre: >
    BRANCHE COUPÉE — l'interface persistante APPSI, testée puis REVERTÉE
  type: choix
  statut: ecarte
  severite: null
  quand: 2026-07-10
  source: ["docs/archives/journal-vigilance.md:1011-1013", "commit de00f98"]
  chiffre: []
  destination: [ch2, note, article]
  arcs:
    parce-que: [SOLV-06]
    mesure-par: [VER-12]
  critique: >
    ⚠ LE MEILLEUR EXEMPLE DU DÉPÔT D'UNE OPTIMISATION QUI NE PASSE PAS À
    L'ÉCHELLE. Gain mesuré : ~25 % sur l'île 1 (un sous-ensemble). À pleine
    échelle : 3 310 s, c'est-à-dire DANS LA FOURCHETTE HABITUELLE — donc
    indiscernable du bruit (SOLV-11, CV 91 %). Retour à `SolverFactory`.
    Leçon générale, et elle vaut pour tout le travail : sur un problème dont la
    durée a un CV de 91 %, une mesure d'accélération faite sur UN run à pleine
    échelle ne prouve rien, et une mesure faite sur un sous-ensemble ne se
    transporte pas. C'est la raison profonde pour laquelle le gain propre du
    chaînage d'amorçage n'a jamais été chiffré (PERSP-50) : il faudrait des
    répétitions que le budget de calcul n'autorise pas.

- id: SOLV-73
  titre: >
    Un run réduit peut mesurer un gain qui n'existe pas à pleine échelle
  type: methode
  statut: retenu
  severite: majeur
  source: [SOLV-B5, SOLV-11]
  chiffre: [mesSolveCV]
  destination: [ch2, ch5, oral, article]
  arcs:
    parce-que: [SOLV-B5]
  critique: >
    Corollaire méthodologique de SOLV-B5 et de SOLV-71 (`zone_filter`), qui se
    contredisent en apparence : le sous-ensemble est INDISPENSABLE pour
    développer (il ramène un essai de l'heure à la seconde) et TROMPEUR pour
    mesurer une performance. Distinguer les deux usages est un item de méthode à
    part entière, et le dépôt s'est fait prendre une fois.

