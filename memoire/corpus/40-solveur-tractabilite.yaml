- id: SOLV-37
  titre: Un warm start peut DÉGRADER une cellule forcée
  type: piege
  statut: retenu
  severite: majeur
  quand: 2026-08-12
  source: [docs/04-vigilance.md#B.9, commit 2117ddf]
  chiffre: []
  destination: [ch4, note, article]
  arcs:
    parce-que: [SOLV-30]
    contredit: [SOLV-B4]
    mesure-par: [VER-22]
  critique: >
    P8×F9 repris avec 3× plus de temps rend −1 678 357 contre −1 506 116 à
    froid. La garantie du warm start est « ≥ la valeur de sa graine », jamais
    « ≥ un run antérieur de la même cellule ». La graine était l'allocation de
    P8×F0, optimale sous F0 et médiocre sous F9. Découvert le 12/08 — c'est le
    dernier résultat du stage, et il oblige à ne jamais écraser un ancien run.

