- id: SOLV-10
  titre: >
    Le solve prend une demi-heure à une heure sur le territoire complet en
    configuration de calibration, deux à trois heures en prospective
  type: resultat
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#B.1, .mosaica_solve_history.json]
  chiffre: []
  destination: [ch2, oral]
  arcs:
    parce-que: [SOLV-01]
