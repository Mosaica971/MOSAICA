- id: SOLV-22
  titre: >
    ERREUR — deux leviers de calibration ont été diagnostiqués « bloqués par la
    modélisation » alors qu'ils l'étaient par le solveur
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-07-29
  source: [TODO.md, docs/archives/journal-vigilance.md]
  chiffre: []
  destination: [ch3, ch5, oral]
  arcs:
    parce-que: [SOLV-20]
    mesure-par: [VER-20]
  verdict-anterieur: >
    « Le plafond ananas et le plancher arboricole coûtent trop cher au modèle :
    ces contraintes sont bloquées par la MODÉLISATION. » Elles étaient bloquées
    par le SOLVEUR — les deux runs tapaient la limite d'une heure avec un
    incumbent incohérent, et deux semaines de diagnostic reposaient sur des
    résultats que rien ne disait faux à la lecture.
  critique: >
    Le plafond ananas et le plancher arboricole tapaient tous deux la limite
    d'une heure avec un incumbent incohérent. Conclusion tirée : « ces
    contraintes coûtent trop cher ». Conclusion vraie : « le solveur n'a pas
    convergé ». Deux semaines de diagnostic reposaient sur des runs faux.

