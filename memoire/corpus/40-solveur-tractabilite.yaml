# --- Choix du solveur et de la bibliothèque ---------------------------------

- id: SOLV-06
  titre: Pyomo + HiGHS (`appsi_highs`) plutôt que GAMS, Gurobi ou CPLEX
  type: choix
  statut: retenu
  severite: null
  source: [core/solve/solver.py, pyproject.toml]
  chiffre: []
  destination: [ch2, note]
  arcs:
    parce-que: [CTX-B1, ARCH-01]
    ferme-la-branche: [SOLV-B1, SOLV-B2]
  critique: null

- id: SOLV-B1
  titre: "BRANCHE COUPÉE — rester en GAMS et n'ajouter qu'une couche de scripts"
  type: choix
  statut: ecarte
  severite: null
  source: [memoire/chapitres/01-terrain-et-objet.tex#sec:gams, docs/README.md]
  chiffre: []
  destination: [ch1, oral]
  arcs:
    mesure-par: [PORT-10, PORT-20, PORT-22]
    justifie: [SOLV-06]
  critique: >
    Trois raisons cumulées : environnement propriétaire, faire varier un levier
    signifie éditer les équations, et les bugs silencieux ne se trouvent qu'en
    refaisant le modèle. Aucune des trois seule n'aurait suffi.
    La mesure est la TROISIÈME raison rendue vérifiable : `Eq_VE_PLUIE`
    interdisait les vergers pluviaux sur tout le territoire, les deux ordres de
    types de sol produisaient des coefficients faux et plausibles, et aucun des
    deux n'était détectable en exécutant le GAMS — seulement en le réécrivant.
    Une couche de scripts par-dessus aurait hérité des deux sans jamais les voir.

- id: SOLV-B2
  titre: "BRANCHE COUPÉE — un solveur commercial (Gurobi, CPLEX)"
  type: choix
  statut: ecarte
  severite: null
  source: [core/solve/solver.py]
  chiffre: []
  destination: [note]
  arcs:
    mesure-par: []
  sans-mesure: >
    Coupée sur une contrainte de destination, pas sur une performance : le modèle
    doit pouvoir être relancé par un successeur d'une unité INRAE sans démarche
    de licence, et c'est précisément le défaut qu'on reprochait au GAMS. Un
    solveur plus rapide sous licence reconduirait l'obstacle qu'on venait de
    lever. La mesure aurait renseigné le COÛT de ce choix, pas le choix lui-même.
  critique: >
    ⚠ ASSUMÉ, MAIS LA MESURE MANQUE VRAIMENT. Un test Gurobi sur une seule cellule
    aurait chiffré ce que la gratuité coûte en temps de preuve — et vu le poids du
    temps de solve dans ce stage (SOLV-10, SOLV-11), ce chiffre aurait eu de la
    valeur pour quiconque reprend le modèle. C'est un manque à assumer à l'oral,
    pas à masquer : la question « avez-vous essayé Gurobi ? » est certaine.

