  critique: >
    ⚠ NUANCE IMPORTANTE ET FACILE À MANQUER. Après les suppressions `Eq_*_SUPP`
    (309 000 variables), la configuration de CALIBRATION se résout en 140 à 175 s.
    Les 30-55 min concernent les scénarios PROSPECTIFS, plus contraints. Citer
    « le solve prend 30 à 55 min » sans préciser lequel mélange deux régimes
