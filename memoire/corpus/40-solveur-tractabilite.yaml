- id: SOLV-11
  titre: >
    À taille constante, les 7 solves de calibration enregistrés s'étalent de
    327 s à 3 625 s — facteur 11, CV 91 %
  type: resultat
  statut: retenu
  severite: majeur
  quand: 2026-08-30
  source: [docs/04-vigilance.md#B.1, .mosaica_solve_history.json, memoire/build_chiffres.py]
  chiffre: [mesSolveN, mesSolveMin, mesSolveMax, mesSolveMoy, mesSolveCV, mesSolveFacteur]
  destination: [ch2, oral, article]
  arcs:
    parce-que: [SOLV-10]
    justifie: [SOLV-12]
  critique: >
    Résultat sous-exploité. La dispersion à taille constante d'un MILP
    d'allocation est exactement le genre de mesure qui manque dans la
    littérature appliquée, où l'on publie un temps de calcul unique.
    ⚠ CHIFFRES REMPLACÉS LE 2026-08-30, et la raison compte autant que les
    valeurs. Cet item disait « les 20 solves vont de 155 s à 1 007 s, facteur
    6,5, CV 64 % », relevé le 2026-08-01. `.mosaica_solve_history.json` est une
    FENÊTRE GLISSANTE sur les 20 derniers solves, pas un journal cumulatif :
    la campagne de l'époque a été écrasée par les runs prospectifs, plus aucune
    entrée n'approche 155 s ou 1 007 s, et les 20 entrées actuelles se
    répartissent sur DEUX tailles, ce qui rend « à taille constante, les 20
    solves » mal formé. Ni le relevé de 2026-08-01 ni celui-ci n'était faux :
    c'est la SOURCE qui oublie. Le chiffre publié doit donc être recompté, pas
    recopié — voir SOLV-11b.

- id: SOLV-11b
  titre: >
    Une source de chiffres peut OUBLIER — l'historique de solve est une fenêtre
    glissante de 20 entrées, pas un journal
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-09-02
  source: [core/solve/progress.py, .mosaica_solve_history.json]
  chiffre: []
  destination: [note, oral]
  arcs:
    parce-que: [SOLV-11]
    justifie: [MET-14]
  critique: >
    `del entries[:-_MAX_ENTRIES_PER_CASE_STUDY]` tient la trace d'un seul
    fichier borné, ce qui est le bon choix pour un estimateur — il doit décrire
    la machine d'AUJOURD'HUI — et le mauvais pour une citation, qui prétend
    décrire un fait daté. Le mémoire a cité pendant un mois « 155 s à 1 007 s,
    CV 64 % » alors que le fichier ne contenait plus rien de tel, et sans
    qu'aucun garde-fou puisse le voir : `golden_snapshot` verrouille le
    pipeline, pas les mesures de durée, qui sont non déterministes par nature.
    Même famille que MET-14 (le chiffre de documentation qui dérive) mais un
    cran plus retors : ici la dérive vient de la source elle-même, pas de la
    copie. La règle qui en sort : un chiffre lu dans un artefact borné se
    RECOMPTE à la publication et se date, il ne se recopie pas.

- id: SOLV-12
  titre: >
    L'estimateur de durée ponctuel se trompait d'une médiane de 75 % ; il rend
    désormais une fourchette, ou rien
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-08-01
  source: [TODO.md, core/solve/timing.py, docs/04-vigilance.md#B.1]
  chiffre: []
  destination: [ch2, note]
  arcs:
    parce-que: [SOLV-11]
    contredit: [SOLV-B3]
    mesure-par: [VER-10]
  critique: >
    Quatre défauts cumulés dans 40 lignes : point au lieu de fourchette, tri
    stable prenant les entrées les plus ANCIENNES (donc n'apprenant plus rien
    après le 3ᵉ run), mélange warm/cold (720 s contre 209 s), et extrapolation
    hors bande (même 456 s pour 200 000 et 331 044 variables). Le bug le plus
    intéressant du dépôt : chacun est bénin, leur somme rend l'outil trompeur.

