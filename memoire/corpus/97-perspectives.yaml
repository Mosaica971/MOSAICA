- id: PERSP-60
  titre: >
    DÉBLOQUER LE BESOIN NET D'IRRIGATION — la clé mensuelle est dans `context/`
  type: perspective
  statut: ouvert
  severite: majeur
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §5", DON-70]
  chiffre: []
  destination: [ch6, note]
  arcs:
    parce-que: [DON-70, DON-20]
  critique: >
    ⚠ LE CHANTIER LE MOINS CHER ET LE MIEUX FONDÉ DE TOUTE LA LISTE. Douze
    coefficients à saisir, une multiplication par parcelle, et l'indicateur d'eau
    passe de « besoin brut des cultures » à « besoin net d'irrigation » — ce que
    le GAMS voulait dire depuis l'origine. Trois précautions, toutes déjà
    documentées : (a) `PLUVIO_PARC` est une normale 1981-2010, donc le net obtenu
    est un net CLIMATOLOGIQUE et non celui d'une année ; (b) le bug `max(0, ·)`
    manquant (IND-72) se RÉVEILLERA — il dort aujourd'hui parce que la pluie vaut
    zéro, et il faudra décider de le porter ou de le corriger ; (c) la clé est
    territoriale et non parcellaire, donc elle ne restitue pas le gradient
    est-ouest que le krigeage annuel porte déjà. Malgré cela, c'est le seul
    indicateur d'impact déclaré « non calculable » qui devient calculable en une
    après-midi.

