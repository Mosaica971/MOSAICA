    Chopin 2015, c'est aussi de ne pas répéter CALALOU (2025), qui contient déjà
    le résultat qualitatif le plus spectaculaire du Ch. 4.

# --- Ce qui change la nature du modèle ---------------------------------------

- id: PERSP-10
  titre: >
    LE MODÈLE MULTI-PÉRIODES — cadré, non commencé, et délibérément
  type: perspective
  statut: differe
  severite: majeur
  source: [TODO.md, ARCH-23, IND-21]
  chiffre: []
  destination: [ch4, ch5, ch6, note, article]
  arcs:
    parce-que: [ARCH-23, IND-21, CAL-B3]
    justifie: [PERSP-C]
  critique: >
    LA limite structurelle du dispositif : le modèle est STATIQUE, donc un
    scénario décrit un ÉTAT et jamais une TRAJECTOIRE. Trois symptômes
    indépendants convergent — l'inertie n'est qu'un proxy grossier (ARCH-23), le
    carbone du sol n'est portable qu'en flux annuel (IND-21), et l'élevage exige
    une variable d'état (CAL-B3). Ce qu'il faudrait : un index de temps sur `Y`,
    un coût de reconversion par hectare et par couple de cultures,
    l'immobilisation des pérennes sur leur durée de plantation, des contraintes
    territoriales par pas de temps, un objectif actualisé. ⚠ C'est un CHANGEMENT
    DE NATURE, pas un ajout d'indicateur : la taille est multipliée par le nombre
    de pas, or le modèle mono-période demande déjà 30 à 55 min. Sous-projet avec
    sa propre spec, et il faut y entrer par la question de la tractabilité.

- id: PERSP-20
  titre: >
    MODÉLISER LES DÉBOUCHÉS — la réserve la plus lourde du dispositif
  type: perspective
  statut: ouvert
  severite: critique
  source: [PROS-44, IND-51, CTX-21]
  chiffre: []
  destination: [ch4, ch5, ch6, article]
  arcs:
    parce-que: [PROS-44, IND-51]
  critique: >
    Le modèle porte un plafond de commercialisation (plantain) et un plancher de
    production fourragère ; partout ailleurs il suppose que ce qui est produit
    est vendu au prix de la table. Le résultat le plus fort du Ch. 4 — le
    maraîchage qui double sous contrainte budgétaire — repose donc sur une
    élasticité parfaite. ⚠ Et c'est exactement l'information que les enquêtes de
    la lettre de mission devaient apporter (CTX-21), et que CALALOU avait par son
    WP1 (CTX-10). Les données existent peut-être dans le laboratoire.

- id: PERSP-30
  titre: >
    CHOISIR LA REPRÉSENTANTE PAR PARCELLE — le meilleur rapport qualité / coût de
    la liste
  type: perspective
  statut: differe
  severite: majeur
  quand: 2026-07-27
  source: [TODO.md, DON-13, outputs/reference_2017/csv/reference_representative_eligibility.csv]
  chiffre: [mesRepCanne]
  destination: [ch3, ch6, note]
  arcs:
    parce-que: [DON-13, DON-12]
  critique: >
    Ce n'est plus une amélioration cosmétique : la représentante n'est éligible
    que sur 31 % des hectares de canne observés, et elle influence le plafond de
    main d'œuvre, donc l'OPTIMUM. Le correctif est identifié (choisir par
    parcelle parmi les variantes éligibles) et le calcul EXISTE DÉJÀ — c'est
    celui qui produit la borne basse/haute de `build_reference_state.py`. Peu de
    code, effet mesurable sur la calibration. À faire passer devant les chantiers
    plus spectaculaires.

