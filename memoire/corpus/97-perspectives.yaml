    d'emploi opérationnel. Le corpus rend ce tri mécanique : `destination: [note]`.

- id: PERSP-G
  titre: >
    [CHANTIER DÉCLARÉ] Un article qui ne soit pas une redite de Chopin et al. 2015
  type: perspective
  statut: ouvert
  severite: null
  source: ["liste de chantiers, 2026-08-12"]
  chiffre: []
