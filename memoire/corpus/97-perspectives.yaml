# =============================================================================
# 97 — PERSPECTIVES                                              préfixe : PERSP
#
# Ce qui reste à faire, et — c'est la seule chose qui rende un item de cette
# liste utile — CE QUI LE REND NÉCESSAIRE. Une perspective sans arc `parce-que`
# est une liste de courses.
#
# Deux origines mêlées : les chantiers déclarés par Clément (P-A à P-G) et les
# reports du dépôt. Marqués distinctement, parce qu'ils n'engagent pas les
# mêmes personnes ni les mêmes horizons.
# =============================================================================

# --- Les chantiers déclarés --------------------------------------------------

- id: PERSP-A
  titre: >
    [CHANTIER DÉCLARÉ] Renommer variables et fonctions vers des noms plus
    clairs, plus abstraits, et basculer le projet en anglais
  type: perspective
  statut: differe
  severite: null
  source: ["liste de chantiers, 2026-08-12", MET-32]
  chiffre: [mesChecksums, mesLignesCode]
  destination: [ch6, note]
  arcs:
    parce-que: [MET-32, ARCH-01]
    mesure-par: [MET-33]
  critique: >
    Deux objectifs distincts empilés dans un seul chantier, et ils n'ont pas le
    même statut. (a) ABSTRAIRE les noms prolonge une exigence déjà tenue et
    testée dans `core/` (ARCH-03) : c'est une continuation, elle est justifiée.
    (b) BASCULER EN ANGLAIS est une décision de PUBLIC — elle vise un lecteur
    international ou un successeur non francophone, et elle entre en tension
    avec MET-30 (les commentaires portent la justification, et ils sont longs :
    les traduire, c'est les réécrire). Différé pour raison datée : à J-14, le
    renommage casse 518 macros, ~570 checksums et rend illisibles 39 dossiers de
    runs. Le même chantier était JUSTE trois mois plus tôt — à dire tel quel,
    c'est un bon exemple de décision dont la valeur dépend de la date.

- id: PERSP-B
  titre: >
    [CHANTIER DÉCLARÉ] Une interface de données explicite et facile à remplir —
    un classeur type « bilan carbone »
  type: perspective
  statut: differe
  severite: null
  source: ["liste de chantiers, 2026-08-12", TODO.md]
  chiffre: []
  destination: [ch6, note]
  arcs:
    parce-que: [DON-24, CTX-21, MET-51]
  critique: >
    C'est le chantier le plus directement lié à l'échec de terrain du stage. Les
    25 variantes vides (SOLV-40) sont exactement ce qu'un tel classeur aurait
    permis de remplir sans développeur : des cases, des unités, une provenance.
    Trois questions à trancher avant de coder — le PÉRIMÈTRE des postes, le SENS
    de circulation (export seul, ou aller-retour ?), et l'articulation avec les
    indicateurs existants qui, eux, sont fidèles au GAMS. ⚠ Piège prévisible :
    un classeur qui accepte une saisie sans en tracer la source recrée
    exactement le problème de `Avers.txt` (un fichier qu'on croit lu).

- id: PERSP-C
  titre: >
    [CHANTIER DÉCLARÉ] Inclure l'élevage, la pêche, et les cycles associés
    (méthanisation, compostage)
  type: perspective
  statut: differe
  severite: majeur
  source: ["liste de chantiers, 2026-08-12", docs/04-vigilance.md#E.5, TODO.md]
  chiffre: []
  destination: [ch6, note, article]
  arcs:
    parce-que: [CAL-B3, DON-30, IND-51]
  critique: >
    ⚠ TROIS SOUS-CHANTIERS DE NATURES TRÈS DIFFÉRENTES, à ne pas confondre.
    (1) L'ÉLEVAGE est déjà là ÉCONOMIQUEMENT (la prairie porte sa marge) ; ce qui
    manque est une VARIABLE D'ÉTAT interdisant de liquider un cheptel sans coût.
    C'est donc un sous-problème du multi-périodes (PERSP-10), pas un ajout
    d'activité — et l'article de 2015 reconnaît lui-même cette limite.
    (2) LA PÊCHE est un ajout d'un tout autre ordre : elle n'a pas de parcelle,
    donc elle ne rentre pas dans la variable de décision `Y[parcelle, culture]`.
    L'intégrer change la NATURE du modèle (allocation de terre → allocation de
    ressources hétérogènes), pas son paramétrage. À cadrer séparément, et
    peut-être à ne pas coupler du tout : un modèle halieutique voisin, joint au
    niveau des bilans d'autonomie alimentaire, coûte beaucoup moins cher.
    (3) MÉTHANISATION / COMPOSTAGE sont des BOUCLES entre activités, donc des
    contraintes de flux — la première fois que le modèle porterait un lien
    matière entre deux cultures. Le bloc canne fibre (PORT-50) est le point
    d'entrée naturel et il est déjà à moitié instruit.

- id: PERSP-D
  titre: >
    [CHANTIER DÉCLARÉ] Incorporer MAELIA pour SIMULER rendements et itinéraires
    plutôt que les tabuler
  type: perspective
  statut: differe
  severite: majeur
  source: ["liste de chantiers, 2026-08-12", DON-01]
  chiffre: []
  destination: [ch6, note, article]
  arcs:
    parce-que: [DON-01, DON-02, PORT-01]
  critique: >
    ⚠ LE CHANTIER LE PLUS AMBITIEUX, ET CELUI QUI RÉPOND À UN DÉFAUT ÉTABLI.
    Justification directe : DON-01 mesure que les rendements tabulés valent 2 à
    4× ceux du territoire, et DON-02 montre que c'est la cause commune des
    plafonds de marché. Un rendement SIMULÉ, dépendant du sol, du climat et de
    l'itinéraire réel, attaque la racine plutôt que le symptôme.
    ⚠ TROIS POINTS À VÉRIFIER AVANT DE S'ENGAGER, que je ne peux pas trancher
    ici : (a) ce que MAELIA simule exactement et à quelle résolution — il faut
    lire sa documentation, pas s'en remettre à une réputation ; (b) la licence
    et la disponibilité d'une API de couplage ; (c) et surtout le COÛT DE
    COUPLAGE, qui est le vrai obstacle : un simulateur dans la boucle d'un MILP
    à 309 000 binaires est impossible tel quel — 30 à 55 min par solve, et un
    appel de simulateur par couple (parcelle, culture) évalué. La seule
    architecture viable est un PRÉ-CALCUL : MAELIA génère hors ligne la table de
    rendements que le modèle lit aujourd'hui. Ce qui change alors n'est pas le
    modèle, c'est la PROVENANCE de `Rdt_Cult` — et cela lève par la même occasion
    la contrainte de parité qui interdit d'y toucher (DON-B1).

- id: PERSP-E
  titre: >
    [CHANTIER DÉCLARÉ] Former les encadrants au projet et à Python
  type: perspective
  statut: differe
  severite: majeur
  source: ["liste de chantiers, 2026-08-12"]
  chiffre: []
  destination: [ch5, ch6, note]
  arcs:
    parce-que: [SOLV-B1, ARCH-04, MET-11]
  critique: >
    ⚠ C'EST LE CHANTIER QUI DÉCIDE SI LE STAGE A SERVI À QUELQUE CHOSE.
    L'argument de la réécriture (Ch. 1) était qu'un modèle qu'on ne peut plus
    interroger est mort. Si le port Python n'est interrogeable que par son
    auteur, il aura seulement DÉPLACÉ le problème — d'un environnement
    propriétaire vers une dépendance à une personne. Toute la documentation du
    dépôt (les cinq fichiers de `docs/`, l'entrée `04-vigilance`, les specs) est
    déjà une réponse à ça, et elle est substantielle. Ce qui manque n'est pas
    l'écrit mais la MISE À L'ÉPREUVE : personne d'autre n'a encore lancé un
    scénario de bout en bout. Le test décisif est simple et non fait — faire
    écrire à un encadrant une politique dans `plan.yaml` et la lancer.

- id: PERSP-F
