- id: VER-42
  titre: >
    LA BISSECTION — retirer les plafonds un par un pour établir que
    l'infaisabilité vient de leur COMBINAISON
  type: methode
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#B.4]
  chiffre: []
  destination: [ch4, note, article]
  arcs:
    parce-que: [VER-40]
    justifie: [SOLV-61]
  critique: >
    Retirer l'IFT, l'azote ou les GES isolément LAISSE l'infaisabilité. Méthode
    de débogage classique appliquée à un modèle d'optimisation, ce qui est peu
    courant — et elle produit un résultat qu'aucune inspection du YAML n'aurait
    donné : ce ne sont pas les heures qui manquent, ce sont les cultures capables
    de les absorber.

- id: VER-43
  titre: >
    Établir qu'une politique est HORS D'ATTEINTE demande TROIS constats
    distincts, aucun ne suffit
  type: methode
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#B.6]
  chiffre: []
  destination: [ch4, oral, article]
  arcs:
    parce-que: [VER-22, VER-40]
    justifie: [SOLV-62]
  critique: >
    (1) LP faisable en 81 s ⇒ ce n'est PAS de l'infaisabilité ; (2) aucun
    incumbent en 7 200 s ⇒ ce n'est pas non plus une simple lenteur ; (3) les
