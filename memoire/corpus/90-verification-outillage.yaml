- id: VER-B1
  titre: >
    BRANCHE COUPÉE — un run de référence AVEC SOLVE comme garde-fou de refactor
  type: choix
  statut: ecarte
  severite: null
  quand: 2026-07-21
  source: ["docs/superpowers/specs/2026-07-21-refactor-structure-et-deduplication-design.md:43-51"]
  chiffre: []
  destination: [ch2, oral, article, note]
  arcs:
    parce-que: [VER-30]
    mesure-par: [SOLV-11]
  critique: >
    ⚠ LA BRANCHE LA MIEUX COUPÉE DU DÉPÔT, avec DEUX raisons dont la seconde est
    la vraie. (1) Trop lent : 30 à 55 min avec une variance ×2,1. (2) Et surtout
    **pas déterministe au sens qui nous intéresse** — sur un MILP DÉGÉNÉRÉ, deux
    optima de VALEUR IDENTIQUE peuvent être retournés indifféremment. « Un écart
    d'allocation entre deux runs ne prouverait rien, et MASQUERAIT les vrais
    écarts. » Le garde-fou naturel serait donc à la fois trop cher et activement
    trompeur : il crierait au loup sur du bruit, donc on le désactiverait, donc
    il ne garderait rien. C'est ce raisonnement qui produit le golden snapshot —
    séparer le déterministe du non déterministe et ne verrouiller que le premier.

- id: VER-32
  titre: >
    Ce qu'il fallait prouver se réduit à : entrées du solveur et sorties du
    reporting inchangées — mesurable sans jamais résoudre
  type: methode
