  quand: 2026-07-21
  source: ["docs/superpowers/specs/2026-07-21-refactor-structure-et-deduplication-design.md:53-57"]
  chiffre: []
  destination: [ch2, oral, article]
  arcs:
    parce-que: [VER-B1]
    justifie: [VER-33]
  critique: >
    Le raisonnement qui rend le problème traitable : « le refactor ne touche NI
    le solveur, NI la formulation mathématique ». Réduire une question de
    non-régression à ses invariants vérifiables plutôt que de tout rejouer —
    transférable à n'importe quel système coûteux à exécuter, et c'est le genre
    d'analyse qu'on saute d'ordinaire faute de la formuler.

