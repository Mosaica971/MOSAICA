- id: VER-36
  titre: >
    Les tests vérifient LES DEUX BORNES d'un indicateur, pas un cas intermédiaire
  type: methode
  statut: retenu
  severite: null
  quand: 2026-07-20
  source: ["docs/superpowers/specs/2026-07-20-resilience-stability-score-design.md:219-226"]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [VER-02]
  critique: >
    Le HHI d'une monoculture vaut 1,0, celui de `n` cultures à parts égales vaut
    `1/n` — « les deux bornes, pas seulement un cas intermédiaire ». Plus les cas
    dégénérés : revenu total nul rend `0.0` sans lever, une culture de revenu nul
    ne pèse pas dans `n`, `δ = 0` annule la perte et `δ = 1` la porte au revenu
    entier. Discipline de test qui vaut d'être nommée : sur une formule agrégée,
    ce sont les EXTRÊMES et les DÉGÉNÉRESCENCES qui distinguent une
    implémentation juste d'une implémentation plausible — un cas moyen passe avec
    presque n'importe quelle formule.
