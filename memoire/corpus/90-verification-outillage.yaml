- id: VER-22
  titre: >
    `audit_warm_start_seed.py` — chiffrer la DISTANCE d'une graine à la
    faisabilité, contrainte par contrainte
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-08-09
  source: [scripts/audit_warm_start_seed.py, docs/04-vigilance.md#B.6]
  chiffre: [mesPdixViolationsA, mesPdixViolationsP]
  destination: [ch4, note, article]
  arcs:
    parce-que: [VER-21]
    justifie: [VER-43]
  critique: >
    Passe de « la graine est-elle valide ? » à « à quelle distance est-elle, et
    par quelles contraintes ? ». C'est ce qui permet d'établir que P10 n'est pas
    lente mais HORS D'ATTEINTE : 124 violations pour la plus proche, 407 pour la
    plus éloignée. Un diagnostic quantitatif là où on aurait conclu par lassitude.

- id: VER-40
  titre: >
    `check_scenario_feasibility.py` — le contrôle avant vol en relaxation LP
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-07-31
  source: [scripts/check_scenario_feasibility.py]
  chiffre: []
  destination: [ch4, note]
