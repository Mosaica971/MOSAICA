# =============================================================================
# 90 — VÉRIFICATION ET OUTILLAGE                                   préfixe : VER
#
# Trois dispositifs qui n'attrapent PAS les mêmes choses, plus les audits ad hoc
# qui ont tranché les débats. La thèse du domaine : dans ce travail, savoir
# qu'on a tort est un livrable, pas une précaution.
# =============================================================================

# --- Les trois garde-fous ----------------------------------------------------

- id: VER-01
  titre: >
    Les tests unitaires ne lisent JAMAIS les données réelles — et c'est délibéré
  type: choix
  statut: retenu
  severite: null
  source: [tests/, memoire/chapitres/02-porter.tex#sec:gardefous, CLAUDE.md]
  chiffre: [mesTests, mesTestsFichiers]
  destination: [ch2, note, oral]
  arcs:
    parce-que: [ARCH-13, DON-50]
    justifie: [VER-02, VER-30]
  critique: >
    « Un test qui dépend d'un jeu de données de production échoue pour des
    raisons qui n'ont rien à voir avec la logique testée, et devient un test
    qu'on désactive. » Argument juste, et le revers est dit dans la même phrase :
    ils vérifient que chaque contrainte fait ce qu'elle dit, jamais que le
    résultat global est le bon. Un garde-fou dont on énonce la portée ET la
    limite — c'est ce qui manque à la plupart des suites de tests.

- id: VER-02
  titre: >
    Les tests exercent les constructeurs sur des configurations MINUSCULES
    construites à la main
  type: methode
  statut: retenu
  severite: null
  source: [tests/test_guadeloupe_constraints.py, CLAUDE.md]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [VER-01]
  critique: >
    Conséquence pratique : la suite reste rapide et lisible, et un test échoué
    désigne une ligne de logique et non un jeu de données. Style à documenter
    pour un successeur — CLAUDE.md le fait explicitement (« Follow that style
    for new model logic »).

- id: VER-03
  titre: >
    ⚠ La suite complète dure ~29 min parce que quelques tests construisent le
    vrai jeu de données et lancent de vrais solves
  type: piege
  statut: retenu
  severite: mineur
  source: [CLAUDE.md, pyproject.toml]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [VER-01]
  critique: >
    Contradiction partielle avec VER-01 : le principe « aucun test ne lit les
    données » souffre des exceptions. Elles sont assumées, mais elles rendent la
    suite complète inutilisable en boucle d'itération — d'où la consigne de ne
    lancer que les fichiers touchés. Une séparation par marqueur pytest
    (`-m slow`) serait le correctif naturel et n'a pas été faite.

- id: VER-30
  titre: >
    LE GOLDEN SNAPSHOT — ~570 sommes de contrôle sur le vrai jeu de données,
    SANS résoudre le moindre MILP, donc exactement reproductible
  type: methode
  statut: retenu
  severite: null
  source: [scripts/golden_snapshot.py, memoire/chapitres/02-porter.tex]
  chiffre: [mesChecksums]
  destination: [ch2, note, oral, article]
  arcs:
    parce-que: [VER-01]
    justifie: [ARCH-54, VER-31]
  critique: >
    L'idée centrale : SÉPARER ce qui est déterministe (pipeline, indicateurs,
    construction du modèle) de ce qui ne l'est pas (la recherche arborescente),
    et verrouiller le premier au checksum près. C'est ce qui permet de remanier
    l'arborescence entière en sachant qu'on n'a rien cassé. Transférable à tout
    projet où un solveur stochastique masque les régressions.

- id: VER-31
  titre: >
    Le golden vit dans `.golden/`, GITIGNORÉ, parce qu'il dérive de `data/` qui
    l'est aussi
  type: choix
  statut: retenu
  severite: null
  source: [CLAUDE.md, .gitignore]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [VER-30, DON-50]
  critique: >
    Conséquence gênante et non dite : le garde-fou n'est PAS partagé. Deux
    développeurs sur deux machines ont deux références, et rien ne garantit
    qu'elles coïncident. Acceptable à une personne, faux dès la deuxième.
    À signaler dans la note technique.

- id: VER-50
  titre: >
    `check_references.py` — le SEUL garde-fou du dépôt sur le solve, ~0 s, aucun
    solve
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-08-01
  source: [scripts/check_references.py, case_studies/guadeloupe/references.yaml]
  chiffre: []
  destination: [ch2, note]
  arcs:
    parce-que: [CAL-60]
    justifie: [VER-51]
  critique: >
    Comble exactement le trou laissé par les deux autres : les tests sont sans
    données, le golden couvre le pipeline et les indicateurs, ni l'un ni l'autre
    ne couvre la RÉSOLUTION. Trois dispositifs, trois périmètres disjoints,
    énoncés — c'est la partie « garde-fous » du Ch. 2 et elle est solide.

- id: VER-51
  titre: >
    Sa tolérance est de 5 % PARCE QUE le bruit de branch-and-bound mesuré vaut
    0,15 point de PAD
  type: choix
  statut: retenu
  severite: majeur
  source: [scripts/check_references.py, docs/04-vigilance.md#E.3]
  chiffre: [mesBruitPad, mesGraineA, mesGraineB, mesGraineC]
  destination: [ch2, oral]
  arcs:
    parce-que: [VER-50, SOLV-55]
  critique: >
    Un seuil de garde-fou DÉRIVÉ D'UNE MESURE de bruit, et non choisi. « Une
    garde à l'égalité exacte échouerait sur un simple re-run. » C'est la bonne
    façon de fixer une tolérance, et c'est rare. Bon exemple à l'oral : la
    démarche expérimentale appliquée à son propre outillage.

- id: VER-52
  titre: >
    ⚠ `check_references.py` reste une commande à lancer À LA MAIN, jamais
    branchée sur un hook
  type: perspective
  statut: ouvert
  severite: mineur
  source: [TODO.md]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [VER-50]
  critique: >
    Décision explicite (« si le rythme de modification du modèle le justifie »),
    donc pas un oubli. Mais un garde-fou qu'on peut oublier de lancer n'en est
    un qu'à moitié.

