- id: MET-64
  titre: >
    ⚠ Le chiffre de contrôle du golden était PÉRIMÉ dans le fichier même chargé
    d'empêcher les chiffres de dériver
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-08-12
  source: ["memoire/build_chiffres.py", "golden_snapshot.py --check"]
  chiffre: [mesChecksums]
  destination: [ch5, oral, note]
  arcs:
    parce-que: [MET-14]
  verdict-anterieur: >
    « Les chiffres du mémoire ne peuvent pas dériver, puisqu'ils sont GÉNÉRÉS
    depuis les `recap.json` des runs. » Ils le sont presque tous. `mesChecksums`
    faisait partie du bloc de constantes saisies à la main, dans le fichier même
    dont la raison d'être est d'empêcher la dérive : il annonçait 570 quand la
    vérification en donnait 681.
  critique: >
    `mesChecksums` valait 570 ; la vérification en donne 681. La valeur datait du
    refactor du 21/07, avant l'ajout des blocs `intensity`, `agroecology`, P/K et
    Rpest. Corrigé le 12/08. ⚠ ITEM RÉFLEXIF PRÉCIEUX PARCE QU'IL EST
    AUTORÉFÉRENT : le dispositif conçu pour que les chiffres ne vieillissent pas
    contient un bloc de constantes SAISIES À LA MAIN (MET-21), et c'est
    exactement là que la dérive s'est logée. La discipline de génération ne
    protège que ce qu'elle génère ; tout ce qui reste déclaratif dérive, y
    compris dans un fichier qui s'appelle `build_chiffres`.

- id: MET-65
  titre: >
    Les messages de commit portent les CHIFFRES et les prédictions, pas seulement
    les intentions
  type: organisation
