  critique: >
    Exemples : « 80 468 932 maxTimeLimit → 81 036 580 OPTIMAL en 675 s. La valeur
    prédite avant le run, au centime » ; « l'écart entre payer et interdire passe
    de 15,1 à 7,3 M€ : le classement tient, sa magnitude était fausse d'un
    facteur deux » ; « 9/9 optimal, ~43 min ». L'historique est utilisable comme
