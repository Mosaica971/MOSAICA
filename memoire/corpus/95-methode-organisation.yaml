- id: MET-60
  titre: >
    Le générateur de chiffres ÉCHOUE BRUYAMMENT plutôt que d'émettre une valeur
    périmée
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-08-11
  source: ["commit 9585f43"]
  chiffre: []
  destination: [ch5, note, oral]
  arcs:
    parce-que: [MET-20]
    justifie: [MET-61]
  critique: >
    Consigné tel quel dans un commit : « ATTENTION : le mémoire NE COMPILE PAS en
    l'état. Les quatre cellules du lot D sont en cours de résolution, donc 34
    macros de grille manquent et `build_chiffres.py` échoue bruyamment, COMME
    PRÉVU. » C'est le contraire exact du défaut silencieux d'ARCH-63 : le
    dispositif refuse de produire un document plutôt que d'en produire un faux.
    Choix inconfortable — le document est inutilisable pendant le calcul — et
    correct.

- id: MET-61
  titre: >
    Le générateur lit AUSSI la version écartée dans la quarantaine, pour que la
    démonstration survive à sa propre réparation
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-08-11
  source: ["commit 9585f43", MET-52]
  chiffre: []
  destination: [ch5, note]
  arcs:
    parce-que: [MET-60, MET-52]
  critique: >
    ⚠ SUBTILITÉ REMARQUABLE. Le témoin qui DÉMONTRE qu'un solve non convergé est
    faux est précisément le run non convergé. Le réparer détruirait la preuve.
    Solution : le générateur lit `outputs/_non_converges/` et présente un
    AVANT/APRÈS, si bien que la réparation ENRICHIT la démonstration au lieu de
    l'effacer — « rien à rédiger le jour où la cellule converge ». Un dispositif
    d'écriture conçu pour que l'amélioration du résultat ne détruise pas
    l'argument méthodologique qu'il portait.

- id: MET-62
  titre: >
    `chiffres.tex` est VERSIONNÉ bien que généré — parce qu'un clone frais ne
    pourrait pas le reconstruire
  type: choix
  statut: retenu
  severite: null
  quand: 2026-08-10
  source: ["commit 8cfff0b"]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [MET-20, DON-50]
  critique: >
    Exception assumée à la règle « ne pas versionner ce qui est généré », et sa
    raison est structurelle : le fichier dérive d'`outputs/`, qui est local et
    gitignoré. Sans lui, le mémoire ne compilerait sur aucune autre machine.
    Conséquence directe de DON-50 (les données ne sont pas dans le dépôt) sur un
    objet qui n'a rien à voir avec le modèle — la contrainte de confidentialité
    se propage jusqu'à la chaîne éditoriale.

- id: MET-63
  titre: >
    Le générateur de chiffres est passé de 205 macros à 518 en deux jours
  type: resultat
