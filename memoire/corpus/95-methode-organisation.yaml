- id: MET-53
  titre: >
    Un batch se valide TOUJOURS avant d'engager des heures : `--dry-run` puis
    contrôle LP
  type: organisation
  statut: retenu
  severite: null
  source: [CLAUDE.md, scripts/run_scenarios.py]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [MET-50, VER-40]

- id: MET-54
  titre: >
    Le mémoire est écrit DANS le dépôt, versionné avec le code qu'il décrit
  type: organisation
  statut: retenu
  severite: null
  source: [memoire/, "git log"]
  chiffre: []
  destination: [ch5, note]
  arcs:
    parce-que: [MET-20]
  critique: >
    Conséquence : les chiffres du mémoire sont générés depuis les runs, et un
    commit `docs(memoire)` voisine un commit `measure(solves)`. Le document et
