# Implementation roadmap: what is done, in progress, to do, to update, or only proposed.
#
# This file replaces docs/TODO.md (retired 2026-09-22). It is the LIST; the reasoning behind
# each item lives in the spec it points to, and the traps in docs/04-vigilance.md.
# scripts/build_status_board.py renders it into docs/status/STATUS.md and the dashboard's
# Status page; tests/test_status_board.py checks every item has a known status and that the
# spec it cites exists.
#
# status:   done | in_progress | todo | to_update | proposal | blocked | abandoned
# area:     model | data | calibration | scenarios | reporting | dashboard | tooling |
#           docs | coupling | information_system
# `left` says what remains for an item that is done but not finished; `blocked_by` why an
# item cannot move.

