# Files of a run folder (outputs/<run>/). A whole folder is level 2 today; an export by level
# (roadmap level-export) keeps the files at or below the requested level, and aggregates or
# suppresses the rest. `{side}` is input (observed 2017) or output (simulated).
outputs:
  recap.json: {level: 1, note: territorial and regional aggregates, calibration scores; no plot or farm row}
  recap.md: {level: 1}
  config_used.yaml: {level: 0}
  reference_comparison.md: {level: 1}
  csv/allocation_{side}.csv: {level: 2, note: one row per plot with its farm}
  csv/facts_{side}.csv: {level: 1, note: per crop}
  csv/revenue_by_farm.csv: {level: 2}
  csv/fte_by_farm_{side}.csv: {level: 2}
  csv/calibration_pad_by_farm.csv: {level: 2}
  csv/calibration_field_match.csv: {level: 2}
  csv/calibration_farm_type_confusion.csv: {level: 1, note: counts of farms per type pair; check small cells}
  csv/calibration_pad_by_crop.csv: {level: 1}
  csv/calibration_pad_by_crop_and_region.csv: {level: 1}
  csv/production_by_crop_{side}.csv: {level: 1}
  csv/subsidy_by_crop_{side}.csv: {level: 1}
  csv/revenue_by_crop_{side}.csv: {level: 1}
  csv/gross_margin_by_crop_{side}.csv: {level: 1}
  csv/labor_cost_by_crop_{side}.csv: {level: 1}
  csv/subsidy_per_tonne_by_crop.csv: {level: 1}
  csv/subsidy_per_euro_sold_by_crop.csv: {level: 1}
  csv/fte_by_island_{side}.csv: {level: 0}
  csv/fte_by_region_{side}.csv: {level: 1}
  csv/shannon_diversity_by_island_{side}.csv: {level: 0}
  csv/shannon_diversity_by_region_{side}.csv: {level: 1}
  csv/surface_by_island_{side}.csv: {level: 0}
  csv/surface_by_region_{side}.csv: {level: 1}
  plots/*.png: {level: 1, note: per-crop and per-region charts}
