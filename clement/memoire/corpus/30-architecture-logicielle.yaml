- id: ARCH-31
  titre: >
    Chaque règle interdit son propre sous-ensemble et le masque garde l'UNION
    interdite — donc un OU s'exprime par PLUSIEURS entrées
  type: piege
  statut: retenu
  severite: majeur
  source: [CLAUDE.md, case_studies/guadeloupe/config.yaml]
  chiffre: []
  destination: [annexeA, note]
  arcs:
    parce-que: [ARCH-30]
  critique: >
    Une entrée `attribute_forbidden` fait un ET de ses conditions ; le OU se
    fabrique en empilant les entrées. C'est ainsi qu'est écrite l'interdiction
    sol/île du melon. Piège de logique classique, qui produit des configurations
    fausses et plausibles si on l'ignore.

- id: ARCH-32
  titre: >
    Cinq règles catégorielles de `core/` sont des cas particuliers
    d'`attribute_forbidden` et ont été CONSERVÉES pour la lisibilité du YAML
  type: choix
  statut: retenu
  severite: null
  quand: 2026-07-21
  source: [TODO.md, "docs/superpowers/specs/2026-07-21-refactor-structure-et-deduplication-design.md"]
  chiffre: []
  destination: [note]
  arcs:
    parce-que: [ARCH-30]
    ferme-la-branche: [ARCH-B1]
  critique: >
    Refus explicite d'une déduplication possible, au motif que les noms
    génériques (`soil_type_forbidden`, `irrigation_required`) se lisent mieux en
    configuration qu'une règle générique paramétrée. Seule
    `melon_soil_restriction`, au nom spécifique à une culture, a été supprimée.
    Bon critère de tri : ce qui se lit dans le YAML l'emporte sur ce qui se
    factorise dans le code.

- id: ARCH-B1
  titre: "BRANCHE COUPÉE — factoriser les cinq règles catégorielles en une seule"
  type: choix
  statut: ecarte
  severite: null
  source: [TODO.md]
  chiffre: []
  destination: [note]
  arcs:
    mesure-par: []
  sans-mesure: >
    Le critère de la décision n'est pas mesurable par un solve : c'est la
    lisibilité du fichier de configuration par un non-développeur. Cinq règles
    nommées, chacune lisible seule, valent mieux qu'une règle générale
    paramétrée — au prix d'une répétition que personne ne relit jamais. Une
    factorisation gagnerait des lignes de Python et perdrait l'interface humaine,
    qui est la raison d'être du YAML dans ce dépôt (ARCH-02).
  critique: >
    Cohérent avec toute la stratégie du dépôt, mais c'est bien un arbitrage de
    goût : un développeur seul aurait factorisé. Le choix ne se défend que si
    l'on assume que le prochain lecteur du fichier est un agronome.

