    « Toute duplication est un défaut à supprimer. » La moitié de celle-ci en
    était un et a été fusionnée ; l'autre (`CONFIG_PATH`) a été CONSERVÉE
    délibérément, parce que la factoriser aurait chargé pandas au `--help`. La
