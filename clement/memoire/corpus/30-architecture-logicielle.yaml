- id: ARCH-66
  titre: >
    La main d'œuvre n'est PAS monétisée dans le coût variable du GAMS — le revenu
    net est un ajout de reporting
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-07-13
  source: ["docs/archives/journal-vigilance.md:1002-1005"]
  chiffre: []
  destination: [ch2, annexeA, note]
  arcs:
    parce-que: [PORT-01]
  critique: >
    ⚠ FAIT DE MODÉLISATION LOURD ET PEU VISIBLE. La marge brute que le modèle
    maximise ne déduit AUCUN coût de travail — seules des heures sont comptées,
    et uniquement pour la contrainte de plafond. Une culture à 1 128 h/ha et une
    à 12,7 h/ha ont donc la même structure de coût dans l'objectif. C'est
    cohérent avec la notion de marge BRUTE, mais cela explique en partie pourquoi
    le modèle bascule si volontiers vers le maraîchage intensif dès que le
    plafond horaire le permet. `labor.cost_per_hour` ajoute un revenu net en
    REPORTING seulement, sans effet sur l'optimum (défaut 0, rétro-compatible).

