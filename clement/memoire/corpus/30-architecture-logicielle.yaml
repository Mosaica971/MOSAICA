- id: ARCH-13
  titre: >
    ⚠ LE COÛT DE L'INDIRECTION — un nom mal orthographié n'échoue qu'à
    l'interrogation du registre, donc TARD
  type: piege
  statut: retenu
  severite: majeur
  source: [memoire/chapitres/02-porter.tex#sec:architecture]
  chiffre: []
  destination: [ch2, note]
  arcs:
