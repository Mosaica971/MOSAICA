- id: ARCH-68
  titre: >
    `enable_add` doit s'appliquer AVANT `set_args` — une politique POSE sa
    contrainte, un front la DÉPLACE
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-08-05
  source: ["commit 3cfa575", core/config.py]
  chiffre: []
  destination: [note, annexeC]
  arcs:
    parce-que: [ARCH-11, PROS-52]
  verdict-anterieur: >
    « L'ordre d'application de `enable_add` et `set_args` est un détail de
    plomberie. » C'est une décision de SÉMANTIQUE : une politique POSE une
    contrainte, un front la DÉPLACE, et déplacer ce qui n'existe pas encore n'a
    pas de sens. La limite qui l'imposait (PROS-52) était consignée depuis des
    semaines ; sa conséquence sur l'ordre ne l'avait pas été.
  critique: >
    Dans l'ordre inverse, `set_args` cherchait un label pas encore ajouté et les
    SEPT points de `pareto_subventions` échouaient sur
    `KeyError: set_args label 'budget_subventions' matched no entry`.
    ⚠ Ce bug est la conséquence directe de la limite déjà consignée en PROS-52
    (`set_args` ne sait toucher qu'une entrée déjà déclarée) : la limite était
    connue, sa conséquence sur l'ORDRE de composition ne l'était pas. Un ordre
    d'application de transformations de configuration est une décision de
    sémantique, pas de plomberie — poser puis déplacer, jamais l'inverse.
    Bon point pour l'échec bruyant : le `KeyError` est immédiat et nommé, très
    loin des défauts silencieux d'ARCH-63.
