    n'auraient pas de raison d'être.

- id: ARCH-14
  titre: >
    Pire — une famille de contraintes dont le MODULE n'a pas été importé est
    simplement ABSENTE du registre, donc introuvable
  type: piege
  statut: retenu
  severite: majeur
  source: [CLAUDE.md, core/model/builder.py]
  chiffre: []
  destination: [note, annexeA]
