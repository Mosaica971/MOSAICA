- id: ARCH-60
  titre: >
    DEUX normalisations divergentes du même code région — deux libellés possibles
    pour la même région selon la fonction appelée
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-08-01
  source: ["docs/archives/journal-vigilance.md:965-970"]
  chiffre: []
  destination: [ch5, note]
  arcs:
    parce-que: [ARCH-02]
    justifie: [ARCH-63]
  verdict-anterieur: >
    « La séparation `core/` ↔ `case_studies/` ↔ `apps/` garantit qu'une même
    intention n'est écrite qu'une fois. » Elle garantit qu'on ne s'IMPORTE pas de
    travers ; elle n'empêche pas d'écrire deux fois le même algorithme dans deux
    couches, à deux moments, avec deux résultats.
  critique: >
    `domain/zones.py` découpait la chaîne (`"4.5"` → `"4.5"`), `dashboard/
    comparison.py` faisait `str(int(float(·)))` (`"4.5"` → `"4"`). Deux
    algorithmes pour la même intention, écrits à des moments différents, dans
    deux couches censées être séparées. Résolu en faisant des fonctions du
    dashboard des ALIAS et non des copies, avec un test qui l'exige. ⚠ Défaut
    de duplication SILENCIEUX : rien ne plante, un libellé change.

