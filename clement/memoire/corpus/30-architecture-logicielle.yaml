  critique: >
    Les constructeurs sont importés POUR LEUR EFFET DE BORD d'enregistrement
    (`import ... as _constraints  # noqa: F401`). Piège aggravé : importer le
    PAQUET `case_studies.guadeloupe.model` n'enregistre rien, son `__init__.py`
    étant vide — il faut importer le MODULE `...model.model`. Exactement le genre
    de savoir qui se perd et que CLAUDE.md conserve.

