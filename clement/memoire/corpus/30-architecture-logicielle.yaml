# =============================================================================
# 30 — ARCHITECTURE LOGICIELLE                                    préfixe : ARCH
#
# Le registre piloté par configuration, la séparation générique / territoire,
# la couche lecture seule, et ce que cette indirection coûte.
#
# C'est le domaine où le mémoire risque le plus de devenir un rapport de
# développement. La règle de tri : ne garder au cœur que ce dont dépend un
# RÉSULTAT ou une LIMITE de lecture.
# =============================================================================

