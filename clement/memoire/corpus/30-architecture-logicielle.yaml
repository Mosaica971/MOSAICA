# --- Le registre -------------------------------------------------------------

- id: ARCH-10
  titre: >
    Le noyau ne définit pas des contraintes mais des FAMILLES de contraintes,
    enregistrées sous un nom et paramétrées en YAML
  type: choix
  statut: retenu
  severite: null
  source: [core/model/registry.py, core/config.py, memoire/chapitres/02-porter.tex]
  chiffre: []
  destination: [ch2, annexeA, oral]
  arcs:
    parce-que: [ARCH-01]
    justifie: [ARCH-11, ARCH-12, ARCH-20]
  critique: >
    LE RÉSULTAT QUI JUSTIFIE TOUT : la totalité du dispositif expérimental du
    Ch. 4 — dix politiques, douze forçages, deux fronts — est écrite en YAML et
    n'a demandé AUCUNE modification du constructeur de modèle. C'est la réponse
    directe au deuxième obstacle du GAMS (faire varier un levier = éditer les
    équations). Argument à garder au cœur.

- id: ARCH-11
  titre: >
    `resolve_enabled` lit une liste de configuration et rend des couples
    (constructeur, arguments) — le même motif pour contraintes, objectifs,
    éligibilité et règles catégorielles
  type: choix
  statut: retenu
  severite: null
  source: [core/config.py]
  chiffre: []
  destination: [ch2, annexeA]
  arcs:
    parce-que: [ARCH-10]
    justifie: [PROS-52]
  critique: >
    Un seul motif pour quatre familles d'objets : ce qui rend le système
    apprenable. ⚠ Limite connue : `set_args` ne sait toucher qu'une entrée DÉJÀ
    déclarée, d'où les leviers `enable: false` fantômes de `config.yaml`
    (PROS-52). Dette assumée et documentée.

- id: ARCH-12
  titre: >
    Exactement UN objectif doit être activé — contrainte structurelle du registre
  type: choix
  statut: retenu
  severite: null
