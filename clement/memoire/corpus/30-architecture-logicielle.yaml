    parce-que: [ARCH-40]
  verdict-anterieur: >
    « Un fichier qui s'exécute correctement est un fichier correct. » Il tournait
    depuis le début : c'est l'outillage d'analyse, pas l'interpréteur, qui l'a
    déclaré illisible.
  critique: >
    Python décode en `utf-8-sig`, donc le fichier tournait parfaitement ; mais
    tout outil le lisant en UTF-8 pur échouait, `ast.parse` compris. Encore un
    défaut qui ne se manifeste QUE dans l'analyse, jamais dans l'usage. Aucun
    autre fichier du dépôt n'en portait — vérifié plutôt que supposé.

- id: ARCH-62
  titre: >
    Une propriété nommée « couverture » qui renvoyait un EFFECTIF, et qu'aucun
    appelant n'utilisait
  type: erreur
  statut: erreur-a-posteriori
  severite: mineur
  quand: 2026-08-01
  source: ["docs/archives/journal-vigilance.md:986-988"]
  chiffre: []
  destination: [ch5, note]
  arcs:
    parce-que: [DON-40]
  verdict-anterieur: >
    « Le nom dit ce que la chose est. » `GeometryJoin.coverage` annonçait une part
    et rendait un effectif ; aucun appelant ne s'en servait, donc rien ne l'a
    jamais démenti. Un nom faux qu'on n'appelle pas ne casse rien — il attend.
  critique: >
    `GeometryJoin.coverage`. Supprimée — `summary()` calcule bien la part.
    Intérêt de l'item : c'est le MÊME défaut que MET-31 (le commentaire qui ment)
    transposé à un NOM. Un identifiant est une affirmation, et il peut être faux
    sans que rien ne le signale. Le fait qu'aucun appelant ne l'utilisait est ce
    qui a permis de la supprimer sans risque — et ce qui explique qu'elle ait
    survécu si longtemps.

- id: ARCH-63
  titre: >
    Trois défauts silencieux de la même famille, corrigés le même jour
  type: methode
  statut: retenu
  severite: majeur
  quand: 2026-08-01
  source: [ARCH-60, ARCH-61, ARCH-62]
  chiffre: []
  destination: [ch5, oral, note]
  arcs:
    parce-que: [ARCH-60]
    justifie: [MET-41]
  critique: >
    Deux normalisations divergentes, un BOM, un nom qui ment. Aucun ne provoque
    d'erreur ; tous les trois faussent quelque chose. C'est la même classe que
    PORT-10 (GAMS rend 0), SOLV-32 (HiGHS jette la graine), VER-63 (le compteur
    de pages ne comptait rien) et PORT-22 (les sols indexés par position).
    ⚠ SEPT OCCURRENCES, sur sept objets sans rapport — un solveur commercial, un
    langage de modélisation, une chaîne LaTeX, un encodage de fichier, un nom de
    propriété, deux fonctions utilitaires. C'est le fil conducteur le plus solide
    du mémoire, et il se formule en une phrase : **le défaut dangereux n'est pas
    celui qui casse, c'est celui qui continue.**

