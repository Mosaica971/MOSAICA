- id: PORT-05
  titre: >
    L'inventaire a été mis à jour APRÈS coup et deux lignes étaient périmées de
    trois semaines
  type: erreur
  statut: erreur-a-posteriori
  severite: mineur
  quand: 2026-08-09
  source: [docs/gams_port_inventory.md]
  chiffre: []
  destination: [ch5, note]
  arcs:
    parce-que: [PORT-04]
  verdict-anterieur: >
    « L'inventaire de portage dit l'état du modèle. » Il le disait au moment où
    il a été écrit, et rien dans le dépôt ne signalait qu'il avait cessé de le
    dire — trois semaines de dérive silencieuse sur deux lignes.
  critique: >
    `Eq_MO_MAX_Expl` et « objectifs » étaient marqués inactifs alors qu'ils
    étaient actifs depuis le 21/07. Petit fait, mais exemplaire d'un vrai risque :
    une documentation de traçabilité qui dérive devient pire que pas de
    documentation, parce qu'on lui fait confiance. Argument pour MET-20 (générer
    plutôt que rédiger ce qui peut l'être).

# --- Ce que le GAMS ne disait pas -------------------------------------------

- id: PORT-10
