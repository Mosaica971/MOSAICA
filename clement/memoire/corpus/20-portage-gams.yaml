- id: PORT-22
  titre: >
    Deux ordres de types de sol incompatibles — indexer par position produit des
    coefficients faux mais parfaitement plausibles
  type: piege
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#D.2, data/sets/SOL.set]
  chiffre: []
  destination: [ch2, oral, note, article]
  arcs:
    parce-que: [PORT-01]
    justifie: [MET-30]
  critique: >
    `SOL.set` ordonne NITISOL, ANDOSOL, FERRALSOL, AUTRES, VERTISOL ; le GAMS
    mappe 1→VERTISOL, 2→FERRALSOL, 3→ANDOSOL, 4→NITISOL, 5→AUTRES. Aucun test ne
    signale l'erreur, aucune sortie n'a l'air anormale : des rendements crédibles
    sur les mauvais sols. C'est LE meilleur argument du mémoire pour avoir gardé
    le GAMS comme référence plutôt qu'une documentation intermédiaire. Règle
    générale qui en sort : toujours mapper PAR NOM, jamais par position.

- id: PORT-23
  titre: >
    ERREUR COMMISE — la règle de sol de l'ananas était inversée, et elle a vécu
    plusieurs semaines
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-07-23
  source: [commit 0e159df, TODO.md]
  chiffre: []
  destination: [ch3, ch5, note]
  arcs:
    parce-que: [PORT-22]
    mesure-par: [VER-01]
  verdict-anterieur: >
    « Le piège des deux ordres de types de sol est identifié et documenté (PORT-22),
    donc il ne me mordra pas. » Il a mordu, dans le port, sur l'ananas, et il y a
    vécu plusieurs semaines — le seul cas du stage où une erreur a été commise
    APRÈS que son propre mécanisme ait été écrit noir sur blanc.
  critique: >
    Exactement le défaut que PORT-22 décrit, commis pour de vrai dans le port.
    À raconter : c'est la preuve que connaître le piège ne suffit pas à l'éviter,
    et ça donne sa valeur au golden snapshot. Vérifier la date exacte et
    l'ampleur de l'effet avant de le citer.

- id: PORT-24
  titre: >
    Les commentaires de configuration décrivaient les bans chlordécone à
    l'envers, alors que le code était juste
  type: erreur
  statut: erreur-a-posteriori
  severite: mineur
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-calib-parity-rootcause-design.md"]
  chiffre: []
  destination: [ch5, note]
