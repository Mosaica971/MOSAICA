# =============================================================================
# 20 — PORTAGE GAMS → PYTHON                                      préfixe : PORT
#
# Le mandat de parité, ce qu'il protège, ce qu'il interdit, les bugs portés
# volontairement, les pièges de transcription, l'inventaire équation par
# équation. C'est le domaine où le stage a inventé un PROTOCOLE, et c'est
# probablement sa contribution méthodologique la plus transférable après les
# résultats de solveur.
