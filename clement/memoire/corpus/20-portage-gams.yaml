  critique: >
    La mesure qui tranche est PORT-20 (`Eq_VE_PLUIE`) : un port amélioré aurait
    corrigé en silence une interdiction territoriale complète, et le désaccord
    avec le GAMS serait devenu inexplicable. La branche est coupée par un cas
    concret, pas par un principe — c'est ce qui la rend convaincante.

- id: PORT-03
  titre: >
    La contrepartie qui rend le mandat vivable — chaque bug est porté ET
    accompagné d'une variante « intention présumée » désactivée dans la config
  type: choix
  statut: retenu
  severite: null
  source: [case_studies/guadeloupe/config.yaml, memoire/chapitres/01-terrain-et-objet.tex]
  chiffre: []
  destination: [ch1, ch2, annexeB, oral, article]
  arcs:
    parce-que: [PORT-01]
  critique: >
    C'est l'invention méthodologique du stage : « basculer les deux lignes suffit
    à tester l'autre lecture ». La parité cesse d'être une camisole et devient un
    point de départ documenté. Transférable à tout portage de modèle hérité, et
    à ma connaissance rarement formalisé ainsi dans la littérature de modélisation.

