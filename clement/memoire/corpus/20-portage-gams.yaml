    GAMS renvoie ZÉRO, sans avertissement, quand on interroge une table sur une
    colonne qu'elle ne contient pas
  type: piege
  statut: retenu
  severite: critique
  source: [docs/04-vigilance.md#D.1, "context/gams/MODELE.txt:305-307"]
  chiffre: []
  destination: [ch1, ch2, oral, article]
  arcs:
    parce-que: [PORT-01]
    justifie: [PORT-20, PORT-21, DON-20]
  critique: >
    Le fait technique fondateur du mémoire. Il justifie la réécriture (Ch. 1,
    troisième obstacle), le mandat de parité (Ch. 1 §4) et la thèse générale
    « un paramètre absent ne laisse pas un trou, il laisse un nombre plausible »
    (Ch. 2, encadré réflexif). Trois usages d'un seul mécanisme.

