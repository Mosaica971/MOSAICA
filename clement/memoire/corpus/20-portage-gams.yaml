  verdict-anterieur: >
    « Les bans chlordécone sont posés à l'envers dans la configuration » — verdict
    tiré du COMMENTAIRE, qui était faux, alors que le code en dessous était juste.
    Le diagnostic portait sur une prose, pas sur un comportement.
  critique: >
    Cas inverse de PORT-23 et tout aussi instructif : le commentaire ment, le
    code dit vrai. Un lecteur (ou un auteur qui revient) fait confiance au
    commentaire. Argument fort pour MET-31 (ce qui peut être vérifié
    mécaniquement doit l'être, et ce qui ne peut pas l'être doit être bref).

# --- Le bloc CALIB -----------------------------------------------------------

- id: PORT-30
  titre: >
    Le modèle résolu par les auteurs n'est pas celui que l'article évalue —
    le bloc `CALIB` est distinct du bloc `SCENARIO`
  type: resultat
  statut: retenu
  severite: critique
  quand: 2026-07-21
  source: ["context/gams/MODELE.txt:450-565", "docs/superpowers/specs/2026-07-21-calibration-levers-design.md"]
  chiffre: []
  destination: [ch3, annexeB, oral]
  arcs:
    parce-que: [PORT-04]
    justifie: [CAL-10, PORT-31, PORT-32]
  critique: >
    Découverte structurante : elle explique d'un coup pourquoi le premier
    portage donnait 193 % de PAD. Le stage cherchait à reproduire un modèle qu'il
    ne résolvait pas. Enquête à raconter comme telle au Ch. 3.

- id: PORT-31
  titre: >
    `Eq_PN_PIQ_CLD` était appliqué à tort — il est commenté en SCENARIO, pas en
    CALIB, contrairement à `Eq_IG_CLD`
  type: erreur
  statut: erreur-a-posteriori
  severite: majeur
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-calib-parity-rootcause-design.md", "context/gams/MODELE.txt:626"]
  chiffre: []
  destination: [ch3, annexeB]
  arcs:
    parce-que: [PORT-30]
    mesure-par: [VER-02]
  verdict-anterieur: >
    « `Eq_PN_PIQ_CLD` et `Eq_IG_CLD` sont deux contraintes chlordécone de même
    nature, donc actives dans le même bloc. » Elles ne le sont pas : le GAMS n'en
    commente qu'une en CALIB. Erreur d'analogie — deux équations qui se ressemblent
    ont été supposées avoir le même statut, sans le vérifier ligne à ligne.
  critique: >
    Effet : prairie éligible de 76,5 % à 90 % des parcelles. Effet MESURÉ sur la
    calibration : PAD 49,3 → 49,0 %, types 63,3 → 63,8 %. Marginal — et c'est le
    point intéressant : une correction de parité juste peut ne rien changer, ce
    qui a servi à établir que la cause dominante était ailleurs.

