  source: ["docs/superpowers/specs/2026-07-27-reference-state-design.md:23-26"]
  chiffre: []
  destination: [ch3, note]
  arcs:
    parce-que: [CAL-02]
  critique: >
    « Une deuxième implémentation *propre* aurait divergé silencieusement. »
    Corollaire VOULU et explicitement assumé : l'estimation centrale de la
    référence **est** le côté entrée d'un run, au chiffre près. On perd
    l'indépendance des deux calculs — donc la référence ne peut pas servir de
    contre-vérification du pipeline — et on gagne l'impossibilité d'une dérive
    silencieuse entre les deux. Arbitrage assumé dans le bon sens, vu ce que le
    dépôt sait de la dérive silencieuse (ARCH-63).

- id: CAL-94
  titre: >
    DEUX LECTURES de l'assolement observé sont publiées, parce que la règle de
    friche en reclasse 1 208 ha
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-reference-state-design.md:28-34"]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-02]
  critique: >
    La règle GAMS de continuité de friche bascule en `NC` toute parcelle dont
    `cult_2016` ET `cult_2017` sont en jachère : **1 208 ha passent de JA à NC**.
    C'est la lecture qu'utilisent le modèle, la typologie et le PAD — mais ce
    n'est pas ce que dit le RPG brut. « Publier la seule lecture résolue aurait
    rendu la reclassification INVISIBLE. » Et le procédé pour obtenir la lecture
    brute est élégant : passer à la fonction un `cult_2016` jamais en jachère,
    plutôt que dupliquer la table code → groupe — on réutilise la fonction en
    neutralisant son entrée, au lieu d'en écrire une seconde (cf. CAL-93).

- id: CAL-95
  titre: >
    LE CENTRAL SORT DE LA FOURCHETTE PAR LE HAUT — et c'est le résultat le plus
    utile du lot
  type: resultat
  statut: retenu
  severite: critique
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-reference-state-design.md:36-45"]
  chiffre: [mesRepCanne]
  destination: [ch3, ch5, oral, article]
  arcs:
    parce-que: [DON-13, DON-14]
  critique: >
    ⚠ TROUVAILLE MÉTHODOLOGIQUE DE PREMIER ORDRE, absente du brouillon.
    L'encadrement rejoue chaque parcelle avec la variante la moins puis la plus
    intense **parmi celles qui y sont éligibles**. Résultat : sur ventes, revenu,
    heures, azote, GES et IFT, l'estimation centrale tombe **au-dessus de la
    borne haute** — parce que la représentante n'est souvent pas éligible là où
    elle est comptée (canne 31 %, maraîchage 61 %). « Un encadrement SYMÉTRIQUE
    autour du central aurait masqué exactement ce que l'on cherchait. » Autrement
    dit : la fourchette n'a pas servi à exprimer une incertitude, elle a servi à
    RÉVÉLER UN BIAIS, et elle n'a pu le faire que parce qu'elle était construite
    indépendamment du central. Transférable à toute quantification d'incertitude.

- id: CAL-96
  titre: >
    Le plancher de PAD rend un verdict À DOUBLE SENS — il innocente le modèle sur
    les vergers et l'accuse partout ailleurs
  type: resultat
  statut: retenu
  severite: majeur
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-reference-state-design.md:47-55"]
  chiffre: [obsPlancherPad]
  destination: [ch3, annexeE, oral]
  arcs:
    parce-que: [CAL-04, PORT-20]
  critique: >
    ⚠ LE LIEN QUE JE SIGNALAIS COMME MANQUANT (PORT-20 ↔ CAL-55) EST FAIT ICI, ET
    N'A PAS REMONTÉ. Les vergers et agrumes sont irreproductibles POUR CAUSE DE
    PORTAGE D'UN BUG GAMS (`Eq_VE_PLUIE` interdit la culture partout), donc leur
