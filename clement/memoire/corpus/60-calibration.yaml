# --- Les deux déviations, et la règle qu'elles doivent respecter -------------

- id: CAL-25
  titre: >
    LA RÈGLE — toute déviation doit avoir une source EXTÉRIEURE au modèle et à
    l'observé ; une contrainte calée sur l'observé produit un écart nul et
    n'apprend rien
  type: methode
  statut: retenu
  severite: critique
  source: [memoire/chapitres/03-calibrer.tex#sec:deviations]
  chiffre: []
  destination: [ch3, oral, article]
  arcs:
    parce-que: [CAL-20]
    justifie: [CAL-30, CAL-31, CAL-33, CAL-B1, CAL-B2]
  critique: >
    Règle que le travail s'impose à lui-même, donc règle sur laquelle il sera
    jugé : il faut qu'elle tienne sur les DEUX déviations, et elle ne tient
    aujourd'hui que sur une. Voir CAL-32, le point faible, et CAL-34, la mesure
    qui le referme.

- id: CAL-30
  titre: >
    Déviation 1 — plafond de commercialisation du plantain à 6 440 t
    (`bc_quota_max`)
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-modalites-solveur-plantain-design.md", docs/04-vigilance.md#E.4]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-25, DON-01]
    justifie: [CAL-33]
    mesure-par: [CAL-33]
  critique: >
    Sourcé deux fois : chiffre de l'auteur du GAMS, ET Éq. 6 de l'article qui
    pose un débouché de 4 650 t. L'équation existe dans le GAMS mais est
    COMMENTÉE dans les deux blocs modèles, alors que l'article la décrit
    explicitement — bel exemple d'écart entre le code publié et l'article publié.
    Effet : PAD 48,4 → 31,7 %, types 64,0 → 67,0 %, et la banane export remonte
    de 978 à 2 213 ha contre 1 921 observés SANS qu'aucune contrainte ne la nomme.

- id: CAL-31
  titre: >
    Déviation 2 — plancher de surface en prairie à 6 096 ha (`pn_prod_min`)
  type: choix
  statut: retenu
  severite: majeur
  quand: 2026-07-28
  source: ["docs/superpowers/specs/2026-07-28-plancher-prairie-design.md", "case_studies/guadeloupe/config.yaml:437-481"]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-25, DON-30]
    justifie: [CAL-24, CAL-32]
    mesure-par: [CAL-34]

- id: CAL-32
  titre: >
    ⚠ POINT FAIBLE D'EXPOSITION — le paramètre GAMS 6 096 est documenté PAR SON
    PROPRE AUTEUR comme « = surface 2017 PN_PIQ », donc comme l'observé
  type: piege
  statut: ouvert
  severite: critique
  quand: 2026-08-12
  source: ["context/gams/DONNEES.txt:66", "context/Livre_Blanc_CALALOU.pdf table 3", docs/04-vigilance.md#C.3]
  chiffre: []
  destination: [ch3, oral]
  arcs:
    parce-que: [CAL-31]
    contredit: []
    mesure-par: [CAL-34]
  critique: >
    TROIS SOURCES CONVERGENT SUR LE MÊME NOMBRE, ET C'EST L'OBSERVÉ :
      - `DONNEES.txt:66` — « QUOTA_PN_PIQ_MIN Surface minimum de paturage naturel
        à utiliser = surface 2017 PN_PIQ 6096 » (l'auteur le dit lui-même) ;
      - notre propre prairie observée dans le RPG : 6 109 ha (13 ha d'écart) ;
      - CALALOU, « Scénario Observé », Bovins : 6 096 ha exactement.
    Or le Ch. 3 §3.4 écrit seulement : « c'est un paramètre présent dans le GAMS,
    corroboré par la statistique agricole ». Un lecteur qui ouvre `DONNEES.txt`
    y lit « = surface 2017 » et conclut que la déviation 2 VIOLE la règle CAL-25
    que le mémoire vient de poser. Le travail a la réponse (CAL-34), le MÉMOIRE
    ne la donne pas. À corriger en une phrase — c'est la correction la plus
    rentable de tout le chapitre 3.

- id: CAL-33
  titre: >
    LE TEST qui sépare une correction d'un ajustement — le balayage du seuil
    plantain montre un palier plat de 4 650 à 9 240 t
  type: methode
  statut: retenu
  severite: null
  source: [docs/04-vigilance.md#E.4, memoire/chapitres/03-calibrer.tex]
  chiffre: []
  destination: [ch3, oral, article]
  arcs:
    parce-que: [CAL-25]
  critique: >
    Argument en deux temps, et les deux comptent : (a) facteur 2 sur le seuil
    pour 0,5 point de PAD, à peine plus que le bruit du solveur ; (b) l'optimum
    du palier est à l'extrémité HAUTE (×2,4 l'observé), pas au seuil le plus
    serré — un paramètre servant de variable d'ajustement s'améliorerait de façon
    monotone en se rapprochant de l'observé. Ce qui compte n'est pas la valeur du
    plafond mais son EXISTENCE. Raisonnement transférable et publiable.

- id: CAL-34
  titre: >
    LE TEST équivalent pour la prairie — les métriques que le plancher ne touche
    pas TIENNENT sur tout l'intervalle exogène 6 096 → 9 595 ha
  type: methode
  statut: retenu
  severite: critique
  source: ["case_studies/guadeloupe/config.yaml:460-467"]
  chiffre: []
  destination: [ch3, oral]
  arcs:
    parce-que: [CAL-31]
    justifie: [CAL-32]
  critique: >
    ⚠ CE TEST EXISTE, IL EST MESURÉ, ET IL N'EST PAS DANS LE MÉMOIRE.
    Types 86,9 → 82,0 %, parcelles 67,6 → 65,2 %, surface 77,1 → 72,2 % —
    TOUTES au-dessus des seuils publiés de l'article, sur toute la plage. Et le
    PAD hors prairie EMPIRE quand on monte vers Agreste (14,9 → 18,5 → 24,0 %),
    parce que le plancher prend alors de la terre à la canne, la culture que le
    RPG mesure le MIEUX (98 % contre 87 % de couverture globale). C'est la
    réponse complète à CAL-32 : la conclusion ne dépend pas du choix de 6 096.

- id: CAL-B1
  titre: "BRANCHE COUPÉE — recalibrer les coefficients d'aversion au risque"
  type: choix
  statut: ecarte
  severite: null
  source: [docs/04-vigilance.md#E.5, TODO.md]
  chiffre: []
  destination: [ch3, oral]
  arcs:
    mesure-par: [VER-02]
    parce-que: [CAL-25]
  critique: >
    Descend le PAD à 39,9 % mais au prix de coefficients économiquement absurdes
    — un exploitant spécialisé devenant « très averse ». C'est du surajustement,
    et l'article dit lui-même (§2.5) que sa Table 2 EST déjà le résultat de sa
    calibration par 100 itérations. Ce ne sont donc pas des coefficients à
    re-tuner : branche coupée deux fois, par la mesure et par la source.

- id: CAL-B2
  titre: "BRANCHE COUPÉE — caler des plafonds de marché sur l'observé"
  type: choix
  statut: ecarte
  severite: null
  source: [docs/04-vigilance.md#E.5]
  chiffre: []
  destination: [ch3]
  arcs:
    mesure-par: [CAL-33]
    parce-que: [CAL-25]
  critique: >
    Descend à 33,6 % et est circulaire par construction (PAD nul par
    construction sur les postes calés). Branche coupée par principe ET chiffrée
    — c'est ce qui rend le refus crédible plutôt que pudique.

- id: CAL-B3
  titre: "BRANCHE COUPÉE — incorporer l'élevage pour refermer l'écart"
  type: choix
  statut: ecarte
  severite: null
  source: [docs/04-vigilance.md#E.5]
  chiffre: []
  destination: [ch3, ch6, note]
  arcs:
    mesure-par: [CAL-80, CAL-83, CAL-84]
    parce-que: [CAL-25]
  critique: >
    L'écart EST chiffré, contrairement à ce que je notais d'abord : la
    décomposition des 3 489 ha de prairie perdus attribue 36 % au couplage avec
    l'élevage (CAL-80), la ligne main d'œuvre de la prairie diverge de la Table 1
    de 126 contre 70 h/ha (CAL-83), et ces 126 h/ha sont intégralement du travail
    de TROUPEAU (CAL-84). Le mécanisme manquant est donc nommé ET mesuré ; ce qui
    reste théorique est seulement la RAISON DE NE PAS L'AJOUTER — il faudrait une
    variable d'état interdisant de liquider un cheptel sans coût, hors de portée
    d'un modèle mono-période, limite que l'article reconnaît lui-même.
    Chantier n°3 de la liste « à faire » : l'item fait le pont vers PERSP-10.

- id: CAL-B4
  titre: "BRANCHE COUPÉE — resserrer le gap MIP pour récupérer la prairie"
  type: choix
  statut: ecarte
  severite: null
  quand: 2026-07-27
  source: ["docs/superpowers/specs/2026-07-27-calib-parity-rootcause-design.md"]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    mesure-par: [VER-02]
    parce-que: [SOLV-54]
  critique: >
    Testé (output_4, gap 1e-3) et abandonné : le solve tape la limite d'1 h avec
    un incumbent IDENTIQUE à la solution 1 %, zéro prairie récupérée. « Le leak
    de prairie est une limite d'intractabilité B&B, pas un bouton de réglage. »
    Branche coupée par expérience, pas par raisonnement. Modèle du genre.

