- id: CAL-14
  titre: >
    Le PAD par exploitation a une MÉDIANE de 18,5 % pour une MOYENNE de 51,5 % —
    la moitié des fermes est sous le seuil de l'article
  type: resultat
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#E.6]
  chiffre: []
  destination: [ch3, annexeE]
