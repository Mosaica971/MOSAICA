  critique: >
    Le commit du plancher de prairie le nomme lui-même : « même signature
    émergente que la banane sous le plafond plantain la veille ». Banane export
    978 → 2 213 ha contre 1 921 observés sous une contrainte qui porte sur le
    PLANTAIN ; canne 12 782 contre 12 813 observés sous une contrainte qui porte
    sur la PRAIRIE. Deux fois, une contrainte sur un poste ramène un AUTRE poste
    à sa valeur observée. C'est le seul type de validation qui ne puisse pas être
    de l'ajustement — et le fait qu'elle se produise DEUX FOIS, sur deux
    mécanismes indépendants, est bien plus fort qu'une occurrence isolée.

