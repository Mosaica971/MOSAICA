# =============================================================================
# 60 — CALIBRATION                                                 préfixe : CAL
#
# À quoi le modèle est comparé, avec quelle métrique, ce que chaque contrainte
# apporte, et — la partie qui a pris le plus de temps — comment distinguer une
# correction légitime d'un ajustement circulaire.
#
# C'est le chapitre où le mémoire prend son plus grand risque méthodologique :
# il se donne une règle (« toute déviation doit avoir une source extérieure au
# modèle ET à l'observé ») puis doit prouver qu'il la respecte.
# =============================================================================

# --- Ce à quoi on compare ----------------------------------------------------

- id: CAL-01
  titre: >
    Un modèle d'optimisation ne se valide pas comme un modèle prédictif : il ne
    reproduit pas ce qui a été fait, il représente comment on arbitre
  type: notion
  statut: retenu
  severite: null
  source: [memoire/chapitres/03-calibrer.tex]
  chiffre: []
  destination: [ch3, oral]
  arcs:
    justifie: [CAL-02, CAL-10]
  critique: >
    Cadrage épistémique qui porte tout le chapitre. Bien formulé : « si le modèle
    laissé libre retrouve quelque chose qui ressemble au territoire, ses réponses
    contrefactuelles méritent d'être écoutées ; sinon elles décrivent un autre
    territoire ».

- id: CAL-02
  titre: >
    L'état de référence 2017 est construit comme un ARTEFACT AUTONOME,
    régénérable en ~5 s sans aucun solve
  type: choix
  statut: retenu
  severite: null
  quand: 2026-07-27
  source: [scripts/build_reference_state.py, "docs/superpowers/specs/2026-07-27-reference-state-design.md"]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-01]
    justifie: [CAL-03]
  critique: >
    Décision qui a l'air technique et ne l'est pas : tant que l'observé n'existe
    que comme le « côté entrée » d'un run, on ne peut pas l'examiner séparément,
    donc on ne peut pas dire ce qu'il ignore. C'est l'argument le plus fin du
    Ch. 3 et il se généralise à tout travail de validation.

- id: CAL-03
  titre: >
    `REFERENCE.md` documente surtout ce que la référence NE PEUT PAS dire —
    c'est la partie qui compte
  type: methode
  statut: retenu
  severite: null
  source: [outputs/reference_2017/REFERENCE.md]
  chiffre: []
  destination: [ch3, ch5, note]
  arcs:
    parce-que: [CAL-02]
    justifie: [REF-30]

- id: CAL-04
  titre: >
    Un plancher d'écart imposé par l'éligibilité : 348 ha sur 23 578 sont
    irreproductibles par toute variante fine, soit 1,5 % de PAD incompressible
  type: resultat
  statut: retenu
  severite: majeur
  source: [docs/04-vigilance.md#E.6, outputs/reference_2017/]
  chiffre: [obsSurfaceIrreproductible, obsPlancherPad]
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-02, SOLV-02]
  critique: >
    Lecture décisive : tout écart au-delà de 1,5 % est un CHOIX d'optimisation,
    pas une impossibilité agronomique. Le plancher est bas, donc l'argument
    « c'est le masque qui empêche » tombe. Résultat négatif, très utile.

# --- La métrique -------------------------------------------------------------

- id: CAL-10
  titre: >
    Le PAD (pourcentage d'écart absolu) de Chopin et al. §2.6, à quatre échelles
    emboîtées — territoire, sous-région, exploitation, île
  type: methode
  statut: retenu
  severite: null
  source: ["context/Chopin et al 2015 pour Hal.pdf §2.6", case_studies/guadeloupe/reporting/calibration.py]
  chiffre: [mesArtPad]
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-01]
    justifie: [CAL-11, CAL-12, CAL-13]

- id: CAL-11
  titre: >
    Convention — le PAD d'une culture inventée là où rien n'était observé est
    INDÉFINI, pas infini : la ligne est écartée, pas comptée comme échec maximal
  type: choix
  statut: retenu
  severite: majeur
  source: [memoire/chapitres/03-calibrer.tex#sec:pad, case_studies/guadeloupe/reporting/calibration.py]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-10]
  critique: >
    Choix qui FAVORISE le modèle : compter ces lignes comme des échecs maximaux
    dégraderait le score. Il doit donc être annoncé par celui qui en profite,
    faute de quoi un lecteur le découvrira lui-même et doutera du reste.

- id: CAL-12
  titre: >
    Convention — le total est le rapport des SOMMES, pas la moyenne des rapports,
    si bien que son verdict est indépendant des verdicts par culture
  type: choix
  statut: retenu
  severite: majeur
  source: [memoire/chapitres/03-calibrer.tex#sec:pad]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [CAL-10]
  critique: >
    Conséquence contre-intuitive à dire : un total sous le seuil ne signifie PAS
    que les cultures y sont.

- id: CAL-13
  titre: >
    Toute comparaison se fait au niveau des 12 groupes RPG — les 84 variantes
