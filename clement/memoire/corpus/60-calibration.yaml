  critique: >
    À rapprocher de CAL-82 : `CS_MG_NISM` absorbe à elle seule 1 042 ha, et son
    avantage sur la prairie est de 15 €/ha (0,94 %). Une île entière bascule sur
    un écart inférieur à la tolérance du solveur et à toute incertitude de
    données plausible. C'est l'illustration la plus frappante de la SENSIBILITÉ
    d'un modèle d'allocation — et elle est géographiquement lisible, donc
    cartographiable.
