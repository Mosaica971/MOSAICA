    ne fait que l'un des deux.

- id: CAL-97
  titre: >
    Les parcelles `NC` ne peuvent PAS être ignorées — elles diminuent le
    dénominateur et remontent toutes les parts
  type: piege
  statut: retenu
  severite: majeur
  quand: 2026-07-21
  source: ["docs/superpowers/specs/2026-07-21-calibration-validation-design.md:256-268"]
  chiffre: []
  destination: [annexeE, note]
  arcs:
    parce-que: [CAL-10]
  critique: >
    `compute_type_expl` calcule `denom = surf_cultiv − surf_non`. Reconstruire la
    typologie depuis `allocation_input.csv`, qui écarte les `NC`, traiterait ces
    parcelles comme INEXISTANTES et non comme NON CULTIVÉES — ce qui décale les
    parts et **peut faire basculer un type d'exploitation**. D'où la décision de
    prendre le `Dataset` et de recalculer sur l'univers complet. Piège de
    dénominateur classique, avec une conséquence discrète : un type mal attribué
    fausse l'AVERS, donc l'objectif, donc l'optimum.

