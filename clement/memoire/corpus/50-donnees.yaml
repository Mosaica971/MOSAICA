# =============================================================================
# 50 — LES DONNÉES                                                 préfixe : DON
#
# Ce que le jeu contient, ce qu'il ne contient pas, et surtout ce qu'il contient
# SANS QUE ÇA SE VOIE. La thèse du domaine tient en une phrase du chapitre 2 :
# « un paramètre absent ne laisse pas un trou, il laisse un nombre plausible ».
# =============================================================================

# --- Le défaut structurant ---------------------------------------------------

- id: DON-01
  titre: >
    Les rendements du modèle valent 2 à 4 fois ceux du territoire — et le melon,
    lui, tombe juste
  type: donnee
  statut: retenu
  severite: majeur
  quand: 2026-07-29
  source: [docs/04-vigilance.md#C.1, "Agreste SAA 2017"]
  chiffre: []
  destination: [ch3, ch5, annexeE, oral, article]
  arcs:
    justifie: [DON-02, CAL-30]
  critique: >
    Ananas 34,0 contre 12,3 t/ha ; plantain 26,0 contre 9,0 ; maraîchage 43,9
    contre 10,8 ; agrumes 20,0 contre 5,2 ; melon 20,0 contre 19,9 ✓. Une part
    de l'écart est légitime (Agreste moyenne tous les producteurs, `Rdt_Cult`
    décrit des itinéraires spécifiés) mais un facteur 3-4 ne s'explique pas par
    cela seul — et le melon prouve que la comparaison est faisable.

- id: DON-02
  titre: >
    CONSÉQUENCE — la marge de ces cultures est mécaniquement surestimée, donc le
    modèle en couvre l'île dès qu'aucun débouché ne les borne
  type: resultat
  statut: retenu
  severite: critique
  source: [docs/04-vigilance.md#C.1]
  chiffre: []
  destination: [ch3, oral, article]
  arcs:
    parce-que: [DON-01]
    justifie: [DON-B1]
  critique: >
    ⚠ RETOURNEMENT IMPORTANT ET SOUS-EXPLOITÉ. Les plafonds de marché ne sont
    PAS des béquilles ajoutées pour faire joli : ils compensent une productivité
    surévaluée EN AMONT. C'est la cause commune du plantain, de l'ananas et de
    l'igname. Le Ch. 3 justifie chaque déviation une par une ; cette explication
    unique les couvre toutes et n'y figure pas. Elle vaut un paragraphe.

- id: DON-B1
  titre: "BRANCHE COUPÉE — corriger les rendements pour qu'ils collent à Agreste"
  type: choix
  statut: ecarte
  severite: null
  source: [docs/04-vigilance.md#C.1, TODO.md]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [PORT-01]
    mesure-par: []
  sans-mesure: >
    Fermée par le MANDAT, et un mandat ne se mesure pas. `Rdt_Cult` EST la Table 1
    de Chopin et al. (2015) : la corriger romprait la parité au point exact où
    elle sert le plus, puisque tout désaccord ultérieur entre les deux modèles
    deviendrait inexplicable (PORT-02). L'écart aux statistiques est donc porté,
    documenté, et sert d'explication à la sur-performance simulée — pas corrigé.
  critique: >
    Bon exemple d'une contrainte de méthode qui interdit la solution évidente ET
    produit une meilleure compréhension : c'est parce qu'on n'a pas eu le droit de
    toucher aux rendements qu'on a dû comprendre pourquoi ils divergeaient.

