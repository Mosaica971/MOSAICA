  critique: >
    ⚠ NUANCE MAJEURE ABSENTE DU BROUILLON, ET ELLE RENVERSE LA LECTURE. Les
    systèmes paillés (bagasse / BRF / paille × fertilisation) ne sont pas des
    doublons parasites à supprimer : ce sont LES systèmes agroécologiques du jeu.
    Les fermer est un choix de TRACTABILITÉ, pas de modélisation, et il a un coût
    scientifique : le dispositif ne peut pas évaluer les itinéraires
    agroécologiques qu'il prétend explorer, faute que quiconque les ait renseignés.
    Le dire ainsi est bien plus fort que « 25 doublons » — et c'est exactement le
    point de jonction avec CTX-21 (le terrain qui n'a pas eu lieu) et PERSP-B (le
    classeur à remplir).

