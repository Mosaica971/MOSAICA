- id: DON-12
  titre: >
    Cette hypothèse influence désormais L'ALLOCATION et pas seulement le
    reporting : le plafond de main d'œuvre est calculé via les représentantes
  type: piege
  statut: retenu
  severite: critique
  source: [docs/04-vigilance.md#C.2, memoire/chapitres/03-calibrer.tex]
  chiffre: []
  destination: [ch3, oral]
  arcs:
    parce-que: [DON-11]
  critique: >
    Changer une représentante change le plafond, donc l'OPTIMUM. Une hypothèse
    de reporting qui migre vers le cœur du modèle sans que personne ne l'ait
    décidé : c'est le meilleur exemple du dépôt d'une dette qui se propage d'une
    couche à l'autre sans franchir de décision explicite.

- id: DON-13
  titre: >
    PIRE — la représentante est souvent une culture que le modèle INTERDIRAIT sur
    la parcelle qu'elle représente : canne 31 %, maraîchage 61 %, plantain 63 %
  type: piege
  statut: retenu
  severite: critique
  quand: 2026-07-27
  source: [docs/04-vigilance.md#C.2, outputs/reference_2017/csv/reference_representative_eligibility.csv]
  chiffre: [mesRepCanne]
  destination: [ch3, oral, note]
  arcs:
    parce-que: [DON-11]
    justifie: [PERSP-30]
  critique: >
    31 % pour la canne, qui occupe plus de la moitié du territoire. Ce n'est plus
    une approximation cosmétique : la représentante inéligible fausse l'économie
    de la référence ET le plafond de main d'œuvre, donc l'optimum. Le correctif
    naturel (choisir la représentante PAR PARCELLE parmi les variantes éligibles)
    est identifié, chiffré, et non fait — c'est le meilleur candidat de la liste
    « à faire » par rapport qualité/coût.

- id: DON-14
  titre: >
    Conséquence en cascade — tout indicateur d'entrée est une FOURCHETTE
    basse/haute, jamais un point
  type: methode
  statut: retenu
  severite: majeur
  source: [outputs/reference_2017/REFERENCE.md, docs/04-vigilance.md#E.6]
  chiffre: []
  destination: [ch3, annexeE]
  arcs:
    parce-que: [DON-11]
    justifie: [CAL-56]
  critique: >
    Décision de présentation honnête : refuser un chiffre central quand
    l'incertitude le rend arbitraire. Et elle a une conséquence gênante que le
    mémoire assume (CAL-56) : plusieurs indicateurs simulés tombent DANS la
    fourchette, donc l'accord ne prouve rien non plus.

