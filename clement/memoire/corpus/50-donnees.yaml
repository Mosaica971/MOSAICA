- id: DON-70
  titre: >
    ⚠⚠ LA PLUVIOMÉTRIE MENSUELLE EXISTE — elle est dans `context/`, et le dépôt
    la déclare « inexistante » depuis juillet
  type: donnee
  statut: ouvert
  severite: critique
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §5"]
  chiffre: []
  destination: [ch2, ch5, ch6, note, oral]
  arcs:
    contredit: [DON-20]
    justifie: [PERSP-60]
  critique: >
    ⚠ TROUVAILLE LA PLUS ACTIONNABLE DU DÉPOUILLEMENT. `docs/04-vigilance.md` C.4
    et la spec eau/carbone affirment toutes deux que l'indicateur d'irrigation
    nette est « débloquable par une série pluviométrique mensuelle par parcelle,
    QUI N'EXISTE PAS AUJOURD'HUI ». Or le rapport technique contient une section
    « Calcul de la répartition mensuelle des précipitations annuelles » et
    publie la CLÉ complète, moyennée sur trois stations INRA (Gardel, Duclos,
    Godet) et neuf années complètes communes : janvier 7,4 %, février 3,8 %,
    mars 4,6 %, avril 9,1 %, mai 10,3 %, juin 6,8 %, juillet 8,2 %, août 11,4 %,
    septembre 9,6 %, octobre 11,7 %, novembre 9,9 %, décembre 7,3 %.
    `PLUVIO_01..12_PARC` était donc destinée à valoir `PLUVIO_PARC × clé`. Les
    colonnes sont absentes de la table livrée, mais la MÉTHODE et les
    COEFFICIENTS sont dans le dépôt. Le blocage n'était pas une absence de
    donnée, c'était une absence de LECTURE.

- id: DON-71
  titre: >
    `PLUVIO_PARC` est une NORMALE CLIMATIQUE 1981-2010, pas la pluie de 2017
  type: donnee
  statut: retenu
  severite: majeur
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §5"]
  chiffre: []
  destination: [ch2, ch3, annexeB, note]
  arcs:
    parce-que: [DON-70]
  critique: >
    Carte Météo-France de la normale 1981-2010 des cumuls de précipitations,
    interpolée par krigeage sphérique au pas de 10 m. Conséquence pour la
    lecture : les critères d'éligibilité pluviométrique du modèle — et donc
    l'ensemble des couples éligibles, donc la taille du MILP — reposent sur un
    climat MOYEN sur trente ans, pas sur l'année simulée. Un run « 2017 » n'a
    jamais vu la pluie de 2017. Ce n'est pas un défaut (une normale est le bon
    choix pour une éligibilité structurelle) mais c'est une hypothèse invisible
    dans les tables, et elle interdit tout scénario climatique fondé sur une
    année réelle.

- id: DON-72
  titre: >
    ⚠ LES DEUX INDICATEURS DE CHLORDÉCONE SONT AGRÉGÉS EN SENS OPPOSÉS —
    « Minimum » pour le risque, « Maximum » pour le réel
  type: piege
  statut: ouvert
  severite: critique
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §11-12"]
  chiffre: []
  destination: [ch1, ch2, ch5, note, oral]
  arcs:
    parce-que: [CTX-04]
  critique: >
    ⚠ HYPOTHÈSE CACHÉE SUR UNE CONTRAINTE DE SANTÉ PUBLIQUE. `RISQUE_CLD` est la
    statistique zonale **Minimum** de la classe de risque sur la parcelle ;
    `CLD_REEL` est le **Maximum**, calculé sur une parcelle érodée de 5 m. Or ce
    sont les règles `Eq_IG_CLD` et `Eq_PN_PIQ_CLD` — donc l'éligibilité de
    l'igname tutorée et de la prairie pâturée — qui lisent `RISQUE_CLD`. Le
    modèle retient donc, pour chaque parcelle, **la classe la plus favorable
    rencontrée**, ce qui est la lecture la plus PERMISSIVE possible. Une parcelle
    à cheval sur une zone saine et une zone contaminée est traitée comme saine.
    Aucun document du dépôt ne le signale, et l'inversion Min/Max entre les deux
    couches suggère que le choix est délibéré — mais il faudrait le confirmer
    avec la source avant d'en tirer quoi que ce soit.

- id: DON-73
  titre: >
    L'ASSOLEMENT OBSERVÉ 2017 CONTIENT DES CORRECTIONS MANUELLES — 419 parcelles
    reclassées de café/cacao en canne à sucre
  type: donnee
  statut: retenu
  severite: critique
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §15"]
  chiffre: []
  destination: [ch3, ch5, annexeE, oral, article]
  arcs:
    parce-que: [CAL-02]
    justifie: [DON-74]
  critique: >
    ⚠ CECI TOUCHE LA RÉFÉRENCE ELLE-MÊME, DONC TOUT LE CHAPITRE 3. Sur 444
    parcelles déclarées en CAC en 2017, seules **25** sont conservées (19 en
    café/cacao en 2016, 3 en banane créole, 3 en agrume) ; **le reste bascule en
    « canne à sucre - autre »**. De même, les ACA de 2016 ont été modifiées parce
    que « le nombre d'hectares est bien trop élevé » (455 ha contre environ 250).
    L'observé auquel le modèle est comparé n'est donc PAS une observation brute :
    c'est un jeu corrigé selon des règles de décision documentées ici et nulle
    part ailleurs. Ça ne l'invalide pas — les corrections sont raisonnées et
    tracées — mais ça change son STATUT épistémique, et ça donne un troisième
    exemple, après CAL-88, de ce que « la référence n'est pas la vérité » veut
    dire concrètement.

- id: DON-74
  titre: >
    414 doublons supprimés sur 25 149 parcelles — d'où les 24 734 du modèle
  type: donnee
  statut: retenu
  severite: majeur
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §13"]
  chiffre: [obsParcelles]
  destination: [ch3, annexeB, note]
  arcs:
    parce-que: [DON-73]
  critique: >
    La cause des doublons est prosaïque et parlante : « la non-suppression d'un
    ancien i-pacage lorsque la parcelle change de propriétaire ». La règle de
    décision est « on conserve la déclaration du DERNIER i-pacage introduit dans
    la base », et l'identification passe par une cascade de trois jointures
    spatiales (étendues identiques, puis érosion de 15 m, puis de 5 m).
    25 149 − 414 = 24 735, soit à une unité près les 24 734 parcelles du modèle.
    ⚠ Ce chiffre RECOUPE de l'extérieur la jointure reconstruite de DON-40 : les
    deux univers coïncident parce qu'ils descendent du même fichier dédoublonné.

- id: DON-75
  titre: >
    « Irrigable » signifie « à moins de 800 m d'une borne d'irrigation »
  type: donnee
  statut: retenu
  severite: majeur
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §6"]
  chiffre: []
  destination: [ch2, annexeB, note]
  arcs:
    justifie: [ARCH-21]
  critique: >
    Zone tampon de 800 m autour des bornes du réseau du Conseil général, puis
    jointure spatiale par intersection. C'est donc un PROXY d'accès potentiel,
    pas un raccordement effectif ni un droit d'eau. ⚠ Conséquence directe sur
    `ModelInputs.plot_weights` (ARCH-21) : le poids `irrigable` qui corrige le
    calcul d'eau d'un facteur 1,6 repose sur un rayon de 800 m choisi par le
    producteur de la donnée. Le chiffre de 35 Mm³ hérite de ce choix.

- id: DON-76
  titre: >
    Chaque attribut de parcelle porte une règle d'agrégation, et elles ne sont
    pas les mêmes
  type: donnee
  statut: retenu
  severite: majeur
  quand: 2026-08-12
  source: ["context/Rapport technique variables MOSAICA_v2.docx §2-12"]
  chiffre: []
  destination: [ch2, annexeB, note]
  arcs:
    justifie: [DON-72]
  critique: >
    Altitude et pente : **Mean** sur un MNT ré-échantillonné de 1 m à 10 m.
    Pédologie : **Majority** — le sol d'une parcelle est sa classe majoritaire,
    pas une composition. Pluviométrie : **Mean** d'une normale krigée. Risque
    chlordécone : **Minimum**. Chlordécone réelle : **Maximum**. Bassin versant :
    « Have their center in ». GFA : intersection avec la zone érodée de 15 m.
    Sept attributs, cinq règles différentes. Chacune est défendable isolément ;
    aucune n'est visible dans la table livrée, et aucune n'est mentionnée dans le
    modèle qui les consomme. C'est la forme la plus pure du thème ARCH-63 — la
    donnée arrive avec des décisions incorporées et silencieuses.

