# =============================================================================
# 10 — CONTEXTE ET COMMANDE                                        préfixe : CTX
#
# Le territoire, la lignée de projets (CALALOU → TI-FIG), la lettre de mission,
# et l'écart entre ce qui était commandé et ce qui a été fait.
