# --- La lignée de projets ----------------------------------------------------

- id: CTX-10
  titre: >
    CALALOU (2021-2025) est l'ancêtre direct : « de la fourchette à la fourche »,
    interdisciplinaire, coordonné par S. Drogué, avec J.-M. Blazy et L. Guindé
    parmi les auteurs
  type: organisation
  statut: retenu
  severite: null
  quand: 2025-02
  source: [context/Livre_Blanc_CALALOU.pdf]
  chiffre: []
  destination: [ch0, ch1, ch5]
  arcs:
    parce-que: [CTX-02]
    justifie: [CTX-11, CTX-12, CTX-13, CTX-20]
  critique: >
    À NE PAS OMETTRE dans l'introduction : le stage ne commence pas à une page
    blanche, il s'inscrit dans une lignée où ses propres encadrants sont
    co-auteurs. C'est ce qui donne sa force à REF-11 (porter le modèle de ses
    propres encadrants) et ce qui explique le mandat de parité.

- id: CTX-11
  titre: >
    CALALOU a utilisé MOSAICA (version GAMS) dans son WP4, alimenté par les
    résultats nutritionnels du WP1
  type: organisation
  statut: retenu
  severite: null
  source: [context/Livre_Blanc_CALALOU.pdf]
  chiffre: []
  destination: [ch1, ch5]
  arcs:
    parce-que: [CTX-10]
    justifie: [CTX-12, CTX-B1]
  critique: >
    Preuve directe que le GAMS n'était pas un objet mort quand le stage a
    commencé : il tournait encore en 2024. Nuance donc le récit « personne ne
    savait plus le faire tourner » du Ch. 1 — la formulation exacte compte.
    À vérifier avec l'encadrement : qui l'a lancé pour CALALOU, et comment.

- id: CTX-12
  titre: >
    CALALOU trouve DÉJÀ, sur trois scénarios, que la relocalisation alimentaire
    se paie en canne et en banane export
  type: resultat
  statut: retenu
  severite: majeur
  quand: 2025-02
  source: [context/Livre_Blanc_CALALOU.pdf table 3]
  chiffre: []
  destination: [ch1, ch4, ch5, article]
  arcs:
    parce-que: [CTX-11]
    justifie: [ART-10, PROS-21]
  critique: >
    CHIFFRES CALALOU : scénario Reloc, banane export 1 717 → 4 ha, canne
    12 908 → 3 159 ha ; Nutri+Reloc, banane → 61 ha, canne → 1 767 ha.
    Le front budgétaire du Ch. 4 retrouve la MÊME structure (banane 2 004 → 95 ha,
    canne −2 231 ha) par un levier tout autre (l'enveloppe publique, pas une
    demande imposée). C'est une CORROBORATION indépendante et il faut la citer —
    mais c'est aussi une limite de nouveauté à instruire pour l'article.

- id: CTX-13
  titre: >
    CALALOU écrit explicitement que la disparition de la canne et de la banane
    « dégagerait des subsides importants » pour le maraîchage et le fruitier
  type: resultat
  statut: retenu
  severite: majeur
  quand: 2025-02
  source: [context/Livre_Blanc_CALALOU.pdf §3.4]
  chiffre: []
  destination: [ch4, ch5, article]
  arcs:
    parce-que: [CTX-12]
    justifie: [ART-10]
  critique: >
    ⚠ POUR L'ARTICLE. Le résultat qualitatif « les aides tiennent la canne et la
    banane » est DÉJÀ dans la littérature du projet. Ce qui est neuf dans le
    Ch. 4 n'est donc pas le sens de l'effet mais sa MESURE MARGINALE (la pente
    en € de marge ajustée par € public, le palier, l'écart au dual local) et
    l'interprétation « l'aide publique n'achète pas de la marge, elle achète de
    la stabilité » — que CALALOU ne pouvait pas formuler, n'ayant pas de front.
    Ne pas présenter le résultat comme une découverte : le présenter comme la
    quantification d'un constat de la lignée.

- id: CTX-14
  titre: >
    CALALOU mesure aussi que les scénarios demandent +10 à +60 % de main d'œuvre
    agricole à SAU constante
  type: resultat
  statut: retenu
  severite: null
  source: [context/Livre_Blanc_CALALOU.pdf §3.4]
  chiffre: []
  destination: [ch3, ch4]
  arcs:
    parce-que: [CTX-11]
    justifie: [SOLV-60]
  critique: >
    Corrobore de l'extérieur que le plafond de main d'œuvre est le facteur
    limitant du modèle (SOLV-60/61), et le fait sur un tout autre jeu de
    scénarios. Bon appui pour le Ch. 3.

- id: CTX-15
  titre: >
    CALALOU a mené une démarche PARTICIPATIVE — séminaire du 27/09/2024,
    World Café, questionnaire, acteurs du territoire
  type: organisation
  statut: retenu
  severite: null
  quand: 2024-09-27
  source: [context/Livre_Blanc_CALALOU.pdf §4]
  chiffre: []
  destination: [ch5, oral]
  arcs:
    parce-que: [CTX-10]
    justifie: [REF-22]
  critique: >
    ⚠ ITEM RÉFLEXIF DE PREMIER ORDRE. Le projet ancêtre a fait la conception
    participative que la lettre de mission du stage prévoyait et qui n'a pas eu
    lieu. Le catalogue de dix politiques écrit seul dans un YAML (REF-22) n'est
    donc pas un manque abstrait : il y avait un précédent méthodologique dans le
    même laboratoire, sur le même territoire, deux ans plus tôt. C'est beaucoup
    plus fort que « les enquêtes n'ont pas eu lieu ».

- id: CTX-16
  titre: >
    CALALOU tenait la SAU constante, les structures d'exploitation inchangées et
    les rendements figés aux pratiques actuelles
  type: choix
  statut: retenu
  severite: null
  source: [context/Livre_Blanc_CALALOU.pdf §3.4]
  chiffre: []
  destination: [ch4, article]
  arcs:
    parce-que: [CTX-11]
  critique: >
    Les mêmes hypothèses que le stage, à une exception près : le forçage
    `land_take` (artificialisation) desserre la SAU constante. Petit gain de
    généralité à signaler, et à ne pas surestimer.

- id: CTX-B1
  titre: >
    BRANCHE COUPÉE — reprendre le pipeline CALALOU (scénarios Reloc / Nutri)
    plutôt que construire un dispositif politiques × forçages
  type: choix
  statut: ecarte
  severite: null
  source: [context/Livre_Blanc_CALALOU.pdf, memoire/chapitres/04-explorer.tex]
  chiffre: []
  destination: [ch4, ch5]
  arcs:
    mesure-par: []
  sans-mesure: >
    ⚠ CE N'EST PAS UNE BRANCHE COUPÉE, C'EST UNE BRANCHE JAMAIS OUVERTE — et le
    dire ainsi est le seul traitement honnête. La bifurcation n'a jamais été posée
    explicitement : le dispositif politiques × forçages a été construit sans que
    la reprise du cadre CALALOU soit envisagée puis écartée. La justification
    donnée ci-dessous est donc RECONSTRUITE a posteriori, ce qui la rend valable
    comme explication et nulle comme preuve.
  critique: >
    Les scénarios CALALOU sont des scénarios de
    DEMANDE (doubler les volumes) ; ceux du stage sont des scénarios de
    POLITIQUE (plafonner un intrant, redéployer une aide). Les deux répondent à
    des questions différentes et le second est plus proche de la commande TI-FIG.
    Mais la bifurcation n'a jamais été posée explicitement, et la comparabilité
    avec CALALOU en est perdue. Un scénario « Reloc » rejoué dans le nouveau
    dispositif serait un pont utile, et il est bon marché (c'est un YAML).

